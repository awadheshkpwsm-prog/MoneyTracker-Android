name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-android:

    name: Build MoneyTracker Android APK

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 4. LINUX DEPENDENCIES
      # ==========================================================

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            build-essential


      # ==========================================================
      # 5. INSTALL BUILDOZER
      # ==========================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo ""
          echo "CYTHON"

          cython --version


      # ==========================================================
      # 6. VERIFY PROJECT
      # ==========================================================

      - name: Verify MoneyTracker project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT VERIFICATION"
          echo "=========================================="

          pwd

          echo ""
          echo "Root files:"
          ls -lah

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo "buildozer.spec OK"

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo "main.py OK"

          echo ""
          echo "Checking mt folder..."

          test -d mt

          echo "mt folder OK"

          echo ""
          echo "MT files:"

          find mt -maxdepth 2 -type f -print | sort


      # ==========================================================
      # 7. SHOW SPEC
      # ==========================================================

      - name: Show Buildozer configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          cat buildozer.spec


      # ==========================================================
      # 8. CREATE CLEAN ANDROID SDK
      # ==========================================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "PREPARING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"


      # ==========================================================
      # 9. DOWNLOAD ANDROID COMMAND LINE TOOLS
      # ==========================================================

      - name: Install Android command line tools
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID COMMAND LINE TOOLS"
          echo "=========================================="

          cd "$RUNNER_TEMP"

          rm -f android-commandline-tools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-commandline-tools.zip

          rm -rf "$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$RUNNER_TEMP/android-cmdline-tools"

          unzip -q \
            android-commandline-tools.zip \
            -d "$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          echo ""
          echo "Command line tools installed."

          echo ""
          echo "SDK structure:"

          find "$SDK/cmdline-tools/latest" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ==========================================================
      # 10. DO NOT CREATE tools SYMLINK
      #
      # Buildozer's p4a will receive a clean SDK.
      # sdkmanager is provided through PATH.
      # ==========================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "CONFIGURING ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo ""
          echo "sdkmanager:"
          command -v sdkmanager

          echo ""
          echo "sdkmanager version:"
          sdkmanager --version


      # ==========================================================
      # 11. ACCEPT LICENSES
      # ==========================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "=========================================="
          echo "ANDROID LICENSES"
          echo "=========================================="

          yes | sdkmanager \
            --sdk_root="$SDK" \
            --licenses || true


      # ==========================================================
      # 12. INSTALL SDK COMPONENTS
      # ==========================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "=========================================="
          echo "INSTALLING SDK COMPONENTS"
          echo "=========================================="

          sdkmanager \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"


      # ==========================================================
      # 13. VERIFY SDK
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          command -v sdkmanager

          sdkmanager --version

          echo ""
          echo "Installed packages:"

          sdkmanager \
            --sdk_root="$SDK" \
            --list_installed

          echo ""
          echo "Checking Build Tools 37.0.0..."

          test -d "$SDK/build-tools/37.0.0"

          echo "Build Tools 37.0.0 OK"

          echo ""
          echo "Checking AIDL..."

          test -x "$SDK/build-tools/37.0.0/aidl"

          "$SDK/build-tools/37.0.0/aidl" --help >/dev/null

          echo "AIDL OK"

          echo ""
          echo "Checking AAPT2..."

          test -x "$SDK/build-tools/37.0.0/aapt2"

          echo "AAPT2 OK"

          echo ""
          echo "Checking D8..."

          test -x "$SDK/build-tools/37.0.0/d8"

          echo "D8 OK"


      # ==========================================================
      # 14. JAVA / PYTHON CHECK
      # ==========================================================

      - name: Final environment check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


      # ==========================================================
      # 15. BUILD
      # ==========================================================

      - name: Build MoneyTracker APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ==========================================================
      # 16. FIND APK
      # ==========================================================

      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          if [ -d bin ]; then

            find bin \
              -type f \
              -name "*.apk" \
              -print

            echo ""
            echo "APK details:"

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "bin directory not found."

          fi


      # ==========================================================
      # 17. UPLOAD APK
      # ==========================================================

      - name: Upload MoneyTracker APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
