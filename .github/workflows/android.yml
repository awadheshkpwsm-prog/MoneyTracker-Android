name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_BUILD_TOOLS: "33.0.2"
  ANDROID_NDK_VERSION: "25.2.9519653"

  BUILDOZER_VERSION: "1.6.0"
  CYTHON_VERSION: "0.29.34"
  P4A_VERSION: "2024.1.21"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11.13
      # ============================================================
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 5. INSTALL LINUX DEPENDENCIES
      # ============================================================
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache


      # ============================================================
      # 6. INSTALL PYTHON BUILD TOOLS
      # ============================================================
      - name: Install Buildozer and python-for-android
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<25" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}" \
            "buildozer==${BUILDOZER_VERSION}" \
            "python-for-android==${P4A_VERSION}"

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          python --version
          python -m pip --version
          buildozer --version
          p4a --version


      # ============================================================
      # 7. LOCATE BUILDOZER PROJECT
      # ============================================================
      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/buildozer.spec"


      # ============================================================
      # 8. VERIFY PROJECT CONFIGURATION
      # ============================================================
      - name: Verify project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd
          ls -lah

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.' \
            buildozer.spec \
            || true


      # ============================================================
      # 9. ACCEPT SDK LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          yes | sdkmanager --licenses || true


      # ============================================================
      # 10. INSTALL REQUIRED ANDROID COMPONENTS
      # ============================================================
      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"


      # ============================================================
      # 11. CONNECT ANDROID ENVIRONMENT
      # ============================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_HOME"

          test -d "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"


      # ============================================================
      # 12. VERIFY ANDROID INSTALLATION
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_HOME"
          BUILD_TOOLS="$SDK/build-tools/${ANDROID_BUILD_TOOLS}"
          NDK="$SDK/ndk/${ANDROID_NDK_VERSION}"
          PLATFORM="$SDK/platforms/android-${ANDROID_API}"

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "SDK=$SDK"
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          echo "NDK=$NDK"
          echo "PLATFORM=$PLATFORM"

          test -d "$SDK"
          test -d "$BUILD_TOOLS"
          test -d "$NDK"
          test -d "$PLATFORM"

          test -x "$BUILD_TOOLS/aidl"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/zipalign"

          "$BUILD_TOOLS/aidl" --version || true
          "$BUILD_TOOLS/aapt2" version || true

          cat "$NDK/source.properties"


      # ============================================================
      # 13. FINAL ENVIRONMENT CHECK
      # ============================================================
      - name: Final environment check
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "FINAL ENVIRONMENT"
          echo "========================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "P4A:"
          p4a --version

          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "FINAL ENVIRONMENT READY"


      # ============================================================
      # 14. CLEAN ONLY PROJECT BUILD CACHE
      #
      # IMPORTANT:
      # Do NOT delete the Android SDK.
      # ============================================================
      - name: Clean project Buildozer cache
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer
          mkdir -p bin

          echo "Project build cache cleaned."
          echo "Android SDK preserved."


      # ============================================================
      # 15. VERIFY P4A
      # ============================================================
      - name: Verify python-for-android
        shell: bash
        run: |
          set -eux

          python - << 'PY'
          import pythonforandroid

          print("python-for-android loaded successfully")
          print("module:", pythonforandroid.__file__)
          PY


      # ============================================================
      # 16. BUILD APK
      # ============================================================
      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "START MONEYTRACKER APK BUILD"
          echo "========================================"

          echo "Project:"
          pwd

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "P4A:"
          p4a --version

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          test -d \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -d \
            "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 17. VERIFY GENERATED APK
      # ============================================================
      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "BIN:"
            ls -lah bin || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"
          ls -lh "$APK_FILE"


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. SUCCESS
      # ============================================================
      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Artifact: MoneyTracker-APK"