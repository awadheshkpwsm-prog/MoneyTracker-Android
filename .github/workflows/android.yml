name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build-apk:

    name: Build MoneyTracker APK

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      #
      # IMPORTANT:
      # No Gradle cache.
      # This prevents setup-java from searching for Gradle files.
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: none


      # ============================================================
      # 3. PYTHON 3.11
      #
      # IMPORTANT:
      # No dependency cache.
      # setup-python must NOT search for requirements.txt
      # or pyproject.toml.
      # ============================================================

      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: ""


      # ============================================================
      # 4. VERIFY BASIC ENVIRONMENT
      # ============================================================

      - name: Verify Python and Java
        shell: bash
        run: |
          set -eux

          echo "================================================"
          echo "PYTHON"
          echo "================================================"

          python --version
          python -m pip --version

          echo "================================================"
          echo "JAVA"
          echo "================================================"

          java -version


      # ============================================================
      # 5. INSTALL LINUX BUILD DEPENDENCIES
      # ============================================================

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            rsync \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache


      # ============================================================
      # 6. INSTALL BUILDOZER + P4A
      # ============================================================

      - name: Install Buildozer and Python-for-Android
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<27" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==0.29.34" \
            "buildozer==1.6.0" \
            "python-for-android==2026.5.9"

          echo "================================================"
          echo "BUILDOZER"
          echo "================================================"

          buildozer --version

          echo "================================================"
          echo "P4A"
          echo "================================================"

          p4a --version


      # ============================================================
      # 7. LOCATE BUILDOZER PROJECT
      #
      # buildozer.spec is searched automatically.
      # ============================================================

      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          echo "================================================"
          echo "SEARCHING FOR BUILDOZER.SPEC"
          echo "================================================"

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then

            echo "ERROR: buildozer.spec was not found."

            echo "Repository contents:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/buildozer.spec"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================================"
          echo "PROJECT CONTENT"
          echo "================================================"

          ls -lah "$PROJECT_DIR"


      # ============================================================
      # 8. PREPARE BUILDOZER DEFAULT ANDROID SDK
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # We do NOT use:
      #
      # /usr/local/lib/android/sdk
      #
      # as Buildozer's SDK.
      #
      # We use Buildozer's own/default SDK directory:
      #
      # /home/runner/.buildozer/android/platform/android-sdk
      #
      # ============================================================

      - name: Prepare Buildozer default Android SDK
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "================================================"
          echo "BUILDOZER DEFAULT SDK"
          echo "================================================"

          echo "BUILDOZER_SDK=$BUILDOZER_SDK"

          mkdir -p "$BUILDOZER_SDK"

          echo "================================================"
          echo "COPY ANDROID COMMAND LINE TOOLS"
          echo "================================================"

          HOST_SDK="/usr/local/lib/android/sdk"

          test -d "$HOST_SDK"

          if [ -d "$HOST_SDK/cmdline-tools/latest" ]; then

            mkdir -p "$BUILDOZER_SDK/cmdline-tools"

            rm -rf \
              "$BUILDOZER_SDK/cmdline-tools/latest"

            cp -a \
              "$HOST_SDK/cmdline-tools/latest" \
              "$BUILDOZER_SDK/cmdline-tools/latest"

          else

            echo "ERROR: Android command-line tools were not found."

            find "$HOST_SDK" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print

            exit 1

          fi

          echo "================================================"
          echo "SET BUILDOZER SDK ENVIRONMENT"
          echo "================================================"

          echo "ANDROID_HOME=$BUILDOZER_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$BUILDOZER_SDK" >> "$GITHUB_ENV"

          echo "PATH=$BUILDOZER_SDK/cmdline-tools/latest/bin:$BUILDOZER_SDK/platform-tools:$BUILDOZER_SDK/build-tools/$ANDROID_BUILD_TOOLS:$PATH" \
            >> "$GITHUB_ENV"

          echo "================================================"
          echo "BUILDOZER SDK ENVIRONMENT READY"
          echo "================================================"

          echo "ANDROID_HOME=$BUILDOZER_SDK"


      # ============================================================
      # 9. INSTALL AND ACCEPT LICENSES INSIDE BUILDOZER SDK
      #
      # EVERYTHING HERE GOES INTO:
      #
      # /home/runner/.buildozer/android/platform/android-sdk
      #
      # ============================================================

      - name: Install Android packages into Buildozer SDK
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "================================================"
          echo "BUILDOZER SDKMANAGER"
          echo "================================================"

          echo "$SDKMANAGER"

          "$SDKMANAGER" --version || true

          echo "================================================"
          echo "ACCEPT LICENSES"
          echo "================================================"

          yes | "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            --licenses \
            || true

          echo "================================================"
          echo "INSTALL BUILD TOOLS 37"
          echo "================================================"

          "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "================================================"
          echo "INSTALL ANDROID PLATFORM 33"
          echo "================================================"

          "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}"

          echo "================================================"
          echo "INSTALL NDK 28.2.13676358"
          echo "================================================"

          "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "================================================"
          echo "ANDROID PACKAGES INSTALLED"
          echo "================================================"


      # ============================================================
      # 10. ACCEPT LICENSES AGAIN AFTER INSTALL
      #
      # This ensures Buildozer's SDK has accepted licenses.
      # ============================================================

      - name: Verify Buildozer SDK licenses
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "================================================"
          echo "LICENSE DIRECTORY"
          echo "================================================"

          ls -lah "$BUILDOZER_SDK/licenses" || true

          echo "================================================"
          echo "ACCEPT ALL LICENSES"
          echo "================================================"

          yes | "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            --licenses \
            || true

          echo "================================================"
          echo "LICENSES COMPLETE"
          echo "================================================"

          ls -lah "$BUILDOZER_SDK/licenses" || true


      # ============================================================
      # 11. CONFIGURE ALL ANDROID VARIABLES TO BUILDOZER SDK
      #
      # IMPORTANT:
      # Buildozer and p4a will see ONLY this Android SDK path.
      # ============================================================

      - name: Configure Buildozer Android paths
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          BUILD_TOOLS_DIR="$BUILDOZER_SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          NDK_DIR="$BUILDOZER_SDK/ndk/${ANDROID_NDK_VERSION}"

          echo "================================================"
          echo "VERIFY BUILDOZER SDK PATH"
          echo "================================================"

          echo "ANDROID_HOME=$BUILDOZER_SDK"
          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK"
          echo "ANDROIDSDK=$BUILDOZER_SDK"

          echo "================================================"
          echo "VERIFY BUILD TOOLS 37"
          echo "================================================"

          test -d "$BUILD_TOOLS_DIR"

          test -x "$BUILD_TOOLS_DIR/aidl"

          test -x "$BUILD_TOOLS_DIR/aapt2"

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"

          echo "================================================"
          echo "VERIFY NDK"
          echo "================================================"

          test -d "$NDK_DIR"

          echo "NDK_DIR=$NDK_DIR"

          echo "================================================"
          echo "EXPORT NDK"
          echo "================================================"

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo "================================================"
          echo "EXPORT BUILD TOOLS"
          echo "================================================"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "$BUILDOZER_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$BUILDOZER_SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          echo "================================================"
          echo "BUILDOZER ANDROID PATH READY"
          echo "================================================"


      # ============================================================
      # 12. VERIFY BUILDOZER WILL USE THE CORRECT SDK
      # ============================================================

      - name: Verify Buildozer Android environment
        shell: bash
        run: |
          set -eux

          echo "================================================"
          echo "ANDROID ENVIRONMENT"
          echo "================================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "================================================"
          echo "EXPECTED BUILDOZER SDK"
          echo "================================================"

          EXPECTED="$HOME/.buildozer/android/platform/android-sdk"

          test "$ANDROID_HOME" = "$EXPECTED"
          test "$ANDROID_SDK_ROOT" = "$EXPECTED"
          test "$ANDROIDSDK" = "$EXPECTED"

          echo "Buildozer SDK path: CORRECT"

          echo "================================================"
          echo "BUILD TOOLS"
          echo "================================================"

          test -d \
            "$EXPECTED/build-tools/37.0.0"

          test -x \
            "$EXPECTED/build-tools/37.0.0/aidl"

          test -x \
            "$EXPECTED/build-tools/37.0.0/aapt2"

          echo "Build Tools 37.0.0: READY"

          echo "================================================"
          echo "AIDL"
          echo "================================================"

          "$EXPECTED/build-tools/37.0.0/aidl" \
            --version \
            || true

          echo "================================================"
          echo "AAPT2"
          echo "================================================"

          "$EXPECTED/build-tools/37.0.0/aapt2" \
            version \
            || true

          echo "================================================"
          echo "NDK"
          echo "================================================"

          test -d \
            "$EXPECTED/ndk/28.2.13676358"

          echo "NDK 28.2.13676358: READY"


      # ============================================================
      # 13. VERIFY BUILDOZER SPEC
      # ============================================================

      - name: Verify Buildozer configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "================================================"
          echo "BUILDOZER SPEC"
          echo "================================================"

          test -f buildozer.spec

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.' \
            buildozer.spec \
            || true

          echo "================================================"
          echo "BUILD TOOLS SETTING"
          echo "================================================"

          if grep -Eq \
            '^[[:space:]]*android\.build_tools_version[[:space:]]*=' \
            buildozer.spec
          then

            grep -n \
              'android.build_tools_version' \
              buildozer.spec

          else

            echo "WARNING: android.build_tools_version is not explicitly present."

            echo "Build environment is configured for:"
            echo "37.0.0"

          fi

          echo "================================================"
          echo "NDK SETTING"
          echo "================================================"

          grep -n \
            'android.ndk' \
            buildozer.spec \
            || true


      # ============================================================
      # 14. CLEAN OLD BUILDOZER BUILD CACHE
      #
      # IMPORTANT:
      # Source files are NOT deleted.
      #
      # Only old generated Buildozer build data is removed.
      # ============================================================

      - name: Clean old Buildozer build cache
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer

          mkdir -p bin

          echo "================================================"
          echo "OLD PROJECT BUILD CACHE CLEANED"
          echo "================================================"

          echo "Source files preserved."


      # ============================================================
      # 15. RE-CREATE BUILDOZER SDK ENVIRONMENT AFTER CLEAN
      #
      # The previous step removes PROJECT_DIR/.buildozer only.
      #
      # The SDK remains in:
      #
      # $HOME/.buildozer/android/platform/android-sdk
      #
      # ============================================================

      - name: Final Android SDK verification before Buildozer
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "================================================"
          echo "FINAL BUILDOZER SDK"
          echo "================================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          test "$ANDROID_HOME" = "$BUILDOZER_SDK"
          test "$ANDROID_SDK_ROOT" = "$BUILDOZER_SDK"
          test "$ANDROIDSDK" = "$BUILDOZER_SDK"

          echo "================================================"
          echo "BUILD TOOLS 37"
          echo "================================================"

          test -d \
            "$BUILDOZER_SDK/build-tools/37.0.0"

          test -x \
            "$BUILDOZER_SDK/build-tools/37.0.0/aidl"

          echo "Build Tools 37.0.0: VERIFIED"

          echo "================================================"
          echo "NDK"
          echo "================================================"

          test -d \
            "$BUILDOZER_SDK/ndk/28.2.13676358"

          echo "NDK 28.2.13676358: VERIFIED"

          echo "================================================"
          echo "LICENSES"
          echo "================================================"

          test -d \
            "$BUILDOZER_SDK/licenses"

          ls -lah "$BUILDOZER_SDK/licenses"


      # ============================================================
      # 16. BUILD APK
      #
      # MANUAL WORKFLOW ONLY.
      #
      # Nothing automatically triggers this workflow.
      # ============================================================

      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "================================================"
          echo "FINAL BUILD ENVIRONMENT"
          echo "================================================"

          python --version
          java -version
          buildozer --version
          p4a --version

          echo "================================================"
          echo "ANDROID PATHS"
          echo "================================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"

          echo "================================================"
          echo "FINAL BUILDOZER SDK CHECK"
          echo "================================================"

          test \
            "$ANDROID_HOME" = \
            "$HOME/.buildozer/android/platform/android-sdk"

          test -d \
            "$ANDROID_HOME/build-tools/37.0.0"

          test -x \
            "$ANDROID_HOME/build-tools/37.0.0/aidl"

          test -x \
            "$ANDROID_HOME/build-tools/37.0.0/aapt2"

          test -d \
            "$ANDROID_HOME/ndk/28.2.13676358"

          test -d \
            "$ANDROID_HOME/platforms/android-33"

          echo "================================================"
          echo "START BUILDOZER"
          echo "================================================"

          buildozer -v android debug

          echo "================================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "================================================"


      # ============================================================
      # 17. VERIFY APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "================================================"
          echo "SEARCHING FOR APK"
          echo "================================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo "================================================"
            echo "BIN DIRECTORY"
            echo "================================================"

            ls -lah bin || true

            echo "================================================"
            echo "BUILD DIRECTORY"
            echo "================================================"

            find .buildozer \
              -maxdepth 5 \
              -type f \
              | head -300 \
              || true

            exit 1

          fi

          echo "================================================"
          echo "APK FOUND"
          echo "================================================"

          echo "$APK_FILE"

          ls -lh "$APK_FILE"


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================

      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. SUCCESS
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo "================================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "================================================"

          echo "Build Tools: 37.0.0"
          echo "Android API: 33"
          echo "NDK: 28.2.13676358"
          echo "Python: 3.11.13"
          echo "Java: 17"
          echo "Buildozer: 1.6.0"
          echo "P4A: 2026.05.09"

          echo "================================================"
          echo "APK ARTIFACT"
          echo "================================================"

          echo "MoneyTracker-APK"
