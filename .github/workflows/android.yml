name: Build MoneyTracker APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: pip


      # =========================================================
      # PYTHON 3.11
      # =========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # =========================================================
      # SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev \
            libreadline-dev \
            libsqlite3-dev \
            ccache \
            build-essential


      # =========================================================
      # PYTHON BUILD DEPENDENCIES
      # =========================================================

      - name: Install Python build dependencies
        run: |
          set -e

          python -m pip install --upgrade \
            "pip<26" \
            "setuptools<81" \
            "wheel"

          python -m pip install \
            "cython==0.29.34"

          python -m pip install \
            "buildozer==1.6.0"


      # =========================================================
      # SHOW VERSIONS
      # =========================================================

      - name: Show build environment
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          python --version
          python -m pip --version
          cython --version
          buildozer --version
          java -version

          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          pwd
          find . -maxdepth 3 -type f | sort | head -300


      # =========================================================
      # VERIFY buildozer.spec
      # =========================================================

      - name: Verify buildozer.spec
        run: |
          set -e

          SPEC_FILE="buildozer.spec"

          if [ ! -f "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo "Using:"
          echo "$SPEC_FILE"

          echo ""
          echo "=========================================="
          echo "BUILD SPEC"
          echo "=========================================="

          cat "$SPEC_FILE"


      # =========================================================
      # VERIFY MAIN APPLICATION
      # =========================================================

      - name: Verify MoneyTracker source
        run: |
          set -e

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py not found!"
            exit 1
          fi

          echo "main.py found"

          if [ -d "mt" ]; then
            echo "mt/ backend found"
            find mt -maxdepth 2 -type f | sort
          else
            echo "WARNING: mt/ directory not found"
          fi


      # =========================================================
      # CLEAN ALL PREVIOUS BUILD DATA
      #
      # IMPORTANT:
      # This prevents the broken/mixed temporary p4a venv
      # that caused:
      #
      # ImportError:
      # cannot import name BuildDependencyInstallError
      #
      # =========================================================

      - name: Clean Buildozer state
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING BUILD STATE"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          rm -rf "$HOME/.buildozer"

          mkdir -p "$HOME/.buildozer"

          echo "Buildozer state cleaned."


      # =========================================================
      # CREATE BUILD DIRECTORY
      # =========================================================

      - name: Prepare Android environment
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          echo "HOME:"
          echo "$HOME"

          echo ""
          echo "Buildozer Android platform directory:"
          echo "$HOME/.buildozer/android/platform"


      # =========================================================
      # PREPARE buildozer.spec
      #
      # Keep the user's main configuration, but force the
      # p4a version known to provide AAB support.
      # =========================================================

      - name: Configure python-for-android
        run: |
          set -e

          SPEC_FILE="buildozer.spec"

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          lines = text.splitlines()

          # Remove old p4a selectors.
          filtered = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("p4a.branch"):
                  continue

              if stripped.startswith("p4a.commit"):
                  continue

              if stripped.startswith("p4a.url"):
                  continue

              filtered.append(line)

          # Add a fixed p4a release with AAB support.
          filtered.append("")
          filtered.append("# Fixed python-for-android version for reproducible GitHub builds")
          filtered.append("p4a.url = https://github.com/kivy/python-for-android.git")
          filtered.append("p4a.commit = 58d21141")

          path.write_text("\n".join(filtered) + "\n")
          PY

          echo "=========================================="
          echo "UPDATED buildozer.spec"
          echo "=========================================="

          cat "$SPEC_FILE"


      # =========================================================
      # INSTALL / VERIFY ANDROID SDK
      #
      # Buildozer will use this SDK.
      # We deliberately do NOT create the broken old
      # sdkmanager -> tools symlink.
      # =========================================================

      - name: Install Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip -d cmdline-tools

          rm -f commandlinetools.zip

          if [ ! -d "$SDK/cmdline-tools/cmdline-tools" ]; then
            echo "ERROR: Android command line tools extraction failed."
            exit 1
          fi

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          touch "$SDK/repositories.cfg"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Checking sdkmanager..."

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # =========================================================
      # INSTALL REQUIRED SDK PACKAGES
      # =========================================================

      - name: Install Android SDK packages
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo ""
          echo "=========================================="
          echo "INSTALLED SDK PACKAGES"
          echo "=========================================="

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --list_installed


      # =========================================================
      # VERIFY AIDL
      # =========================================================

      - name: Verify Android SDK tools
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          test -x \
            "$SDK/build-tools/33.0.2/aidl"

          test -x \
            "$SDK/build-tools/33.0.2/aapt"

          test -x \
            "$SDK/build-tools/33.0.2/aapt2"

          test -x \
            "$SDK/platform-tools/adb"

          echo ""
          echo "AIDL:"
          "$SDK/build-tools/33.0.2/aidl" --help >/dev/null

          echo "AIDL OK"

          echo ""
          echo "AAPT:"
          "$SDK/build-tools/33.0.2/aapt" version

          echo ""
          echo "ADB:"
          "$SDK/platform-tools/adb" version


      # =========================================================
      # VERIFY NDK DOWNLOAD TARGET
      #
      # p4a currently recommends r28c.
      # We explicitly install r28c so Buildozer does not
      # fall back to an old NDK.
      # =========================================================

      - name: Install Android NDK r28c
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "=========================================="
          echo "INSTALLING ANDROID NDK r28c"
          echo "=========================================="

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          echo ""
          echo "NDK directories:"

          ls -lah "$SDK/ndk"

          if [ ! -d "$SDK/ndk/28.2.13676358" ]; then
            echo "ERROR: NDK r28c was not installed."
            exit 1
          fi

          echo ""
          echo "NDK r28c verified."


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build MoneyTracker APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # =========================================================
      # SEARCH APK
      # =========================================================

      - name: Search APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo ""
          echo "APK files:"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            -exec ls -lh {} \; \
            || true


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
            .buildozer/**/*.apk
          if-no-files-found: error


      # =========================================================
      # UPLOAD BUILD LOGS IF FAILED
      # =========================================================

      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-build-logs
          path: |
            .buildozer/
          if-no-files-found: warn
