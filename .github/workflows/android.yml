name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  BUILDOZER_VERSION: "1.6.0"
  CYTHON_VERSION: "0.29.34"

  BUILDOZER_WARN_ON_ROOT: "0"

  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11.13
      # ============================================================

      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. LINUX BUILD DEPENDENCIES
      # ============================================================

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache \
            openjdk-17-jdk


      # ============================================================
      # 5. INSTALL PYTHON BUILD TOOLS
      #
      # python-for-android is intentionally NOT installed separately.
      # Buildozer manages the p4a source/version it needs.
      # ============================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<25" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==0.29.34" \
            "buildozer==1.6.0"

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version

          echo "========================================"
          echo "PIP"
          echo "========================================"

          python -m pip --version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version


      # ============================================================
      # 6. LOCATE BUILDOZER PROJECT
      # ============================================================

      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/buildozer.spec"


      # ============================================================
      # 7. VERIFY PROJECT CONFIGURATION
      # ============================================================

      - name: Verify project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd
          ls -lah

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "ANDROID CONFIG"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.archs|p4a\.' \
            buildozer.spec \
            || true


      # ============================================================
      # 8. CLEAN ONLY OLD PROJECT BUILD CACHE
      #
      # IMPORTANT:
      # Do NOT delete ~/.buildozer/android/platform/android-sdk
      # Do NOT manually delete Buildozer's NDK.
      # ============================================================

      - name: Clean old project build cache
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer

          mkdir -p bin

          echo "========================================"
          echo "PROJECT BUILD CACHE CLEANED"
          echo "========================================"

          echo "Source files preserved."
          echo "Buildozer global platform is not deleted."


      # ============================================================
      # 9. REMOVE RUNNER ANDROID OVERRIDES
      #
      # GitHub runner contains its own Android SDK and NDK.
      # We do not want those variables to force p4a away from
      # Buildozer's own Android environment.
      # ============================================================

      - name: Clear conflicting Android environment variables
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=" >> "$GITHUB_ENV"

          echo "========================================"
          echo "CONFLICTING RUNNER ANDROID VARIABLES CLEARED"
          echo "========================================"


      # ============================================================
      # 10. SHOW BUILDOZER ENVIRONMENT BEFORE BUILD
      # ============================================================

      - name: Show Buildozer environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "HOME=$HOME"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "========================================"
          echo "ANDROID VARIABLES"
          echo "========================================"

          env | grep -E '^ANDROID|^ANDROIDSDK|^ANDROIDNDK' | sort || true

          echo "========================================"
          echo "BUILDOZER DIRECTORY BEFORE BUILD"
          echo "========================================"

          find "$HOME/.buildozer" \
            -maxdepth 5 \
            -type d \
            2>/dev/null \
            | sort \
            | head -500 \
            || true


      # ============================================================
      # 11. BUILD APK
      #
      # Buildozer/p4a is allowed to:
      # - download/create its own SDK environment
      # - download/create its own NDK environment
      # - install Build Tools 37.0.0 if required
      # - request/update any required Android components
      #
      # License prompts are automatically answered with "yes".
      # ============================================================

      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "START MONEYTRACKER APK BUILD"
          echo "========================================"

          echo "Project:"
          pwd

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          python --version
          java -version
          buildozer --version

          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          yes | buildozer -v android debug


      # ============================================================
      # 12. SHOW RESOLVED BUILDOZER ANDROID ENVIRONMENT
      #
      # This happens AFTER Buildozer has created/downloaded
      # whatever SDK/NDK/components it actually requires.
      # ============================================================

      - name: Inspect resolved Android environment
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER PLATFORM"
          echo "========================================"

          find "$HOME/.buildozer/android/platform" \
            -maxdepth 3 \
            -type d \
            2>/dev/null \
            | sort \
            | head -1000 \
            || true

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          find "$HOME/.buildozer/android/platform" \
            -type f \
            -name "aidl" \
            -perm -111 \
            2>/dev/null \
            | sort \
            || true

          echo "========================================"
          echo "ANDROID SDK LICENSE FILES"
          echo "========================================"

          find "$HOME/.buildozer/android/platform" \
            -type f \
            -path "*/licenses/*" \
            2>/dev/null \
            | sort \
            || true

          echo "========================================"
          echo "NDK METADATA"
          echo "========================================"

          find "$HOME/.buildozer/android/platform" \
            -type f \
            -name "source.properties" \
            2>/dev/null \
            | sort \
            | while read -r file; do
                echo "----------------------------------------"
                echo "$file"
                cat "$file"
              done \
            || true


      # ============================================================
      # 13. VERIFY GENERATED APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find bin \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "========================================"
            echo "BIN DIRECTORY"
            echo "========================================"

            ls -lah bin || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"
          ls -lh "$APK_FILE"


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================

      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 15. SUCCESS
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Artifact:"
          echo "MoneyTracker-APK"