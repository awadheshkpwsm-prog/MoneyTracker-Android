name: MoneyTracker Pre-Build Full Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  prebuild-diagnostic:

    name: Full Pre-Build Environment Check

    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive

      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"
      BUILDOZER_VERSION: "1.6.0"
      CYTHON_VERSION: "0.29.34"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      MAVEN_ARGS: "-ntp"

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 02 - RUNNER INFORMATION
      # ============================================================

      - name: 02 - Runner system diagnostic
        run: |
          set -o pipefail

          echo "========================================"
          echo "RUNNER INFORMATION"
          echo "========================================"

          echo "PWD:"
          pwd

          echo
          echo "GITHUB_WORKSPACE:"
          echo "$GITHUB_WORKSPACE"

          echo
          echo "HOME:"
          echo "$HOME"

          echo
          echo "USER:"
          whoami

          echo
          echo "KERNEL:"
          uname -a

          echo
          echo "OS:"
          cat /etc/os-release || true

          echo
          echo "CPU:"
          nproc || true

          echo
          echo "MEMORY:"
          free -h || true

          echo
          echo "DISK:"
          df -h || true


      # ============================================================
      # 03 - REPOSITORY STRUCTURE
      # ============================================================

      - name: 03 - Repository file and folder check
        run: |
          set -o pipefail

          echo "========================================"
          echo "REPOSITORY ROOT"
          echo "========================================"

          ls -lah "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo "PROJECT TREE"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -print \
            | sort \
            | head -3000

          echo
          echo "========================================"
          echo "FILE COUNTS"
          echo "========================================"

          echo "Python files:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.py" \
            | wc -l

          echo "JSON files:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.json" \
            | wc -l

          echo "KV files:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.kv" \
            | wc -l

          echo "PNG files:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.png" \
            | wc -l

          echo "JPG files:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.jpg" \
            | wc -l

          echo "buildozer.spec files:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "buildozer.spec" \
            | wc -l


      # ============================================================
      # 04 - FIND BUILDOZER SPEC
      # ============================================================

      - name: 04 - Detect buildozer project
        run: |
          set -euxo pipefail

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -name "buildozer.spec" \
              -type f \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "========================================"
          echo "PROJECT DETECTED"
          echo "========================================"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$SPEC_FILE"
          test -d "$PROJECT_DIR"

          echo "SPEC_FILE=$SPEC_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 05 - PROJECT ROOT
      # ============================================================

      - name: 05 - Project root validation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"

          pwd

          echo
          echo "========================================"
          echo "PROJECT CONTENTS"
          echo "========================================"

          ls -lah

          echo
          echo "========================================"
          echo "IMPORTANT FILES"
          echo "========================================"

          for FILE in \
            buildozer.spec \
            main.py \
            README.md \
            README.txt \
            requirements.txt \
            pyproject.toml
          do
            if [ -e "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "NOT FOUND: $FILE"
            fi
          done

          test -f buildozer.spec


      # ============================================================
      # 06 - JAVA 17
      # ============================================================

      - name: 06 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 07 - JAVA DIAGNOSTIC
      # ============================================================

      - name: 07 - Java diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"

          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "JAVA PATH:"
          command -v java

          echo
          echo "JAVAC VERSION:"
          javac -version

          echo
          echo "JAVAC PATH:"
          command -v javac

          test -n "$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"


      # ============================================================
      # 08 - PYTHON 3.11.13
      # ============================================================

      - name: 08 - Set up Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          check-latest: false


      # ============================================================
      # 09 - PYTHON DIAGNOSTIC
      # ============================================================

      - name: 09 - Python environment diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -V
          command -v python

          echo
          echo "PYTHON EXECUTABLE:"
          python -c "import sys; print(sys.executable)"

          echo
          echo "PYTHON VERSION:"
          python -c "import sys; print(sys.version)"

          echo
          echo "PIP:"
          python -m pip --version

          echo
          echo "SITE PACKAGES:"
          python -c "import site; print(site.getsitepackages())"

          python - <<'PY'
          import sys

          print("Version tuple:", sys.version_info[:3])

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  "ERROR: Python 3.11 is required."
              )

          print("PASS: Python 3.11 detected.")
          PY


      # ============================================================
      # 10 - HOST DEPENDENCIES
      #
      # IMPORTANT:
      # This installs ONLY Linux host build dependencies.
      #
      # It does NOT install:
      # - Android SDK
      # - Android Build Tools
      # - Android NDK
      # - Android platform
      # ============================================================

      - name: 10 - Install and verify host build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libltdl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            liblzma-dev \
            patch \
            file

          echo
          echo "========================================"
          echo "LIBTOOL INSTALLATION CHECK"
          echo "========================================"

          echo "libtool executable:"
          command -v libtool

          echo
          echo "libtool version:"
          libtool --version

          echo
          echo "libtool package:"
          dpkg -s libtool

          echo
          echo "libtool-bin package:"
          dpkg -s libtool-bin

          echo
          echo "PASS: libtool is installed and executable."


      # ============================================================
      # 11 - HOST TOOL CHECK
      # ============================================================

      - name: 11 - Host tools diagnostic
        run: |
          set -o pipefail

          echo "========================================"
          echo "HOST TOOL CHECK"
          echo "========================================"

          TOOLS=(
            git
            gcc
            g++
            make
            cmake
            autoconf
            automake
            libtool
            pkg-config
            zip
            unzip
            patch
            file
          )

          FAILED=0

          for TOOL in "${TOOLS[@]}"; do

            echo
            echo "----------------------------------------"
            echo "Checking: $TOOL"

            if command -v "$TOOL" >/dev/null 2>&1; then

              echo "PASS: $TOOL"
              echo "PATH: $(command -v "$TOOL")"

              "$TOOL" --version 2>&1 | head -n 2 || true

            else

              echo "FAIL: $TOOL not found"
              FAILED=1

            fi

          done

          echo
          echo "========================================"
          echo "LIBTOOL PACKAGE DIAGNOSTIC"
          echo "========================================"

          echo "PATH:"
          echo "$PATH"

          echo
          echo "command -v libtool:"
          command -v libtool || true

          echo
          echo "which libtool:"
          which libtool || true

          echo
          echo "dpkg package status:"
          dpkg -l | grep -E 'libtool|libltdl' || true

          echo
          echo "libtool files:"
          dpkg -L libtool 2>/dev/null \
            | grep '/libtool$' \
            || true

          echo
          echo "Common locations:"
          find \
            /usr/bin \
            /usr/local/bin \
            -maxdepth 1 \
            -type f \
            -name "libtool*" \
            -print \
            2>/dev/null \
            || true

          echo
          echo "========================================"
          echo "FINAL HOST TOOL RESULT"
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "HOST TOOL CHECK FAILED"
            exit 1
          fi

          echo "HOST TOOL CHECK PASSED"


      # ============================================================
      # 12 - INSTALL BUILDOZER + CYTHON
      # ============================================================

      - name: 12 - Install Buildozer environment
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}"

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}"

          echo
          echo "========================================"
          echo "INSTALLED BUILD PACKAGES"
          echo "========================================"

          python -m pip show buildozer
          python -m pip show Cython


      # ============================================================
      # 13 - BUILDOZER / CYTHON CHECK
      # ============================================================

      - name: 13 - Buildozer and Cython diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          command -v buildozer
          buildozer --version

          echo
          echo "========================================"
          echo "BUILDOZER HELP TEST"
          echo "========================================"

          buildozer --help >/tmp/buildozer-help.txt

          head -80 /tmp/buildozer-help.txt

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          command -v cython
          cython --version

          echo
          echo "========================================"
          echo "PYTHON IMPORT TEST"
          echo "========================================"

          python - <<'PY'
          import Cython
          import buildozer

          print("Cython version:", Cython.__version__)
          print("Buildozer import: PASS")
          PY


      # ============================================================
      # 14 - BUILDOZER SPEC
      # ============================================================

      - name: 14 - Read buildozer.spec
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "FULL buildozer.spec"
          echo "========================================"

          cat buildozer.spec

          echo
          echo "========================================"
          echo "IMPORTANT SETTINGS"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(title|package\.name|package\.domain|source\.dir|source\.include_exts|version|requirements|orientation|fullscreen|android\.api|android\.minapi|android\.ndk|android\.archs|android\.build_tools_version|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true


      # ============================================================
      # 15 - SPEC REQUIRED SETTINGS
      # ============================================================

      - name: 15 - Validate required buildozer.spec settings
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "SPEC VALIDATION"
          echo "========================================"

          REQUIRED_KEYS=(
            "title"
            "package.name"
            "package.domain"
            "source.dir"
            "source.include_exts"
            "version"
            "requirements"
            "orientation"
            "android.api"
            "android.minapi"
          )

          FAILED=0

          for KEY in "${REQUIRED_KEYS[@]}"; do

            ESCAPED_KEY="${KEY//./\\.}"

            VALUE="$(
              grep -E \
                "^[[:space:]]*${ESCAPED_KEY}[[:space:]]*=" \
                buildozer.spec \
                | head -n 1 \
                | cut -d '=' -f2- \
                | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
            )"

            if [ -z "$VALUE" ]; then
              echo "FAIL: $KEY is missing or empty"
              FAILED=1
            else
              echo "PASS: $KEY = $VALUE"
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: buildozer.spec validation failed."
            exit 1
          fi

          echo
          echo "PASS: Required buildozer.spec fields are present."


      # ============================================================
      # 16 - SOURCE DIRECTORY
      # ============================================================

      - name: 16 - Validate source directory
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          SOURCE_DIR="$(
            grep -E '^[[:space:]]*source\.dir[[:space:]]*=' \
              buildozer.spec \
              | head -n 1 \
              | cut -d '=' -f2- \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          echo "source.dir=$SOURCE_DIR"

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: source.dir is empty."
            exit 1
          fi

          if [ "$SOURCE_DIR" = "." ]; then
            SOURCE_PATH="$PWD"
          else
            SOURCE_PATH="$PWD/$SOURCE_DIR"
          fi

          echo
          echo "Resolved source path:"
          echo "$SOURCE_PATH"

          if [ ! -d "$SOURCE_PATH" ]; then
            echo "ERROR: Source directory does not exist."
            exit 1
          fi

          echo "SOURCE_PATH=$SOURCE_PATH" >> "$GITHUB_ENV"

          echo
          echo "SOURCE CONTENTS:"

          find "$SOURCE_PATH" \
            -maxdepth 3 \
            -print \
            | sort \
            | head -2000


      # ============================================================
      # 17 - PYTHON SYNTAX CHECK
      # ============================================================

      - name: 17 - Python syntax compilation check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "PYTHON SYNTAX CHECK"
          echo "========================================"

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' FILE_PATH; do

            COUNT=$((COUNT + 1))

            echo "Checking:"
            echo "$FILE_PATH"

            if ! python -m py_compile "$FILE_PATH"; then
              echo "FAIL: $FILE_PATH"
              FAILED=1
            else
              echo "PASS"
            fi

          done < <(
            find "$SOURCE_PATH" \
              -type f \
              -name "*.py" \
              -print0
          )

          echo
          echo "Python files checked: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No Python files found."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Python syntax check failed."
            exit 1
          fi

          echo
          echo "PASS: All Python files passed syntax compilation."


      # ============================================================
      # 18 - MAIN.PY
      # ============================================================

      - name: 18 - Check main.py
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "MAIN.PY CHECK"
          echo "========================================"

          if [ -f "$SOURCE_PATH/main.py" ]; then

            echo "PASS: main.py found"
            echo "PATH: $SOURCE_PATH/main.py"

            python -m py_compile \
              "$SOURCE_PATH/main.py"

          else

            echo "WARNING: main.py not found directly in source directory."

            echo
            echo "Searching for main.py:"

            find "$SOURCE_PATH" \
              -type f \
              -name "main.py" \
              -print \
              | sort

            MAIN_COUNT="$(
              find "$SOURCE_PATH" \
                -type f \
                -name "main.py" \
                | wc -l
            )"

            if [ "$MAIN_COUNT" -eq 0 ]; then
              echo "ERROR: No main.py found."
              exit 1
            fi

          fi


      # ============================================================
      # 19 - PYTHON PROJECT STRUCTURE
      # ============================================================

      - name: 19 - Python project structure check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "PYTHON PROJECT STRUCTURE"
          echo "========================================"

          echo "Python files:"
          find "$SOURCE_PATH" \
            -type f \
            -name "*.py" \
            | sort

          echo
          echo "Package markers:"
          find "$SOURCE_PATH" \
            -type f \
            -name "__init__.py" \
            | sort \
            || true

          echo
          echo "Python modules:"
          find "$SOURCE_PATH" \
            -maxdepth 4 \
            -type f \
            -name "*.py" \
            | sort


      # ============================================================
      # 20 - BUILD REQUIREMENTS ANALYSIS
      # ============================================================

      - name: 20 - Analyze Buildozer requirements
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          REQUIREMENTS="$(
            grep -E '^[[:space:]]*requirements[[:space:]]*=' \
              buildozer.spec \
              | head -n 1 \
              | cut -d '=' -f2- \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          echo "========================================"
          echo "RAW REQUIREMENTS"
          echo "========================================"

          echo "$REQUIREMENTS"

          python - "$REQUIREMENTS" <<'PY'
          import sys

          raw = sys.argv[1]

          requirements = [
              item.strip()
              for item in raw.split(",")
              if item.strip()
          ]

          print()
          print("PARSED REQUIREMENTS:")

          for item in requirements:
              print(" -", item)

          if not requirements:
              raise SystemExit(
                  "ERROR: No requirements found."
              )

          print()
          print("PASS: requirements field parsed successfully.")
          PY


      # ============================================================
      # 21 - INCLUDE EXTENSIONS
      # ============================================================

      - name: 21 - Validate source.include_exts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          INCLUDE_EXTS="$(
            grep -E '^[[:space:]]*source\.include_exts[[:space:]]*=' \
              buildozer.spec \
              | head -n 1 \
              | cut -d '=' -f2- \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          echo "========================================"
          echo "INCLUDED EXTENSIONS"
          echo "========================================"

          echo "$INCLUDE_EXTS"

          IFS=',' read -ra EXTS <<< "$INCLUDE_EXTS"

          for EXT in "${EXTS[@]}"; do

            EXT="$(echo "$EXT" | xargs)"

            if [ -z "$EXT" ]; then
              continue
            fi

            COUNT="$(
              find "$SOURCE_PATH" \
                -type f \
                -iname "*.${EXT}" \
                | wc -l
            )"

            echo "${EXT}: ${COUNT} file(s)"

          done


      # ============================================================
      # 22 - JSON VALIDATION
      # ============================================================

      - name: 22 - Validate JSON files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "JSON VALIDATION"
          echo "========================================"

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' JSON_FILE; do

            COUNT=$((COUNT + 1))

            echo "Checking:"
            echo "$JSON_FILE"

            if python -m json.tool \
              "$JSON_FILE" \
              >/dev/null; then

              echo "PASS"

            else

              echo "FAIL: Invalid JSON"
              FAILED=1

            fi

          done < <(
            find "$SOURCE_PATH" \
              -type f \
              -name "*.json" \
              -print0
          )

          echo
          echo "JSON files checked: $COUNT"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "PASS: JSON validation completed."


      # ============================================================
      # 23 - EXISTING ANDROID ENVIRONMENT
      #
      # No Android components are installed.
      # ============================================================

      - name: 23 - Android environment discovery
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID ENVIRONMENT VARIABLES"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-NOT SET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-NOT SET}"
          echo "ANDROID_NDK=${ANDROID_NDK:-NOT SET}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-NOT SET}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-NOT SET}"

          echo
          echo "========================================"
          echo "BUILDOZER DIRECTORY"
          echo "========================================"

          if [ -d "$HOME/.buildozer" ]; then

            find "$HOME/.buildozer" \
              -maxdepth 5 \
              -print \
              | sort \
              | head -5000

          else

            echo "$HOME/.buildozer does not exist."

          fi


      # ============================================================
      # 24 - DETECT EXISTING SDK
      # ============================================================

      - name: 24 - Detect existing Android SDK
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID SDK DETECTION"
          echo "========================================"

          SDK=""

          CANDIDATES=(
            "${ANDROID_SDK_ROOT:-}"
            "${ANDROID_HOME:-}"
            "$HOME/.buildozer/android/platform/android-sdk"
            "$HOME/Android/Sdk"
            "/usr/local/lib/android/sdk"
            "/opt/android-sdk"
          )

          for CANDIDATE in "${CANDIDATES[@]}"; do

            if [ -n "$CANDIDATE" ] \
              && [ -d "$CANDIDATE" ]; then

              echo "Candidate:"
              echo "$CANDIDATE"

              if [ -d "$CANDIDATE/platform-tools" ]; then
                SDK="$CANDIDATE"
                break
              fi

            fi

          done

          if [ -z "$SDK" ]; then

            echo
            echo "RESULT: No existing Android SDK detected."

            echo "ANDROID_SDK_FOUND=false" >> "$GITHUB_ENV"

            exit 0
          fi

          echo
          echo "PASS: Existing Android SDK detected:"
          echo "$SDK"

          echo "ANDROID_SDK_FOUND=true" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_REAL=$SDK" >> "$GITHUB_ENV"


      # ============================================================
      # 25 - SDK CONTENTS
      # ============================================================

      - name: 25 - Android SDK content diagnostic
        if: env.ANDROID_SDK_FOUND == 'true'
        run: |
          set -o pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "SDK"
          echo "========================================"

          echo "$SDK"

          echo
          echo "========================================"
          echo "PLATFORM TOOLS"
          echo "========================================"

          if [ -d "$SDK/platform-tools" ]; then

            echo "PASS: platform-tools exists"

            if [ -x "$SDK/platform-tools/adb" ]; then
              "$SDK/platform-tools/adb" version || true
            fi

          else

            echo "FAIL: platform-tools missing"

          fi

          echo
          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          if [ -d "$SDK/build-tools" ]; then

            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V

          else

            echo "NOT FOUND: build-tools"

          fi

          echo
          echo "========================================"
          echo "ANDROID PLATFORMS"
          echo "========================================"

          if [ -d "$SDK/platforms" ]; then

            find "$SDK/platforms" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V

          else

            echo "NOT FOUND: platforms"

          fi

          echo
          echo "========================================"
          echo "COMMAND LINE TOOLS"
          echo "========================================"

          if [ -d "$SDK/cmdline-tools" ]; then

            find "$SDK/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name "sdkmanager" \
              -print

          else

            echo "NOT FOUND: cmdline-tools"

          fi


      # ============================================================
      # 26 - BUILD TOOLS DETECTION
      # ============================================================

      - name: 26 - Detect available Android Build Tools
        if: env.ANDROID_SDK_FOUND == 'true'
        run: |
          set -o pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "BUILD TOOLS DETECTION"
          echo "========================================"

          if [ ! -d "$SDK/build-tools" ]; then

            echo "RESULT: build-tools directory missing."
            echo "ANDROID_BUILD_TOOLS_FOUND=false" >> "$GITHUB_ENV"

            exit 0

          fi

          BUILD_TOOLS_VERSION="$(
            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then

            echo "RESULT: No Build Tools version detected."
            echo "ANDROID_BUILD_TOOLS_FOUND=false" >> "$GITHUB_ENV"

            exit 0

          fi

          BUILD_TOOLS_DIR="$SDK/build-tools/$BUILD_TOOLS_VERSION"

          echo "PASS: Build Tools detected"
          echo "VERSION: $BUILD_TOOLS_VERSION"
          echo "PATH: $BUILD_TOOLS_DIR"

          echo "ANDROID_BUILD_TOOLS_FOUND=true" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_REAL=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

          echo
          echo "BUILD TOOLS CONTENTS:"
          ls -lah "$BUILD_TOOLS_DIR"


      # ============================================================
      # 27 - NDK DETECTION
      #
      # No NDK installation.
      #
      # Search:
      # 1. Detected SDK
      # 2. Buildozer platform
      # 3. ~/.buildozer
      # 4. Android/Sdk
      #
      # Valid NDK must contain source.properties.
      # ============================================================

      - name: 27 - Detect existing Android NDK
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID NDK DETECTION"
          echo "========================================"

          NDK_DIR=""

          SEARCH_ROOTS=(
            "${ANDROID_SDK_REAL:-}"
            "$HOME/.buildozer/android/platform"
            "$HOME/.buildozer"
            "$HOME/Android/Sdk"
          )

          for ROOT in "${SEARCH_ROOTS[@]}"; do

            if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
              continue
            fi

            echo
            echo "Searching:"
            echo "$ROOT"

            CANDIDATE="$(
              find "$ROOT" \
                -type f \
                -name "source.properties" \
                -path "*ndk*" \
                2>/dev/null \
                | sed 's#/source.properties##' \
                | sort -V \
                | tail -n 1 \
                || true
            )"

            if [ -n "$CANDIDATE" ] \
              && [ -d "$CANDIDATE" ]; then

              NDK_DIR="$CANDIDATE"
              break

            fi

          done

          if [ -z "$NDK_DIR" ]; then

            echo
            echo "RESULT: No existing Android NDK detected."

            echo "ANDROID_NDK_FOUND=false" >> "$GITHUB_ENV"

            exit 0

          fi

          echo
          echo "PASS: Android NDK detected:"
          echo "$NDK_DIR"

          echo
          echo "========================================"
          echo "NDK source.properties"
          echo "========================================"

          cat "$NDK_DIR/source.properties"

          echo
          echo "========================================"
          echo "NDK DIRECTORY CHECK"
          echo "========================================"

          test -d "$NDK_DIR"
          test -f "$NDK_DIR/source.properties"

          echo "ANDROID_NDK_FOUND=true" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_REAL=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 28 - SPEC VS ENVIRONMENT
      # ============================================================

      - name: 28 - Compare buildozer.spec with detected environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "SPEC VS DETECTED ENVIRONMENT"
          echo "========================================"

          echo
          echo "----------------------------------------"
          echo "BUILDOSER.SPEC ANDROID SETTINGS"
          echo "----------------------------------------"

          grep -E \
            '^[[:space:]]*(android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true

          echo
          echo "----------------------------------------"
          echo "DETECTED ANDROID ENVIRONMENT"
          echo "----------------------------------------"

          echo "ANDROID_SDK_FOUND=${ANDROID_SDK_FOUND:-false}"
          echo "ANDROID_SDK_REAL=${ANDROID_SDK_REAL:-NOT DETECTED}"

          echo
          echo "ANDROID_BUILD_TOOLS_FOUND=${ANDROID_BUILD_TOOLS_FOUND:-false}"
          echo "ANDROID_BUILD_TOOLS_REAL=${ANDROID_BUILD_TOOLS_REAL:-NOT DETECTED}"
          echo "ANDROID_BUILD_TOOLS_DIR=${ANDROID_BUILD_TOOLS_DIR:-NOT DETECTED}"

          echo
          echo "ANDROID_NDK_FOUND=${ANDROID_NDK_FOUND:-false}"
          echo "ANDROID_NDK_REAL=${ANDROID_NDK_REAL:-NOT DETECTED}"


      # ============================================================
      # 29 - PATH VALIDATION
      # ============================================================

      - name: 29 - Validate detected paths
        run: |
          set -o pipefail

          echo "========================================"
          echo "PATH VALIDATION"
          echo "========================================"

          FAILED=0

          if [ "${ANDROID_SDK_FOUND:-false}" = "true" ]; then

            if [ -d "$ANDROID_SDK_REAL" ]; then
              echo "PASS: Android SDK path"
              echo "$ANDROID_SDK_REAL"
            else
              echo "FAIL: Android SDK path does not exist"
              FAILED=1
            fi

          else

            echo "INFO: Android SDK not detected."

          fi


          if [ "${ANDROID_BUILD_TOOLS_FOUND:-false}" = "true" ]; then

            if [ -d "$ANDROID_BUILD_TOOLS_DIR" ]; then
              echo "PASS: Build Tools path"
              echo "$ANDROID_BUILD_TOOLS_DIR"
            else
              echo "FAIL: Build Tools path does not exist"
              FAILED=1
            fi

          else

            echo "INFO: Build Tools not detected."

          fi


          if [ "${ANDROID_NDK_FOUND:-false}" = "true" ]; then

            if [ -d "$ANDROID_NDK_REAL" ]; then
              echo "PASS: NDK path"
              echo "$ANDROID_NDK_REAL"
            else
              echo "FAIL: NDK path does not exist"
              FAILED=1
            fi

            if [ -f "$ANDROID_NDK_REAL/source.properties" ]; then
              echo "PASS: NDK source.properties"
            else
              echo "FAIL: NDK source.properties missing"
              FAILED=1
            fi

          else

            echo "INFO: NDK not detected."

          fi


          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi


      # ============================================================
      # 30 - FINAL PRE-BUILD REPORT
      #
      # This workflow intentionally stops before APK build.
      # ============================================================

      - name: 30 - Final pre-build prerequisite report
        run: |
          set -o pipefail

          echo "========================================"
          echo "FINAL PRE-BUILD REPORT"
          echo "========================================"

          FAILED=0


          echo
          echo "PROJECT"
          echo "----------------------------------------"

          if [ -f "$SPEC_FILE" ]; then
            echo "PASS - buildozer.spec"
          else
            echo "FAIL - buildozer.spec"
            FAILED=1
          fi

          if [ -d "$PROJECT_DIR" ]; then
            echo "PASS - project directory"
          else
            echo "FAIL - project directory"
            FAILED=1
          fi


          echo
          echo "PYTHON"
          echo "----------------------------------------"

          if python -c \
            "import sys; raise SystemExit(0 if sys.version_info[:2] == (3,11) else 1)"
          then
            echo "PASS - Python 3.11"
          else
            echo "FAIL - Python 3.11"
            FAILED=1
          fi


          echo
          echo "JAVA"
          echo "----------------------------------------"

          if command -v java >/dev/null 2>&1 \
            && command -v javac >/dev/null 2>&1
          then
            echo "PASS - Java"
            echo "PASS - javac"
          else
            echo "FAIL - Java environment"
            FAILED=1
          fi


          echo
          echo "HOST BUILD TOOLS"
          echo "----------------------------------------"

          HOST_TOOLS=(
            git
            gcc
            g++
            make
            cmake
            autoconf
            automake
            libtool
            pkg-config
            zip
            unzip
            patch
            file
          )

          for TOOL in "${HOST_TOOLS[@]}"; do

            if command -v "$TOOL" >/dev/null 2>&1; then
              echo "PASS - $TOOL"
            else
              echo "FAIL - $TOOL"
              FAILED=1
            fi

          done


          echo
          echo "BUILDOZER"
          echo "----------------------------------------"

          if command -v buildozer >/dev/null 2>&1; then
            echo "PASS - Buildozer"
            buildozer --version
          else
            echo "FAIL - Buildozer"
            FAILED=1
          fi


          echo
          echo "CYTHON"
          echo "----------------------------------------"

          if python -c "import Cython" >/dev/null 2>&1; then
            echo "PASS - Cython"
          else
            echo "FAIL - Cython"
            FAILED=1
          fi


          echo
          echo "ANDROID SDK"
          echo "----------------------------------------"

          if [ "${ANDROID_SDK_FOUND:-false}" = "true" ]; then

            echo "PASS - Android SDK"
            echo "PATH: $ANDROID_SDK_REAL"

          else

            echo "INFO - Android SDK not detected"

          fi


          echo
          echo "ANDROID BUILD TOOLS"
          echo "----------------------------------------"

          if [ "${ANDROID_BUILD_TOOLS_FOUND:-false}" = "true" ]; then

            echo "PASS - Build Tools"
            echo "VERSION: $ANDROID_BUILD_TOOLS_REAL"
            echo "PATH: $ANDROID_BUILD_TOOLS_DIR"

          else

            echo "INFO - Build Tools not detected"

          fi


          echo
          echo "ANDROID NDK"
          echo "----------------------------------------"

          if [ "${ANDROID_NDK_FOUND:-false}" = "true" ]; then

            echo "PASS - Android NDK"
            echo "PATH: $ANDROID_NDK_REAL"

          else

            echo "INFO - Android NDK not detected"

          fi


          echo
          echo "========================================"
          echo "APK BUILD STATUS"
          echo "========================================"

          echo "APK BUILD: NOT RUN"
          echo "AAB BUILD: NOT RUN"
          echo "BUILDOZER ANDROID BUILD: NOT RUN"

          echo
          echo "========================================"
          echo "FINAL RESULT"
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then

            echo "PRE-BUILD CORE CHECK: FAILED"
            echo "See the failed section above."

            exit 1

          fi

          echo "PRE-BUILD CORE CHECK: PASSED"
          echo "No APK/AAB build was performed."


      # ============================================================
      # 31 - CREATE REPORT
      # ============================================================

      - name: 31 - Create diagnostic report
        if: always()
        run: |
          set +e

          mkdir -p diagnostic-report

          {
            echo "========================================"
            echo "MONEYTRACKER PRE-BUILD DIAGNOSTIC"
            echo "========================================"

            echo
            echo "DATE:"
            date

            echo
            echo "RUNNER:"
            uname -a

            echo
            echo "PROJECT:"
            echo "SPEC_FILE=${SPEC_FILE:-NOT SET}"
            echo "PROJECT_DIR=${PROJECT_DIR:-NOT SET}"

            echo
            echo "PYTHON:"
            python --version 2>&1

            echo
            echo "JAVA:"
            java -version 2>&1

            echo
            echo "BUILDOZER:"
            buildozer --version 2>&1

            echo
            echo "CYTHON:"
            cython --version 2>&1

            echo
            echo "ANDROID SDK:"
            echo "${ANDROID_SDK_REAL:-NOT DETECTED}"

            echo
            echo "BUILD TOOLS:"
            echo "${ANDROID_BUILD_TOOLS_REAL:-NOT DETECTED}"
            echo "${ANDROID_BUILD_TOOLS_DIR:-NOT DETECTED}"

            echo
            echo "ANDROID NDK:"
            echo "${ANDROID_NDK_REAL:-NOT DETECTED}"

            echo
            echo "DISK:"
            df -h

          } > diagnostic-report/prebuild-summary.txt

          if [ -f "$SPEC_FILE" ]; then
            cp \
              "$SPEC_FILE" \
              diagnostic-report/buildozer.spec.copy
          fi

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -print \
            | sort \
            > diagnostic-report/project-tree.txt

          {
            echo "========================================"
            echo "ANDROID VARIABLES"
            echo "========================================"

            env | sort | grep -E \
              '^(ANDROID|BUILDOZER|JAVA|PYTHON|P4A)' \
              || true

          } > diagnostic-report/environment.txt


      # ============================================================
      # 32 - UPLOAD DIAGNOSTIC REPORT
      # ============================================================

      - name: 32 - Upload pre-build diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-PreBuild-Diagnostic
          path: diagnostic-report
          if-no-files-found: error