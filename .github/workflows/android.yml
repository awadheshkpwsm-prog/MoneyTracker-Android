name: Build Money Tracker Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      # ============================================================
      # PYTHON / JAVA
      # ============================================================
      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"

      # ============================================================
      # ANDROID TOOLCHAIN
      #
      # These MUST match buildozer.spec
      # ============================================================
      ANDROID_API: "33"
      ANDROID_MIN_API: "21"
      ANDROID_BUILD_TOOLS: "33.0.2"

      # p4a recommends NDK 28c.
      # GitHub runner provides the corresponding NDK package:
      # 28.2.13676358
      ANDROID_NDK_VERSION: "28.2.13676358"

      # ============================================================
      # BUILDOZER
      # ============================================================
      BUILDOZER_WARN_ON_ROOT: "0"

      # ============================================================
      # PIP
      # ============================================================
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON 3.11
      #
      # No pip cache.
      # No requirements.txt required.
      # ============================================================
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: ""

      # ============================================================
      # 3. JAVA 17
      #
      # IMPORTANT:
      # Maven cache is intentionally NOT enabled.
      # This project has no pom.xml.
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: ""

      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            libsqlite3-dev

      # ============================================================
      # 5. VERIFY PYTHON / JAVA
      # ============================================================
      - name: Verify Python and Java
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python3 --version
          which python
          which python3

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

      # ============================================================
      # 6. INSTALL BUILDOZER
      # ============================================================
      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<26" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.34" \
            "sh"

      # ============================================================
      # 7. VERIFY BUILDOZER
      # ============================================================
      - name: Verify Buildozer
        run: |
          set -eux

          buildozer --version

          python -c "import Cython; print('Cython:', Cython.__version__)"

          python -c "import buildozer; print('Buildozer:', buildozer.__version__)"

      # ============================================================
      # 8. USE RUNNER ANDROID SDK
      #
      # IMPORTANT:
      #
      # DO NOT create another Android SDK.
      # DO NOT let Buildozer download its own SDK.
      #
      # GitHub runner already contains:
      #
      # build-tools;33.0.2
      # platforms;android-33
      # ndk;28.2.13676358
      #
      # ============================================================
      - name: Configure Android SDK
        run: |
          set -eux

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "========================================"
          echo "REQUIRED SDK COMPONENTS"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-33"

          test -d "$ANDROID_HOME/build-tools/33.0.2"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "Android API 33: OK"
          echo "Build Tools 33.0.2: OK"
          echo "NDK 28.2.13676358: OK"

      # ============================================================
      # 9. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      # ============================================================
      # 10. VERIFY AIDL
      #
      # IMPORTANT:
      # Do NOT use:
      #
      # aidl --version
      #
      # because Build Tools 33.0.2 does not support that syntax.
      #
      # Just verify that the executable exists and runs.
      # ============================================================
      - name: Verify Android Build Tools and AIDL
        run: |
          set -eux

          AIDL="$ANDROID_HOME/build-tools/33.0.2/aidl"

          test -x "$AIDL"

          echo "AIDL found:"
          "$AIDL" 2>&1 | head -n 20 || true

          echo "AIDL executable verified."

      # ============================================================
      # 11. VERIFY NDK
      # ============================================================
      - name: Verify Android NDK
        run: |
          set -eux

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          echo "========================================"
          echo "NDK"
          echo "========================================"

          echo "NDK_PATH=$NDK_PATH"

          test -d "$NDK_PATH"

          echo "NDK directory exists."

          if [ -x "$NDK_PATH/ndk-build" ]; then
            "$NDK_PATH/ndk-build" --version
          fi

      # ============================================================
      # 12. EXPORT ANDROID NDK VARIABLES
      # ============================================================
      - name: Configure Android NDK environment
        run: |
          set -eux

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "$NDK_PATH" >> "$GITHUB_PATH"

      # ============================================================
      # 13. VERIFY buildozer.spec
      # ============================================================
      - name: Verify buildozer.spec
        run: |
          set -eux

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOVER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "REQUIRED SETTINGS"
          echo "========================================"

          grep -E \
            'android.api|android.minapi|android.ndk|android.ndk_api|android.build_tools_version|android.archs|requirements' \
            buildozer.spec

          echo "========================================"
          echo "CHECK BUILD-TOOLS 37 REFERENCES"
          echo "========================================"

          if grep -R -n -E \
            'build-tools;37|build-tools/37|build_tools_version *= *37|android.build_tools_version *= *37' \
            buildozer.spec .github/workflows \
            --exclude-dir=.git; then

            echo "ERROR: BUILD-TOOLS 37 REFERENCE FOUND."
            exit 1
          fi

          echo "No Build-Tools 37 reference found."

      # ============================================================
      # 14. VERIFY SPEC MATCHES RUNNER
      #
      # This prevents the workflow and spec from silently
      # requesting different versions.
      # ============================================================
      - name: Verify toolchain matches buildozer.spec
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY TOOLCHAIN MATCH"
          echo "========================================"

          grep -q '^android.api = 33$' buildozer.spec

          grep -q '^android.minapi = 21$' buildozer.spec

          grep -q '^android.ndk = 28c$' buildozer.spec

          grep -q '^android.ndk_api = 21$' buildozer.spec

          grep -q '^android.build_tools_version = 33.0.2$' buildozer.spec

          grep -q '^android.archs = arm64-v8a,armeabi-v7a$' buildozer.spec

          echo "buildozer.spec toolchain settings are correct."

      # ============================================================
      # 15. PREPARE BUILDOZER DIRECTORIES
      #
      # Buildozer normally creates:
      #
      # .buildozer/android/platform/android-sdk
      #
      # and then downloads its own SDK/NDK.
      #
      # We instead connect that expected path to the runner SDK.
      #
      # ============================================================
      - name: Prepare Buildozer Android SDK link
        run: |
          set -eux

          echo "========================================"
          echo "PREPARE BUILDOZER"
          echo "========================================"

          rm -rf .buildozer

          mkdir -p .buildozer/android/platform

          ln -s "$ANDROID_HOME" \
            ".buildozer/android/platform/android-sdk"

          echo "Buildozer Android SDK link:"
          ls -lah .buildozer/android/platform

          echo "SDK through Buildozer path:"

          test -d \
            ".buildozer/android/platform/android-sdk/build-tools/33.0.2"

          test -d \
            ".buildozer/android/platform/android-sdk/platforms/android-33"

          test -d \
            ".buildozer/android/platform/android-sdk/ndk/28.2.13676358"

          echo "Buildozer can see runner SDK."

      # ============================================================
      # 16. CONFIGURE P4A / BUILDOZER ENVIRONMENT
      #
      # Prevent Buildozer from using a different NDK path.
      # ============================================================
      - name: Configure final Android environment
        run: |
          set -eux

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          export ANDROID_NDK_ROOT="$NDK_PATH"
          export ANDROID_NDK_HOME="$NDK_PATH"
          export ANDROID_NDK="$NDK_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH"
          echo "ANDROID_NDK=$NDK_PATH"

          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$NDK_PATH"

      # ============================================================
      # 17. BUILD APK
      #
      # ONLY workflow_dispatch can reach this step.
      #
      # Editing buildozer.spec or android.yml will NOT
      # automatically start a build.
      # ============================================================
      - name: Build Money Tracker APK
        run: |
          set -eux

          export BUILDOZER_WARN_ON_ROOT=0

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          echo "========================================"
          echo "MONEY TRACKER APK BUILD"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          buildozer -v android debug

      # ============================================================
      # 18. SEARCH APK
      # ============================================================
      - name: Find APK
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "APK / AAB SEARCH"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print

          echo ""
          echo "AAB files:"
          find . -type f -name "*.aab" -print

          echo ""
          echo "Bin directory:"
          ls -lah bin 2>/dev/null || true

          echo ""
          echo "Buildozer directory:"
          ls -lah .buildozer 2>/dev/null || true

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload Money Tracker APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error

      # ============================================================
      # 20. UPLOAD BUILD LOGS
      # ============================================================
      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/
          if-no-files-found: warn
