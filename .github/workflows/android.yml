name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

  BUILDOZER_VERSION: "1.6.0"
  CYTHON_VERSION: "0.29.34"
  P4A_VERSION: "2024.1.21"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:

  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      #
      # IMPORTANT:
      # No Gradle/Maven cache is configured.
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11.13
      #
      # No dependency cache.
      # ============================================================

      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. LINUX DEPENDENCIES
      # ============================================================

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache


      # ============================================================
      # 5. INSTALL BUILDOZER + P4A
      # ============================================================

      - name: Install Buildozer and Python-for-Android
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<27" \
            "setuptools<81" \
            wheel

          python -m pip install \
          "pip<25" \
          "setuptools<81" \
          "wheel" \
          "Cython==0.29.34" \
          "buildozer==1.6.0" \
          "python-for-android==2024.1.21"

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          python --version
          python -m pip --version
          buildozer --version
          p4a --version


      # ============================================================
      # 6. LOCATE BUILDOZER PROJECT
      # ============================================================

      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/buildozer.spec"


      # ============================================================
      # 7. VERIFY PROJECT
      # ============================================================

      - name: Verify project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd
          ls -lah

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.' \
            buildozer.spec \
            || true


      # ============================================================
      # 8. INITIALIZE BUILDOZER ANDROID ENVIRONMENT
      #
      # IMPORTANT:
      #
      # We do NOT set ANDROID_HOME before this step.
      #
      # Buildozer is allowed to create/use its own default SDK:
      #
      # ~/.buildozer/android/platform/android-sdk
      #
      # No hard-coded tools/bin/sdkmanager path is used.
      # ============================================================

      - name: Initialize Buildozer Android environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER INITIALIZATION"
          echo "========================================"

          echo "HOME=$HOME"

          echo "========================================"
          echo "BUILDOZER DIRECTORY BEFORE INITIALIZATION"
          echo "========================================"

          find "$HOME/.buildozer" \
            -maxdepth 6 \
            -type d \
            2>/dev/null \
            | sort \
            | head -300 \
            || true

          echo "========================================"
          echo "BUILD TOOLS INITIALIZATION"
          echo "========================================"

          # Ask Buildozer/p4a to prepare its Android platform.
          #
          # This intentionally does NOT provide ANDROID_HOME.
          # Buildozer therefore keeps ownership of its Android SDK.

          buildozer android clean || true

          buildozer android debug --help >/dev/null 2>&1 || true

          echo "========================================"
          echo "BUILDOZER DIRECTORY AFTER INITIALIZATION"
          echo "========================================"

          find "$HOME/.buildozer" \
            -maxdepth 8 \
            -type d \
            2>/dev/null \
            | sort \
            | head -500 \
            || true


      # ============================================================
      # 9. FIND BUILDOZER SDK
      #
      # This is the critical part.
      #
      # We discover the SDK Buildozer actually created.
      # We do NOT assume Android Studio's SDK.
      # ============================================================

      - name: Detect Buildozer Android SDK
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING BUILDOZER SDK"
          echo "========================================"

          SDK=""

          CANDIDATE_1="$HOME/.buildozer/android/platform/android-sdk"

          if [ -d "$CANDIDATE_1" ]; then
            SDK="$CANDIDATE_1"
          fi

          if [ -z "$SDK" ]; then
            SDK="$(
              find "$HOME/.buildozer" \
                -type d \
                -path "*/android/platform/android-sdk" \
                2>/dev/null \
                | head -n 1
            )"
          fi

          if [ -z "$SDK" ]; then
            echo "ERROR: Buildozer Android SDK was not found."

            echo "Buildozer directories:"
            find "$HOME/.buildozer" \
              -maxdepth 10 \
              -type d \
              2>/dev/null \
              | sort \
              | head -1000 \
              || true

            exit 1
          fi

          echo "BUILDOZER_ANDROID_SDK=$SDK"

          echo "BUILDOZER_ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

          test -d "$SDK"


      # ============================================================
      # 10. FIND SDKMANAGER INSIDE BUILDOZER SDK
      #
      # Supports modern cmdline-tools layouts.
      #
      # No /tools/bin/sdkmanager assumption.
      # ============================================================

      - name: Detect Buildozer SDK manager
        shell: bash
        run: |
          set -eux

          SDK="$BUILDOZER_ANDROID_SDK"

          echo "========================================"
          echo "BUILDOZER SDK"
          echo "========================================"

          echo "$SDK"

          test -d "$SDK"

          SDKMANAGER="$(
            find "$SDK" \
              -type f \
              -name "sdkmanager" \
              -perm -111 \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found inside Buildozer SDK."

            echo "SDK contents:"
            find "$SDK" \
              -maxdepth 8 \
              -type f \
              | sort \
              | head -1000

            exit 1
          fi

          echo "BUILDOZER_SDKMANAGER=$SDKMANAGER"

          echo "BUILDOZER_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version || true


      # ============================================================
      # 11. CONNECT ALL ANDROID VARIABLES TO BUILDOZER SDK
      #
      # From this point onward everything points to the SDK
      # Buildozer owns.
      # ============================================================

      - name: Connect Android environment to Buildozer SDK
        shell: bash
        run: |
          set -eux

          SDK="$BUILDOZER_ANDROID_SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo "========================================"
          echo "CONNECTED PATHS"
          echo "========================================"

          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROIDSDK=$SDK"

          echo "BUILD_TOOLS=$SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "NDK=$SDK/ndk/${ANDROID_NDK_VERSION}"


      # ============================================================
      # 12. ACCEPT LICENSES USING BUILDOZER'S SDKMANAGER
      # ============================================================

      - name: Accept Buildozer Android licenses
        shell: bash
        run: |
          set -eux

          SDK="$BUILDOZER_ANDROID_SDK"
          SDKMANAGER="$BUILDOZER_SDKMANAGER"

          echo "========================================"
          echo "SDK LICENSES"
          echo "========================================"

          echo "SDK=$SDK"
          echo "SDKMANAGER=$SDKMANAGER"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          echo "License processing completed."


      # ============================================================
      # 13. INSTALL BUILD TOOLS 37 + PLATFORM + NDK
      #
      # IMPORTANT:
      # Installation happens INSIDE Buildozer's SDK.
      # ============================================================

      - name: Install Android Build Tools 37 and NDK
        shell: bash
        run: |
          set -eux

          SDK="$BUILDOZER_ANDROID_SDK"
          SDKMANAGER="$BUILDOZER_SDKMANAGER"

          echo "========================================"
          echo "INSTALLING ANDROID COMPONENTS"
          echo "========================================"

          echo "SDK=$SDK"
          echo "SDKMANAGER=$SDKMANAGER"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"


      # ============================================================
      # 14. VERIFY BUILDOZER SDK
      # ============================================================

      - name: Verify Buildozer Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$BUILDOZER_ANDROID_SDK"

          BUILD_TOOLS="$SDK/build-tools/${ANDROID_BUILD_TOOLS}"
          NDK="$SDK/ndk/${ANDROID_NDK_VERSION}"
          PLATFORM="$SDK/platforms/android-${ANDROID_API}"

          echo "========================================"
          echo "ANDROID SDK VERIFICATION"
          echo "========================================"

          echo "SDK=$SDK"
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          echo "NDK=$NDK"
          echo "PLATFORM=$PLATFORM"

          test -d "$SDK"
          test -d "$BUILD_TOOLS"
          test -d "$NDK"
          test -d "$PLATFORM"

          echo "========================================"
          echo "AIDL"
          echo "========================================"

          test -x "$BUILD_TOOLS/aidl"

          "$BUILD_TOOLS/aidl" --version || true

          echo "========================================"
          echo "AAPT2"
          echo "========================================"

          test -x "$BUILD_TOOLS/aapt2"

          "$BUILD_TOOLS/aapt2" version || true

          echo "========================================"
          echo "ZIPALIGN"
          echo "========================================"

          test -x "$BUILD_TOOLS/zipalign"

          echo "zipalign OK"

          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -f "$NDK/source.properties"

          cat "$NDK/source.properties"

          echo "========================================"
          echo "ANDROID PLATFORM"
          echo "========================================"

          test -d "$PLATFORM"

          echo "Android SDK components verified."


      # ============================================================
      # 15. FINAL ENVIRONMENT CHECK
      # ============================================================

      - name: Final environment check
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "FINAL ENVIRONMENT"
          echo "========================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "P4A:"
          p4a --version

          echo "========================================"
          echo "ANDROID VARIABLES"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"

          echo "========================================"
          echo "BUILDOZER SDK"
          echo "========================================"

          echo "$BUILDOZER_ANDROID_SDK"

          test "$ANDROID_HOME" = "$BUILDOZER_ANDROID_SDK"

          test -d \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          test -d \
            "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "========================================"
          echo "FINAL ENVIRONMENT READY"
          echo "========================================"


      # ============================================================
      # 16. CLEAN OLD BUILD CACHE
      #
      # Source code is preserved.
      # ============================================================

      - name: Clean old Buildozer build cache
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/packages
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p bin

          echo "All Buildozer and p4a caches removed."


         

          echo "Old project Buildozer build cache removed."
          echo "Source files preserved."


      # ============================================================
      # 17. RECONNECT BUILDOZER SDK AFTER CACHE CLEAN
      #
      # Cleaning .buildozer can remove the local project cache,
      # but the SDK path remains recorded.
      # ============================================================

      - name: Reconnect Buildozer Android environment
        shell: bash
        run: |
          set -eux

          SDK="$BUILDOZER_ANDROID_SDK"

          test -d "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"


          echo "========================================"
          echo "P4A VERSION"
          echo "========================================"

          p4a --version || true

          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"

          python --version



        
      # ============================================================
      # 18. BUILD APK
      # ============================================================

          


        
      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "START MONEYTRACKER APK BUILD"
          echo "========================================"

          echo "Project:"
          pwd

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "P4A:"
          p4a --version

          echo "========================================"
          echo "BUILDOZER ANDROID SDK"
          echo "========================================"

          echo "$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          echo "========================================"
          echo "BUILD TOOLS 37"
          echo "========================================"

          test -d \
            "$ANDROID_HOME/build-tools/37.0.0"

          test -x \
            "$ANDROID_HOME/build-tools/37.0.0/aidl"

          echo "Build Tools 37.0.0 READY"

          echo "========================================"
          echo "NDK 28.2"
          echo "========================================"

          test -d \
            "$ANDROID_HOME/ndk/28.2.13676358"

          echo "NDK 28.2.13676358 READY"

          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 19. FIND APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "BIN:"
            ls -lah bin || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"
          ls -lh "$APK_FILE"


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================

      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. SUCCESS
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Artifact:"
          echo "MoneyTracker-APK"
