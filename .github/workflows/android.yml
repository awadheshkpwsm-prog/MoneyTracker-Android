name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-android:

    name: Build MoneyTracker Android APK

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 4. LINUX DEPENDENCIES
      # ==========================================================

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            build-essential


      # ==========================================================
      # 5. INSTALL BUILDOZER
      # ==========================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          echo "=========================================="
          echo "BUILDOZER VERSION"
          echo "=========================================="

          buildozer --version

          echo "=========================================="
          echo "CYTHON VERSION"
          echo "=========================================="

          cython --version


      # ==========================================================
      # 6. VERIFY PROJECT STRUCTURE
      # ==========================================================

      - name: Verify MoneyTracker project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          pwd

          echo ""
          echo "ROOT:"
          ls -lah

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo ""
          echo "Checking mt directory..."

          test -d mt

          echo ""
          echo "MT FILES:"

          find mt -maxdepth 2 -type f -print | sort


      # ==========================================================
      # 7. SHOW ANDROID CONFIGURATION
      # ==========================================================

      - name: Verify buildozer.spec configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^(android.api|android.minapi|android.ndk|android.build_tools_version|p4a.branch|android.archs|requirements)' \
            buildozer.spec


      # ==========================================================
      # 8. FIRST BUILDOZER INITIALIZATION
      #
      # This creates Buildozer's internal directories.
      # ==========================================================

      - name: Initialize Buildozer
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INITIALIZING BUILDOZER"
          echo "=========================================="

          buildozer android clean || true


      # ==========================================================
      # 9. PREPARE BUILDOZER INTERNAL SDK
      #
      # Buildozer uses:
      #
      # ~/.buildozer/android/platform/android-sdk
      #
      # We install the exact Build Tools requested
      # by buildozer.spec.
      # ==========================================================

      - name: Prepare Buildozer Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "BUILDOZER INTERNAL SDK"
          echo "=========================================="

          echo "SDK=$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          rm -rf "$RUNNER_TEMP/cmdline-tools"

          mkdir -p "$RUNNER_TEMP/cmdline-tools"

          unzip -q \
            commandlinetools.zip \
            -d "$RUNNER_TEMP/cmdline-tools"

          cp -R \
            "$RUNNER_TEMP/cmdline-tools/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo ""
          echo "SDKMANAGER:"
          command -v sdkmanager


      # ==========================================================
      # 10. ACCEPT LICENSES
      # ==========================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$SDK" \
            --licenses || true


      # ==========================================================
      # 11. INSTALL EXACT SDK
      #
      # API 35
      # BUILD TOOLS 37.0.0
      # PLATFORM TOOLS
      # ==========================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          sdkmanager \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"


      # ==========================================================
      # 12. VERIFY BUILD TOOLS
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "Installed packages:"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "Build Tools directory:"

          ls -lah "$SDK/build-tools"

          echo ""
          echo "Build Tools 37.0.0:"

          test -d "$SDK/build-tools/37.0.0"

          ls -lah "$SDK/build-tools/37.0.0"

          echo ""
          echo "AIDL:"

          test -x "$SDK/build-tools/37.0.0/aidl"

          ls -lh "$SDK/build-tools/37.0.0/aidl"

          echo ""
          echo "AAPT2:"

          test -x "$SDK/build-tools/37.0.0/aapt2"

          echo ""
          echo "D8:"

          test -x "$SDK/build-tools/37.0.0/d8"


      # ==========================================================
      # 13. SET SDK ENVIRONMENT
      # ==========================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # ==========================================================
      # 14. VERIFY FINAL ENVIRONMENT
      # ==========================================================

      - name: Final environment verification
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "FINAL ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$SDK"

          echo ""
          echo "BUILD TOOLS:"
          echo "$SDK/build-tools/37.0.0"

          echo ""
          echo "AIDL:"

          test -x "$SDK/build-tools/37.0.0/aidl"

          echo "AIDL FOUND"


      # ==========================================================
      # 15. BUILD APK
      # ==========================================================

      - name: Build MoneyTracker APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================================
      # 16. FIND APK
      # ==========================================================

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          if [ -d bin ]; then

            find bin \
              -type f \
              -name "*.apk" \
              -print

            echo ""
            echo "APK DETAILS:"

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "bin directory not found."

          fi


      # ==========================================================
      # 17. UPLOAD APK
      # ==========================================================

      - name: Upload MoneyTracker APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
