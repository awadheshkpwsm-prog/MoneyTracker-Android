name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"
      BUILDOZER_VERSION: "1.6.0"
      CYTHON_VERSION: "0.29.34"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      MAVEN_ARGS: "-ntp"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libltdl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            liblzma-dev


      # ============================================================
      # 5. FIND PROJECT DIRECTORY
      # ============================================================

      - name: Find buildozer project
        run: |
          set -euxo pipefail

          SPEC_FILE="$(find "$GITHUB_WORKSPACE" -name "buildozer.spec" -type f | head -n 1)"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "SPEC_FILE=$SPEC_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. INSTALL EXACT PYTHON BUILD TOOLS
      # ============================================================

      - name: Install Buildozer and Python dependencies
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}" \
            "buildozer==${BUILDOZER_VERSION}"

          python -m pip install \
            virtualenv \
            packaging \
            pyjnius

          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"

          python --version

          echo "========================================"
          echo "PIP VERSION"
          echo "========================================"

          python -m pip --version

          echo "========================================"
          echo "CYTHON VERSION"
          echo "========================================"

          cython --version

          echo "========================================"
          echo "BUILDOZER VERSION"
          echo "========================================"

          buildozer --version


      # ============================================================
      # 7. CLEAN OLD BUILDOZER / P4A STATE
      # ============================================================

      - name: Clean old Android build state
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"
          rm -rf "$HOME/.buildozer/android/platform/android-ndk"* || true

          echo "Old project and Android platform cache cleaned."


      # ============================================================
      # 8. LET BUILDOZER INITIALIZE ITS OWN ANDROID PLATFORM
      #
      # IMPORTANT:
      # No Android Build Tools 33.0.2 installation here.
      # No hardcoded NDK version installation here.
      #
      # Buildozer/p4a is allowed to prepare its own environment first.
      # ============================================================

      - name: Initialize Buildozer Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING / INITIALIZING BUILDOZER"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee buildozer-initialization.log

          BUILD_EXIT="${PIPESTATUS[0]}"

          echo "Buildozer exit code: $BUILD_EXIT"

          echo "========================================"
          echo "BUILDOZER PLATFORM CONTENTS"
          echo "========================================"

          find "$HOME/.buildozer/android/platform" \
            -maxdepth 4 \
            -print \
            2>/dev/null \
            | sort \
            | head -2000 \
            || true

          echo "BUILD_EXIT=$BUILD_EXIT" >> "$GITHUB_ENV"

          # We intentionally do not stop here.
          # Even if the first build fails later, SDK/NDK may already
          # have been downloaded by Buildozer and can be detected below.
          exit 0


      # ============================================================
      # 9. DETECT THE REAL ANDROID SDK CREATED / USED BY BUILDOZER
      # ============================================================

      - name: Detect actual Android SDK
        run: |
          set -euxo pipefail

          PLATFORM="$HOME/.buildozer/android/platform"

          echo "========================================"
          echo "SEARCHING FOR ANDROID SDK"
          echo "========================================"

          echo "Platform:"
          echo "$PLATFORM"

          SDK=""

          # First try the standard Buildozer location.
          if [ -d "$PLATFORM/android-sdk" ]; then
            SDK="$PLATFORM/android-sdk"
          fi

          # If needed, search for an SDK containing platform-tools.
          if [ -z "$SDK" ]; then
            SDK="$(
              find "$PLATFORM" \
                -type d \
                -name platform-tools \
                -printf '%h\n' \
                2>/dev/null \
                | sort \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK could not be detected."

            find "$PLATFORM" \
              -maxdepth 5 \
              -print \
              2>/dev/null \
              | sort \
              | head -3000

            exit 1
          fi

          echo "========================================"
          echo "DETECTED ANDROID SDK"
          echo "========================================"

          echo "$SDK"

          echo "ANDROID_SDK_REAL=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"


      # ============================================================
      # 10. DETECT ACTUAL BUILD TOOLS
      #
      # No installation of 33.0.2.
      # Detect whatever version Buildozer / SDK actually installed.
      # ============================================================

      - name: Detect actual Android Build Tools
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "ANDROID BUILD TOOLS"
          echo "========================================"

          if [ ! -d "$SDK/build-tools" ]; then
            echo "ERROR: build-tools directory does not exist."
            exit 1
          fi

          find "$SDK/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort -V

          BUILD_TOOLS_VERSION="$(
            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: No Android Build Tools found."
            exit 1
          fi

          BUILD_TOOLS_DIR="$SDK/build-tools/$BUILD_TOOLS_VERSION"

          echo "========================================"
          echo "SELECTED BUILD TOOLS"
          echo "========================================"

          echo "VERSION: $BUILD_TOOLS_VERSION"
          echo "PATH:    $BUILD_TOOLS_DIR"

          test -d "$BUILD_TOOLS_DIR"

          echo "ANDROID_BUILD_TOOLS_REAL=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 11. DETECT NDK AFTER BUILDOZER INITIALIZATION
      #
      # First check:
      #   SDK/ndk/*
      #
      # Then check:
      #   Buildozer platform directories
      #
      # Then locate any valid source.properties.
      #
      # The detected REAL NDK path is assigned to all NDK variables.
      # ============================================================

      - name: Detect actual Android NDK
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_REAL"
          PLATFORM="$HOME/.buildozer/android/platform"

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "$SDK"

          echo "========================================"
          echo "SDK NDK DIRECTORY"
          echo "========================================"

          if [ -d "$SDK/ndk" ]; then
            find "$SDK/ndk" \
              -mindepth 1 \
              -maxdepth 2 \
              -type d \
              | sort -V
          else
            echo "SDK/ndk does not currently exist."
          fi

          echo "========================================"
          echo "SEARCHING FOR USABLE NDK"
          echo "========================================"

          NDK_DIR=""

          # --------------------------------------------------------
          # Priority 1:
          # Android SDK side-by-side NDK
          # --------------------------------------------------------

          if [ -d "$SDK/ndk" ]; then

            NDK_DIR="$(
              find "$SDK/ndk" \
                -mindepth 2 \
                -maxdepth 2 \
                -type f \
                -name source.properties \
                2>/dev/null \
                | sed 's#/source.properties##' \
                | sort -V \
                | tail -n 1 \
                || true
            )"

          fi

          # --------------------------------------------------------
          # Priority 2:
          # Any Buildozer-managed android-ndk directory
          # --------------------------------------------------------

          if [ -z "$NDK_DIR" ]; then

            NDK_DIR="$(
              find "$PLATFORM" \
                -type f \
                -path "*/source.properties" \
                -path "*ndk*" \
                2>/dev/null \
                | sed 's#/source.properties##' \
                | sort -V \
                | tail -n 1 \
                || true
            )"

          fi

          # --------------------------------------------------------
          # Final validation
          # --------------------------------------------------------

          if [ -z "$NDK_DIR" ]; then

            echo "ERROR: No usable Android NDK installation found."

            echo "========================================"
            echo "FULL BUILDOZER PLATFORM STRUCTURE"
            echo "========================================"

            find "$PLATFORM" \
              -maxdepth 6 \
              -print \
              2>/dev/null \
              | sort \
              | head -5000

            exit 1
          fi

          if [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: Detected NDK path is not a directory:"
            echo "$NDK_DIR"
            exit 1
          fi

          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "ERROR: source.properties missing:"
            echo "$NDK_DIR/source.properties"
            exit 1
          fi

          echo "========================================"
          echo "SELECTED REAL NDK"
          echo "========================================"

          echo "$NDK_DIR"

          echo "========================================"
          echo "NDK VERSION INFORMATION"
          echo "========================================"

          cat "$NDK_DIR/source.properties"

          echo "ANDROID_NDK_REAL=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 12. FINAL ANDROID ENVIRONMENT CHECK
      # ============================================================

      - name: Final Android environment diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FINAL ANDROID SDK"
          echo "========================================"
          echo "$ANDROID_SDK_REAL"

          echo "========================================"
          echo "FINAL BUILD TOOLS"
          echo "========================================"
          echo "VERSION: $ANDROID_BUILD_TOOLS_REAL"
          echo "PATH:    $ANDROID_BUILD_TOOLS_DIR"

          echo "========================================"
          echo "FINAL ANDROID NDK"
          echo "========================================"
          echo "$ANDROID_NDK_REAL"

          echo "========================================"
          echo "NDK source.properties"
          echo "========================================"
          cat "$ANDROID_NDK_REAL/source.properties"

          echo "========================================"
          echo "SDK DIRECTORIES"
          echo "========================================"

          find "$ANDROID_SDK_REAL" \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -1000

          test -d "$ANDROID_SDK_REAL"
          test -d "$ANDROID_BUILD_TOOLS_DIR"
          test -d "$ANDROID_NDK_REAL"
          test -f "$ANDROID_NDK_REAL/source.properties"


      # ============================================================
      # 13. SHOW BUILDOZER SPEC AND REAL ENVIRONMENT
      # ============================================================

      - name: Show Buildozer configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "buildozer.spec"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "REAL ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_BUILD_TOOLS_REAL=$ANDROID_BUILD_TOOLS_REAL"
          echo "ANDROID_BUILD_TOOLS_DIR=$ANDROID_BUILD_TOOLS_DIR"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"


      # ============================================================
      # 14. BUILD AGAIN USING DETECTED ENVIRONMENT
      #
      # Now:
      # SDK = actual Buildozer SDK
      # Build Tools = actual detected latest installed version
      # NDK = actual detected NDK path
      # ============================================================

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "STARTING FINAL APK BUILD"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print


      # ============================================================
      # 15. UPLOAD INITIALIZATION LOG
      # ============================================================

      - name: Upload Buildozer initialization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-initialization-log
          path: ${{ env.PROJECT_DIR }}/buildozer-initialization.log
          if-no-files-found: ignore


      # ============================================================
      # 16. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
            ${{ env.PROJECT_DIR }}/*.apk
          if-no-files-found: error


      # ============================================================
      # 17. UPLOAD LOGS ON FAILURE
      # ============================================================

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            ${{ env.PROJECT_DIR }}/buildozer-initialization.log
            ${{ env.PROJECT_DIR }}/.buildozer
            /home/runner/.buildozer/android/platform
          if-no-files-found: ignore