name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"
  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 3. PYTHON 3.11
      #
      # IMPORTANT:
      # No requirements.txt / pyproject.toml installation here.
      # This prevents the previous setup-python error.
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: ""

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. INSTALL ANDROID SDK COMPONENTS
      # ============================================================
      - name: Install Android Build Tools 37 and NDK 28.2
        shell: bash
        run: |
          set -eux

          echo "================================================"
          echo "ANDROID SDK SETUP"
          echo "================================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "Installing required Android components..."

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "================================================"
          echo "VERIFY BUILD TOOLS"
          echo "================================================"

          test -d \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          test -x \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

          echo "Build Tools ${ANDROID_BUILD_TOOLS}: READY"

          echo "================================================"
          echo "VERIFY NDK"
          echo "================================================"

          test -d \
            "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "NDK ${ANDROID_NDK_VERSION}: READY"

          echo "================================================"
          echo "VERIFY ANDROID PLATFORM"
          echo "================================================"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          echo "Android API ${ANDROID_API}: READY"

          echo "================================================"
          echo "ANDROID SDK COMPONENTS READY"
          echo "================================================"

      # ============================================================
      # 6. FORCE ANDROID PATHS
      #
      # Everything points to the same SDK selected by Buildozer.
      # ============================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"

          echo "================================================"
          echo "ANDROID ENVIRONMENT CONFIGURED"
          echo "================================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK=$ANDROID_NDK"

      # ============================================================
      # 7. SYSTEM BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache

      # ============================================================
      # 8. PYTHON BUILD TOOLS
      # ============================================================
      - name: Install Python build tools
        shell: bash
        run: |
          set -eux

          python --version
          python -m pip --version

          python -m pip install --upgrade \
            "pip<27" \
            "setuptools<81" \
            "wheel"

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.34" \
            "python-for-android==2026.5.9"

      # ============================================================
      # 9. VERIFY BUILD ENVIRONMENT
      # ============================================================
      - name: Verify final build environment
        shell: bash
        run: |
          set -eux

          echo "================================================"
          echo "FINAL BUILD ENVIRONMENT"
          echo "================================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Python-for-Android:"
          p4a --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Build Tools:"
          test -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          echo "$ANDROID_BUILD_TOOLS INSTALLED"

          echo "NDK:"
          test -d "$ANDROID_NDK"
          echo "$ANDROID_NDK_VERSION INSTALLED"

          echo "AIDL:"
          command -v aidl
          aidl --version || true

          echo "AAPT2:"
          command -v aapt2
          aapt2 version || true

          echo "================================================"
          echo "ENVIRONMENT VERIFIED"
          echo "================================================"

      # ============================================================
      # 10. FIND PROJECT
      #
      # Finds the actual buildozer.spec instead of assuming
      # the repository root contains it.
      # ============================================================
      - name: Locate MoneyTracker project
        shell: bash
        run: |
          set -eux

          echo "================================================"
          echo "SEARCHING FOR BUILDOZER.SPEC"
          echo "================================================"

          SPEC_FILE="$(find . \
            -type f \
            -name "buildozer.spec" \
            -not -path "./.git/*" \
            | head -n 1)"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found."
            echo
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort | head -500
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$GITHUB_WORKSPACE/${PROJECT_DIR#./}"
          fi

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/buildozer.spec"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SPEC_FILE=$PROJECT_DIR/buildozer.spec" >> "$GITHUB_ENV"

          echo "================================================"
          echo "PROJECT FOUND"
          echo "================================================"

          ls -lah "$PROJECT_DIR"

      # ============================================================
      # 11. VERIFY BUILD CONFIGURATION
      #
      # Does NOT change the user's project automatically.
      # It only displays important configuration.
      # ============================================================
      - name: Verify buildozer configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "================================================"
          echo "BUILDOZER.SPEC"
          echo "================================================"

          cat buildozer.spec

          echo "================================================"
          echo "ANDROID SETTINGS"
          echo "================================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.build_tools_version|p4a\.' \
            buildozer.spec \
            || true

          echo "================================================"
          echo "PROJECT PYTHON FILES"
          echo "================================================"

          find . \
            -maxdepth 3 \
            -type f \
            \( -name "*.py" -o -name "*.kv" -o -name "*.json" \) \
            | sort \
            | head -500

      # ============================================================
      # 12. CLEAN ONLY BUILD CACHE
      #
      # Does NOT delete source files.
      # ============================================================
      - name: Prepare clean Buildozer build
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer

          mkdir -p bin

          echo "Clean Buildozer cache prepared."

      # ============================================================
      # 13. BUILD APK
      #
      # THIS IS THE ACTUAL BUILD COMMAND.
      #
      # Buildozer uses the Android SDK path configured above.
      # ============================================================
      - name: Build APK with Buildozer
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "================================================"
          echo "STARTING APK BUILD"
          echo "================================================"

          echo "Project:"
          pwd

          echo "Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          echo "NDK:"
          echo "$ANDROID_NDK"

          echo "Android API:"
          echo "$ANDROID_API"

          echo "================================================"
          echo "BUILD COMMAND"
          echo "================================================"

          buildozer -v android debug

          echo "================================================"
          echo "APK BUILD FINISHED"
          echo "================================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # ============================================================
      # 14. SHOW APK
      # ============================================================
      - name: Verify APK output
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "================================================"
          echo "APK OUTPUT"
          echo "================================================"

          APK_COUNT="$(find . -type f -name "*.apk" | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            echo
            echo "bin directory:"
            ls -lah bin || true
            exit 1
          fi

          find . \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo "APK_COUNT=$APK_COUNT"

      # ============================================================
      # 15. UPLOAD APK AS GITHUB ARTIFACT
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 16. FINAL STATUS
      # ============================================================
      - name: Build completed
        shell: bash
        run: |
          echo "================================================"
          echo "MONEYTRACKER APK BUILD SUCCESSFUL"
          echo "================================================"
          echo
          echo "APK has been uploaded as:"
          echo
          echo "MoneyTracker-APK"
          echo
          echo "Open the Actions run and download the artifact."
          echo "================================================"
