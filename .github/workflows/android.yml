name: MoneyTracker Android Environment Setup

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"

  # Requested Build Tools version
  ANDROID_BUILD_TOOLS: "37.0.0"

  # NDK used by this workflow
  ANDROID_NDK_VERSION: "28.2.13676358"

  # GitHub Actions Android SDK path
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  ANDROIDSDK: "/usr/local/lib/android/sdk"

  BUILDOZER_WARN_ON_ROOT: "0"

  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"


jobs:

  prepare-android-environment:

    name: Prepare Android Build Environment

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. SETUP PYTHON 3.11
      #
      # IMPORTANT:
      # NO cache: pip
      #
      # This prevents the previous:
      #
      # "No file ... requirements.txt or pyproject.toml"
      #
      # error.
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. VERIFY BASIC ENVIRONMENT
      # ============================================================

      - name: Verify Java and Python
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"


      # ============================================================
      # 5. INSTALL SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            libsqlite3-dev


      # ============================================================
      # 6. VERIFY ANDROID SDK COMMAND LINE TOOLS
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 7. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          echo "Android SDK licenses processed."


      # ============================================================
      # 8. INSTALL ANDROID PLATFORM 33
      # ============================================================

      - name: Install Android Platform 33
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33"


      # ============================================================
      # 9. INSTALL BUILD TOOLS 37.0.0
      #
      # THIS IS THE REQUESTED VERSION.
      #
      # Build Tools 37 is intentionally installed here.
      # ============================================================

      - name: Install Android Build Tools 37.0.0
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Installing:"
          echo "build-tools;37.0.0"

          "$SDKMANAGER" \
            "build-tools;37.0.0"

          test -d \
            "$ANDROID_HOME/build-tools/37.0.0"

          echo "========================================"
          echo "BUILD TOOLS 37.0.0 VERIFIED"
          echo "========================================"

          ls -lah \
            "$ANDROID_HOME/build-tools/37.0.0"


      # ============================================================
      # 10. INSTALL NDK 28.2.13676358
      # ============================================================

      - name: Install Android NDK 28.2.13676358
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "ndk;28.2.13676358"

          test -d \
            "$ANDROID_HOME/ndk/28.2.13676358"

          echo "========================================"
          echo "NDK VERIFIED"
          echo "========================================"

          ls -lah \
            "$ANDROID_HOME/ndk/28.2.13676358"


      # ============================================================
      # 11. EXPORT ANDROID PATHS
      #
      # Buildozer will use this SAME Android SDK.
      # ============================================================

      - name: Configure Android environment paths
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROIDSDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 12. INSTALL BUILDOZER
      #
      # No APK build is executed.
      # ============================================================

      - name: Install Buildozer and Python for Android
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "python-for-android"


      # ============================================================
      # 13. VERIFY BUILDOZER / P4A
      # ============================================================

      - name: Verify Buildozer and Python for Android
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "BUILDOZER LOCATION"
          echo "========================================"

          command -v buildozer

          python - <<'PY'
          import buildozer
          print("Buildozer module:")
          print(buildozer.__file__)
          PY

          echo "========================================"
          echo "PYTHON-FOR-ANDROID"
          echo "========================================"

          python -m pip show python-for-android

          echo "========================================"
          echo "P4A COMMAND"
          echo "========================================"

          command -v p4a
          p4a --version


      # ============================================================
      # 14. VERIFY BUILDOZER PROJECT
      # ============================================================

      - name: Verify Buildozer project
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "WORKSPACE"
          echo "========================================"

          pwd

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          find . \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          if [ -f "buildozer.spec" ]; then
            echo "buildozer.spec FOUND"

            grep -n -E \
              '^(title|package\.name|package\.domain|source\.dir|requirements|orientation|android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version)' \
              buildozer.spec \
              || true
          else
            echo "WARNING: buildozer.spec not found in repository root."
          fi


      # ============================================================
      # 15. FORCE BUILDOZER TO USE GITHUB ACTIONS SDK
      #
      # IMPORTANT:
      #
      # We DO NOT allow Buildozer to use a different SDK location.
      #
      # The environment points to:
      #
      # /usr/local/lib/android/sdk
      #
      # ============================================================

      - name: Verify Buildozer Android SDK connection
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER ANDROID SDK CONNECTION"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          test -d "$ANDROID_HOME"

          test -d \
            "$ANDROID_HOME/build-tools/37.0.0"

          test -d \
            "$ANDROID_HOME/ndk/28.2.13676358"

          test -x \
            "$ANDROID_HOME/platform-tools/adb"

          echo "========================================"
          echo "ANDROID SDK CONNECTION OK"
          echo "========================================"


      # ============================================================
      # 16. VERIFY BUILD TOOLS 37
      # ============================================================

      - name: Verify Build Tools 37
        shell: bash
        run: |
          set -eux

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/37.0.0"

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"

          test -d "$BUILD_TOOLS_DIR"

          echo "========================================"
          echo "BUILD TOOLS 37 CONTENT"
          echo "========================================"

          find "$BUILD_TOOLS_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo "========================================"
          echo "AIDL"
          echo "========================================"

          if [ -x "$BUILD_TOOLS_DIR/aidl" ]; then
            "$BUILD_TOOLS_DIR/aidl" --version || true
          else
            echo "AIDL executable not found."
          fi


      # ============================================================
      # 17. VERIFY LICENSES
      # ============================================================

      - name: Verify Android licenses
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "ANDROID LICENSE STATUS"
          echo "========================================"

          "$SDKMANAGER" --licenses </dev/null || true

          echo "========================================"
          echo "LICENSE DIRECTORY"
          echo "========================================"

          if [ -d "$ANDROID_HOME/licenses" ]; then
            find "$ANDROID_HOME/licenses" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          else
            echo "License directory not found."
          fi


      # ============================================================
      # 18. FINAL ENVIRONMENT REPORT
      #
      # IMPORTANT:
      # NO BUILDOZER BUILD COMMAND HERE.
      #
      # There is intentionally NO:
      #
      # buildozer android debug
      # buildozer android release
      # buildozer -v android debug
      #
      # ============================================================

      - name: Final environment report - NO APK BUILD
        shell: bash
        run: |
          set -eux

          echo ""
          echo "================================================"
          echo "FINAL ANDROID ENVIRONMENT"
          echo "================================================"

          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "P4A:"
          p4a --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "BUILD TOOLS:"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          echo "37.0.0 INSTALLED"

          echo ""
          echo "NDK:"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "28.2.13676358 INSTALLED"

          echo ""
          echo "================================================"
          echo "ENVIRONMENT SETUP COMPLETE"
          echo "================================================"

          echo "Build Tools 37.0.0: READY"
          echo "NDK 28.2.13676358: READY"
          echo "Android SDK: READY"
          echo "Android licenses: PROCESSED"
          echo "Buildozer: READY"
          echo "Python-for-Android: READY"

          echo ""
          echo "================================================"
          echo "APK BUILD WAS NOT STARTED"
          echo "APK BUILD COMMAND IS INTENTIONALLY ABSENT"
          echo "================================================"
