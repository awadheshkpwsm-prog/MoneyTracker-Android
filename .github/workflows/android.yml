name: Build Money Tracker Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      # ======================================================
      # EXACT ANDROID TOOLCHAIN
      # ======================================================
      ANDROID_API: "33"
      ANDROID_MIN_API: "21"
      ANDROID_BUILD_TOOLS: "33.0.2"
      ANDROID_NDK_VERSION: "28.2.13676358"

      # ======================================================
      # BUILD SETTINGS
      # ======================================================
      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. PYTHON 3.11
      # ======================================================
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: ""

      # ======================================================
      # 3. JAVA 17
      # ======================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ======================================================
      # 4. INSTALL SYSTEM PACKAGES
      # ======================================================
      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            libsqlite3-dev

      # ======================================================
      # 5. VERIFY PYTHON / JAVA
      # ======================================================
      - name: Verify build environment
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"
          python --version
          python3 --version
          which python
          which python3

          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo "========================================"
          echo "ANDROID VARIABLES"
          echo "========================================"
          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"

      # ======================================================
      # 6. INSTALL PYTHON BUILD TOOLS
      # ======================================================
      - name: Install Buildozer and Python build dependencies
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<26" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.34" \
            "sh"

      # ======================================================
      # 7. VERIFY BUILDOZER
      # ======================================================
      - name: Verify Buildozer
        run: |
          set -eux

          buildozer --version

          python -c "import Cython; print('Cython:', Cython.__version__)"

          python -c "import buildozer; print('Buildozer:', buildozer.__version__)"

      # ======================================================
      # 8. INSTALL ANDROID SDK
      #
      # IMPORTANT:
      # ONLY API 33 + BUILD TOOLS 33.0.2
      #
      # NO BUILD-TOOLS 37
      # ======================================================
      - name: Install exact Android SDK
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      # ======================================================
      # 9. VERIFY EXACT BUILD TOOLS
      # ======================================================
      - name: Verify Android SDK
        run: |
          set -eux

          echo "========================================"
          echo "INSTALLED ANDROID SDK"
          echo "========================================"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed || true

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          ls -lah "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/build-tools/33.0.2"

          echo "========================================"
          echo "AIDL"
          echo "========================================"

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          "$ANDROID_HOME/build-tools/33.0.2/aidl" --version

      # ======================================================
      # 10. INSTALL EXACT NDK 28c
      # ======================================================
      - name: Install Android NDK 28c
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "ndk;28.2.13676358"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "NDK installed:"
          ls -lah "$ANDROID_HOME/ndk/28.2.13676358"

      # ======================================================
      # 11. SET NDK ENVIRONMENT
      # ======================================================
      - name: Configure Android NDK
        run: |
          set -eux

          NDK_PATH="$ANDROID_HOME/ndk/28.2.13676358"

          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "$NDK_PATH" >> "$GITHUB_PATH"

      # ======================================================
      # 12. VERIFY BUILDOZER SPEC
      # ======================================================
      - name: Verify buildozer.spec
        run: |
          set -eux

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOVER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "CHECK TOOLCHAIN SETTINGS"
          echo "========================================"

          grep -E \
            'android.api|android.minapi|android.ndk|android.build_tools_version|android.archs|requirements' \
            buildozer.spec

          echo "========================================"
          echo "ENSURE NO BUILD-TOOLS 37"
          echo "========================================"

          if grep -R "37\.0\.0\|build-tools;37" buildozer.spec .github/workflows; then
            echo "ERROR: Build-Tools 37 reference found."
            exit 1
          fi

      # ======================================================
      # 13. CLEAN OLD BUILDOZER CACHE
      #
      # Prevents old SDK / NDK / p4a state from previous
      # failed builds from interfering.
      # ======================================================
      - name: Clean Buildozer state
        run: |
          set -eux

          rm -rf .buildozer

          mkdir -p .buildozer

      # ======================================================
      # 14. BUILD APK
      # ======================================================
      - name: Build Android APK
        run: |
          set -eux

          export BUILDOZER_WARN_ON_ROOT=0

          buildozer -v android debug

      # ======================================================
      # 15. FIND APK
      # ======================================================
      - name: Find APK
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "APK SEARCH"
          echo "========================================"

          pwd

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print

          echo ""
          echo "AAB files:"
          find . -type f -name "*.aab" -print

          echo ""
          echo "Bin directory:"
          ls -lah bin 2>/dev/null || true

          echo ""
          echo "Buildozer directory:"
          ls -lah .buildozer 2>/dev/null || true

      # ======================================================
      # 16. UPLOAD APK
      # ======================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error

      # ======================================================
      # 17. UPLOAD BUILD LOGS IF BUILD FAILS
      # ======================================================
      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/
          if-no-files-found: warn
