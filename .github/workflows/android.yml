name: MoneyTracker Android Full Diagnostic and Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:

  build-android:

    name: MoneyTracker Android Build

    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive

      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"
      BUILDOZER_VERSION: "1.6.0"
      CYTHON_VERSION: "0.29.34"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      MAVEN_ARGS: "-ntp"


    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 02 - RUNNER INFORMATION
      # ============================================================

      - name: 02 - Runner system diagnostic
        run: |
          set -o pipefail

          echo "========================================"
          echo "RUNNER INFORMATION"
          echo "========================================"

          echo "PWD:"
          pwd

          echo
          echo "GITHUB_WORKSPACE:"
          echo "$GITHUB_WORKSPACE"

          echo
          echo "HOME:"
          echo "$HOME"

          echo
          echo "USER:"
          whoami

          echo
          echo "OS:"
          cat /etc/os-release || true

          echo
          echo "KERNEL:"
          uname -a

          echo
          echo "CPU:"
          nproc || true

          echo
          echo "MEMORY:"
          free -h || true

          echo
          echo "DISK:"
          df -h || true


      # ============================================================
      # 03 - FIND BUILDOZER SPEC
      # ============================================================

      - name: 03 - Detect buildozer project
        run: |
          set -euxo pipefail

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -name "buildozer.spec" \
              -type f \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$SPEC_FILE"
          test -d "$PROJECT_DIR"

          echo "SPEC_FILE=$SPEC_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 04 - PROJECT STRUCTURE
      # ============================================================

      - name: 04 - Repository structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"

          pwd

          echo
          ls -lah

          echo
          echo "========================================"
          echo "PROJECT TREE"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -print \
            | sort \
            | head -3000


      # ============================================================
      # 05 - JAVA 17
      # ============================================================

      - name: 05 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 06 - JAVA CHECK
      # ============================================================

      - name: 06 - Java diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "JAVA:"
          command -v java

          echo
          echo "JAVAC:"
          command -v javac

          javac -version

          test -n "$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"


      # ============================================================
      # 07 - PYTHON 3.11.13
      # ============================================================

      - name: 07 - Set up Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          check-latest: false


      # ============================================================
      # 08 - PYTHON CHECK
      # ============================================================

      - name: 08 - Python diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -V

          echo
          echo "PYTHON PATH:"
          command -v python

          echo
          echo "PYTHON EXECUTABLE:"
          python -c "import sys; print(sys.executable)"

          echo
          echo "PYTHON VERSION:"
          python -c "import sys; print(sys.version)"

          echo
          echo "PIP:"
          python -m pip --version

          python - <<'PY'
          import sys

          print("Version:", sys.version_info[:3])

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  "ERROR: Python 3.11 is required."
              )

          print("PASS: Python 3.11 detected.")
          PY


      # ============================================================
      # 09 - HOST DEPENDENCIES
      #
      # IMPORTANT:
      # Do not add libtinfo5.
      #
      # Ubuntu 24.04 runner does not provide libtinfo5.
      # This is intentionally left out.
      # ============================================================

      - name: 09 - Install Linux host dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            gcc \
            g++ \
            make \
            cmake \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zip \
            unzip \
            patch \
            file \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libltdl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            liblzma-dev


      # ============================================================
      # 10 - HOST TOOL CHECK
      # ============================================================

      - name: 10 - Host tools diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "HOST TOOL CHECK"
          echo "========================================"

          TOOLS=(
            git
            gcc
            g++
            make
            cmake
            autoconf
            automake
            libtool
            pkg-config
            zip
            unzip
            patch
            file
          )

          for TOOL in "${TOOLS[@]}"; do

            echo
            echo "----------------------------------------"
            echo "Checking: $TOOL"

            command -v "$TOOL"

            echo "PASS: $TOOL"

            "$TOOL" --version 2>&1 | head -n 2 || true

          done

          echo
          echo "HOST TOOLS: PASS"


      # ============================================================
      # 11 - INSTALL CYTHON + BUILDOZER
      # ============================================================

      - name: 11 - Install Buildozer and Cython
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}"

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}"

          echo
          echo "========================================"
          echo "INSTALLED PACKAGES"
          echo "========================================"

          python -m pip show Cython
          python -m pip show buildozer


      # ============================================================
      # 12 - BUILDOZER CHECK
      # ============================================================

      - name: 12 - Buildozer diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          command -v buildozer

          buildozer --version

          echo
          echo "========================================"
          echo "BUILDOZER HELP"
          echo "========================================"

          buildozer --help | head -100

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          command -v cython
          cython --version

          echo
          echo "========================================"
          echo "IMPORT CHECK"
          echo "========================================"

          python - <<'PY'
          import Cython
          import buildozer

          print("Cython:", Cython.__version__)
          print("Buildozer import: PASS")
          PY


      # ============================================================
      # 13 - READ BUILDOZER SPEC
      # ============================================================

      - name: 13 - Read buildozer.spec
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDOZER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo
          echo "========================================"
          echo "ANDROID SETTINGS FROM SPEC"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|requirements|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true


      # ============================================================
      # 14 - SOURCE VALIDATION
      # ============================================================

      - name: 14 - Validate source directory
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          SOURCE_DIR="$(
            grep -E '^[[:space:]]*source\.dir[[:space:]]*=' \
              buildozer.spec \
              | head -n 1 \
              | cut -d '=' -f2- \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          echo "source.dir=$SOURCE_DIR"

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: source.dir is empty."
            exit 1
          fi

          if [ "$SOURCE_DIR" = "." ]; then
            SOURCE_PATH="$PWD"
          else
            SOURCE_PATH="$PWD/$SOURCE_DIR"
          fi

          echo
          echo "SOURCE_PATH:"
          echo "$SOURCE_PATH"

          test -d "$SOURCE_PATH"

          echo "SOURCE_PATH=$SOURCE_PATH" >> "$GITHUB_ENV"

          echo
          echo "SOURCE CONTENTS:"

          find "$SOURCE_PATH" \
            -maxdepth 3 \
            -print \
            | sort \
            | head -2000


      # ============================================================
      # 15 - MAIN.PY CHECK
      # ============================================================

      - name: 15 - Validate main.py
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          if [ ! -f "$SOURCE_PATH/main.py" ]; then
            echo "ERROR: main.py not found:"
            echo "$SOURCE_PATH/main.py"
            exit 1
          fi

          echo "PASS: main.py found"
          echo "$SOURCE_PATH/main.py"

          python -m py_compile "$SOURCE_PATH/main.py"


      # ============================================================
      # 16 - PYTHON SYNTAX CHECK
      # ============================================================

      - name: 16 - Python syntax check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' FILE_PATH; do

            COUNT=$((COUNT + 1))

            echo "Checking:"
            echo "$FILE_PATH"

            if python -m py_compile "$FILE_PATH"; then
              echo "PASS"
            else
              echo "FAIL"
              FAILED=1
            fi

          done < <(
            find "$SOURCE_PATH" \
              -type f \
              -name "*.py" \
              -print0
          )

          echo
          echo "Python files checked: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No Python files found."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Python syntax check failed."
            exit 1
          fi

          echo "PASS: Python syntax check"


      # ============================================================
      # 17 - JSON CHECK
      # ============================================================

      - name: 17 - JSON validation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' FILE_PATH; do

            COUNT=$((COUNT + 1))

            echo "Checking:"
            echo "$FILE_PATH"

            if python -m json.tool "$FILE_PATH" >/dev/null; then
              echo "PASS"
            else
              echo "FAIL: Invalid JSON"
              FAILED=1
            fi

          done < <(
            find "$SOURCE_PATH" \
              -type f \
              -name "*.json" \
              -print0
          )

          echo
          echo "JSON files checked: $COUNT"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "PASS: JSON validation"


      # ============================================================
      # 18 - EXISTING ANDROID SDK DISCOVERY
      # ============================================================

      - name: 18 - Discover existing Android SDK
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID SDK DISCOVERY"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-NOT SET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-NOT SET}"

          SDK=""

          CANDIDATES=(
            "${ANDROID_SDK_ROOT:-}"
            "${ANDROID_HOME:-}"
            "/usr/local/lib/android/sdk"
            "$HOME/Android/Sdk"
            "$HOME/.buildozer/android/platform/android-sdk"
          )

          for CANDIDATE in "${CANDIDATES[@]}"; do

            if [ -z "$CANDIDATE" ]; then
              continue
            fi

            if [ -d "$CANDIDATE" ]; then

              echo
              echo "Candidate:"
              echo "$CANDIDATE"

              if [ -d "$CANDIDATE/platform-tools" ]; then

                SDK="$CANDIDATE"

                echo "SDK candidate accepted."

                break

              fi

            fi

          done

          if [ -z "$SDK" ]; then

            echo
            echo "No existing SDK detected before Buildozer."

            echo "ANDROID_SDK_FOUND=false" >> "$GITHUB_ENV"

          else

            echo
            echo "Existing SDK detected:"
            echo "$SDK"

            echo "ANDROID_SDK_FOUND=true" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_REAL=$SDK" >> "$GITHUB_ENV"

          fi


      # ============================================================
      # 19 - ANDROID RUNNER SDK
      # ============================================================

      - name: 19 - Detect Android Build Tools
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID BUILD TOOLS"
          echo "========================================"

          SDK="${ANDROID_SDK_REAL:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "SDK not available at:"
            echo "$SDK"

            echo "ANDROID_BUILD_TOOLS_FOUND=false" >> "$GITHUB_ENV"

            exit 0
          fi

          if [ ! -d "$SDK/build-tools" ]; then
            echo "build-tools directory not found."

            echo "ANDROID_BUILD_TOOLS_FOUND=false" >> "$GITHUB_ENV"

            exit 0
          fi

          BUILD_TOOLS_VERSION="$(
            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "No Build Tools found."

            echo "ANDROID_BUILD_TOOLS_FOUND=false" >> "$GITHUB_ENV"

            exit 0
          fi

          BUILD_TOOLS_DIR="$SDK/build-tools/$BUILD_TOOLS_VERSION"

          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"

          test -d "$BUILD_TOOLS_DIR"

          echo "ANDROID_BUILD_TOOLS_FOUND=true" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_REAL=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"


      # ============================================================
      # 20 - INSTALL / ACCEPT ANDROID COMPONENTS
      # ============================================================

      - name: 20 - Prepare Android SDK Build Tools 37
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_REAL:-/usr/local/lib/android/sdk}"

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "SDK:"
          echo "$SDK"

          test -d "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null \
              | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "========================================"
          echo "INSTALLING BUILD TOOLS 37"
          echo "========================================"

          "$SDKMANAGER" \
            "build-tools;37.0.0"

          echo
          echo "Build Tools directories:"

          find "$SDK/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort -V


      # ============================================================
      # 21 - VERIFY BUILD TOOLS 37
      # ============================================================

      - name: 21 - Verify Build Tools 37
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_REAL:-/usr/local/lib/android/sdk}"

          BUILD_TOOLS_DIR="$SDK/build-tools/37.0.0"

          echo "========================================"
          echo "BUILD TOOLS 37 CHECK"
          echo "========================================"

          echo "PATH:"
          echo "$BUILD_TOOLS_DIR"

          test -d "$BUILD_TOOLS_DIR"

          echo
          echo "FILES:"
          ls -lah "$BUILD_TOOLS_DIR"

          if [ -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            echo
            echo "AAPT2:"
            "$BUILD_TOOLS_DIR/aapt2" version || true
          fi

          echo
          echo "PASS: Build Tools 37.0.0 available."

          echo "ANDROID_BUILD_TOOLS_REAL=37.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 22 - ANDROID PLATFORM DETECTION
      # ============================================================

      - name: 22 - Android platform diagnostic
        run: |
          set -o pipefail

          SDK="${ANDROID_SDK_REAL:-/usr/local/lib/android/sdk}"

          echo "========================================"
          echo "ANDROID PLATFORMS"
          echo "========================================"

          if [ -d "$SDK/platforms" ]; then

            find "$SDK/platforms" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V

          else

            echo "platforms directory missing."

          fi


      # ============================================================
      # 23 - BUILDOZER DIRECTORY
      # ============================================================

      - name: 23 - Inspect Buildozer directory
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDOZER DIRECTORY"
          echo "========================================"

          if [ -d "$HOME/.buildozer" ]; then

            find "$HOME/.buildozer" \
              -maxdepth 5 \
              -print \
              | sort \
              | head -5000

          else

            echo "No .buildozer directory yet."

          fi


      # ============================================================
      # 24 - CLEAN STALE P4A BUILD VENV
      # ============================================================

      - name: 24 - Clean stale python-for-android build environments
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "CLEANING STALE P4A BUILD ENVIRONMENTS"
          echo "========================================"

          if [ -d ".buildozer/android/platform" ]; then

            echo "Existing generated build/venv directories:"

            find ".buildozer/android/platform" \
              -type d \
              -path "*/build/venv" \
              -print \
              || true

            echo
            echo "Removing stale build/venv directories..."

            find ".buildozer/android/platform" \
              -type d \
              -path "*/build/venv" \
              -prune \
              -exec rm -rf {} +

          else

            echo "No existing Buildozer Android platform directory."

          fi

          echo
          echo "Cleanup completed."


      # ============================================================
      # 25 - FORCE CLEAN GENERATED P4A BUILD CACHE
      # ============================================================

      - name: 25 - Clean generated Buildozer build cache
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER BUILD CACHE CLEANUP"
          echo "========================================"

          if [ -d ".buildozer/android/platform" ]; then

            find ".buildozer/android/platform" \
              -maxdepth 2 \
              -type d \
              \( \
                -name "build-arm64-v8a_armeabi-v7a" \
                -o \
                -name "build-arm64-v8a" \
                -o \
                -name "dist" \
              \) \
              -print \
              || true

          fi

          echo
          echo "NOTE:"
          echo "Only generated build directories will be removed."

          rm -rf \
            .buildozer/android/platform/build-arm64-v8a_armeabi-v7a \
            .buildozer/android/platform/build-arm64-v8a \
            .buildozer/android/platform/build-armeabi-v7a \
            .buildozer/android/platform/dist

          echo
          echo "Generated Buildozer build directories cleaned."


      # ============================================================
      # 26 - BOOTSTRAP BUILDOZER ANDROID PLATFORM
      # ============================================================

      - name: 26 - Bootstrap Buildozer Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER ANDROID PLATFORM PREPARATION"
          echo "========================================"

          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project:"
          pwd

          echo
          echo "Starting:"
          echo "buildozer -v android update"

          buildozer -v android update


      # ============================================================
      # 27 - DETECT SDK CREATED/USED BY BUILDOZER
      # ============================================================

      - name: 27 - Detect Buildozer Android SDK
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER SDK DETECTION"
          echo "========================================"

          SDK=""

          CANDIDATES=(
            "${ANDROID_SDK_REAL:-}"
            "$HOME/.buildozer/android/platform/android-sdk"
            "${ANDROID_HOME:-}"
            "/usr/local/lib/android/sdk"
          )

          for CANDIDATE in "${CANDIDATES[@]}"; do

            if [ -n "$CANDIDATE" ] \
              && [ -d "$CANDIDATE" ]; then

              echo
              echo "Checking:"
              echo "$CANDIDATE"

              if [ -d "$CANDIDATE/build-tools" ] \
                && [ -d "$CANDIDATE/platform-tools" ]; then

                SDK="$CANDIDATE"

                echo "SDK accepted."

                break

              fi

            fi

          done

          if [ -z "$SDK" ]; then
            echo "ERROR: Could not detect usable Android SDK."
            exit 1
          fi

          echo
          echo "FINAL SDK:"
          echo "$SDK"

          test -d "$SDK"
          test -d "$SDK/build-tools"
          test -d "$SDK/platform-tools"

          echo "ANDROID_SDK_REAL=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"


      # ============================================================
      # 28 - DETECT LATEST BUILD TOOLS
      # ============================================================

      - name: 28 - Detect latest Build Tools
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "LATEST BUILD TOOLS"
          echo "========================================"

          BUILD_TOOLS_VERSION="$(
            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: No Build Tools detected."
            exit 1
          fi

          BUILD_TOOLS_DIR="$SDK/build-tools/$BUILD_TOOLS_VERSION"

          echo "VERSION:"
          echo "$BUILD_TOOLS_VERSION"

          echo
          echo "PATH:"
          echo "$BUILD_TOOLS_DIR"

          test -d "$BUILD_TOOLS_DIR"

          echo "ANDROID_BUILD_TOOLS_REAL=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 29 - DETECT NDK
      # ============================================================

      - name: 29 - Detect Android NDK
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID NDK DETECTION"
          echo "========================================"

          SDK="$ANDROID_SDK_REAL"

          NDK_DIR=""

          SEARCH_ROOTS=(
            "$SDK/ndk"
            "$HOME/.buildozer/android/platform"
            "$HOME/.buildozer"
            "$SDK"
          )

          for ROOT in "${SEARCH_ROOTS[@]}"; do

            if [ ! -d "$ROOT" ]; then
              continue
            fi

            echo
            echo "Searching:"
            echo "$ROOT"

            CANDIDATE="$(
              find "$ROOT" \
                -type f \
                -name "source.properties" \
                -path "*/ndk/*" \
                2>/dev/null \
                | sed 's#/source.properties##' \
                | sort -V \
                | tail -n 1 \
                || true
            )"

            if [ -n "$CANDIDATE" ] \
              && [ -d "$CANDIDATE" ]; then

              NDK_DIR="$CANDIDATE"

              echo "NDK candidate found:"
              echo "$NDK_DIR"

              break

            fi

          done

          if [ -z "$NDK_DIR" ]; then

            echo
            echo "ERROR: Android NDK was not detected."
            exit 1

          fi

          echo
          echo "========================================"
          echo "FINAL NDK"
          echo "========================================"

          echo "$NDK_DIR"

          test -d "$NDK_DIR"
          test -f "$NDK_DIR/source.properties"

          echo
          echo "NDK VERSION INFORMATION:"
          cat "$NDK_DIR/source.properties"

          echo
          echo "========================================"
          echo "SETTING NDK VARIABLES"
          echo "========================================"

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_REAL=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 30 - NDK PATH VALIDATION
      # ============================================================

      - name: 30 - Validate final Android NDK path
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FINAL NDK PATH VALIDATION"
          echo "========================================"

          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "ANDROID_NDK_ROOT:"
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "ANDROIDNDK:"
          echo "$ANDROIDNDK"

          test -d "$ANDROID_NDK"
          test -d "$ANDROID_NDK_ROOT"
          test -d "$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK/source.properties"

          echo
          echo "PASS: All NDK variables point to a valid NDK."


      # ============================================================
      # 31 - ANDROID ENVIRONMENT EXPORT
      # ============================================================

      - name: 31 - Configure final Android environment
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "FINAL ANDROID ENVIRONMENT"
          echo "========================================"

          echo "SDK:"
          echo "$SDK"

          echo "Build Tools:"
          echo "$ANDROID_BUILD_TOOLS_DIR"

          echo "NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "Adding Android tools to PATH."

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          fi

          echo
          echo "PATH configured."


      # ============================================================
      # 32 - ANDROID COMMAND CHECK
      # ============================================================

      - name: 32 - Android command validation
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID COMMAND CHECK"
          echo "========================================"

          echo "ADB:"
          command -v adb || true

          if command -v adb >/dev/null 2>&1; then
            adb version || true
          fi

          echo
          echo "AAPT2:"
          command -v aapt2 || true

          if command -v aapt2 >/dev/null 2>&1; then
            aapt2 version || true
          fi

          echo
          echo "D8:"
          command -v d8 || true

          echo
          echo "ZIPALIGN:"
          command -v zipalign || true

          echo
          echo "NDK LLVM:"
          if [ -x "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -n 2
          else
            echo "WARNING: clang not found in expected NDK location."
          fi


      # ============================================================
      # 33 - FINAL SPEC / ENVIRONMENT COMPARISON
      # ============================================================

      - name: 33 - Final spec and environment comparison
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDOSER.SPEC"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|requirements|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true

          echo
          echo "========================================"
          echo "ACTUAL ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_SDK_REAL:"
          echo "$ANDROID_SDK_REAL"

          echo
          echo "ANDROID_BUILD_TOOLS_REAL:"
          echo "$ANDROID_BUILD_TOOLS_REAL"

          echo
          echo "ANDROID_BUILD_TOOLS_DIR:"
          echo "$ANDROID_BUILD_TOOLS_DIR"

          echo
          echo "ANDROID_NDK_REAL:"
          echo "$ANDROID_NDK_REAL"

          echo
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "ANDROID_NDK_ROOT:"
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "========================================"
          echo "IMPORTANT"
          echo "========================================"

          echo "Build Tools selected from detected SDK:"
          echo "$ANDROID_BUILD_TOOLS_REAL"

          echo
          echo "NDK selected from detected SDK/Buildozer:"
          echo "$ANDROID_NDK_REAL"


      # ============================================================
      # 34 - FINAL PRE-BUILD CHECK
      # ============================================================

      - name: 34 - Final pre-build validation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FINAL PRE-BUILD VALIDATION"
          echo "========================================"

          echo
          echo "PROJECT"
          test -f "$SPEC_FILE"
          test -d "$PROJECT_DIR"
          echo "PASS"

          echo
          echo "MAIN.PY"
          test -f "$SOURCE_PATH/main.py"
          echo "PASS"

          echo
          echo "PYTHON"
          python -c "import sys; assert sys.version_info[:2] == (3,11)"
          echo "PASS: Python 3.11"

          echo
          echo "JAVA"
          command -v java
          command -v javac
          echo "PASS"

          echo
          echo "BUILDOZER"
          command -v buildozer
          buildozer --version

          echo
          echo "CYTHON"
          python -c "import Cython; print(Cython.__version__)"

          echo
          echo "ANDROID SDK"
          test -d "$ANDROID_SDK_REAL"
          echo "PASS: $ANDROID_SDK_REAL"

          echo
          echo "BUILD TOOLS"
          test -d "$ANDROID_BUILD_TOOLS_DIR"
          echo "PASS: $ANDROID_BUILD_TOOLS_REAL"

          echo
          echo "NDK"
          test -d "$ANDROID_NDK"
          test -f "$ANDROID_NDK/source.properties"
          echo "PASS: $ANDROID_NDK"

          echo
          echo "========================================"
          echo "PRE-BUILD CHECK PASSED"
          echo "========================================"


      # ============================================================
      # 35 - PREPARE BUILDOZER BUILD
      # ============================================================

      - name: 35 - Prepare clean Buildozer build environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PREPARING CLEAN BUILDOZER BUILD"
          echo "========================================"

          find ".buildozer/android/platform" \
            -type d \
            -path "*/build/venv" \
            -prune \
            -exec rm -rf {} + \
            2>/dev/null \
            || true

          echo
          echo "Checking generated build environments:"

          find ".buildozer/android/platform" \
            -type d \
            -path "*/build/venv" \
            -print \
            2>/dev/null \
            || true

          echo
          echo "Clean Buildozer build environment prepared."


      # ============================================================
      # 35A - FIX P4A BUILD VENV / PIP
      #
      # THIS IS THE ONLY IMPORTANT NEW FIX.
      #
      # Observed failure:
      #
      # build/venv/lib/python3.14/site-packages/pip
      #
      # followed by:
      #
      # ImportError:
      # BuildDependencyInstallError
      #
      # python-for-android v2026.05.09 had a build/venv/pip
      # corruption issue.
      #
      # Upstream fix:
      # create the temporary venv with --clear and avoid the
      # problematic pip self-upgrade.
      #
      # Here we patch the downloaded p4a source directly so the
      # existing workflow does not need to be redesigned.
      # ============================================================

      - name: 35A - Patch python-for-android build venv handling
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PATCHING PYTHON-FOR-ANDROID VENV"
          echo "========================================"

          P4A_DIR="$PROJECT_DIR/.buildozer/android/platform/python-for-android"
          P4A_BUILD="$P4A_DIR/pythonforandroid/build.py"

          echo "P4A_DIR:"
          echo "$P4A_DIR"

          echo
          echo "P4A BUILD FILE:"
          echo "$P4A_BUILD"

          if [ ! -f "$P4A_BUILD" ]; then
            echo "ERROR: python-for-android build.py not found."
            exit 1
          fi

          echo
          echo "P4A VERSION / GIT:"
          if [ -d "$P4A_DIR/.git" ]; then
            git -C "$P4A_DIR" rev-parse --short HEAD || true
            git -C "$P4A_DIR" describe --tags --always || true
          fi

          echo
          echo "Checking current venv creation code..."

          grep -n -E \
            "host_python.*-m.*venv|pip install -U pip" \
            "$P4A_BUILD" \
            || true

          cp "$P4A_BUILD" "$P4A_BUILD.before-moneytracker-fix"

          python - "$P4A_BUILD" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          original = text

          # Fix 1:
          # Recreate p4a's temporary build venv cleanly.
          old_venv = "shprint(host_python, '-m', 'venv', 'venv')"
          new_venv = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"

          if old_venv in text:
              text = text.replace(old_venv, new_venv, 1)
              print("PATCH 1: venv --clear applied.")
          elif new_venv in text:
              print("PATCH 1: already applied.")
          else:
              print("PATCH 1: expected venv line not found.")
              raise SystemExit(2)

          # Fix 2:
          # Do not self-upgrade pip inside the generated p4a venv.
          #
          # The affected p4a code contains:
          #
          # source venv/bin/activate && pip install -U pip
          #
          # Replace only that exact command with a harmless version
          # check. No other pip command is changed.
          old_pip = "source venv/bin/activate && pip install -U pip"
          new_pip = "source venv/bin/activate && python -m pip --version"

          if old_pip in text:
              text = text.replace(old_pip, new_pip, 1)
              print("PATCH 2: pip self-upgrade disabled.")
          elif new_pip in text:
              print("PATCH 2: already applied.")
          else:
              print("PATCH 2: expected pip self-upgrade command not found.")
              raise SystemExit(3)

          if text == original:
              raise SystemExit("ERROR: p4a build.py was not changed.")

          path.write_text(text)

          print("P4A PATCH COMPLETE.")
          PY

          echo
          echo "========================================"
          echo "VERIFY P4A PATCH"
          echo "========================================"

          grep -n -E \
            "host_python.*-m.*venv|pip install -U pip|python -m pip --version" \
            "$P4A_BUILD" \
            || true

          echo
          echo "Checking that --clear exists:"

          grep -F -- "-m', 'venv', '--clear', 'venv'" \
            "$P4A_BUILD"

          echo
          echo "Checking that old pip self-upgrade is gone:"

          if grep -Fq "source venv/bin/activate && pip install -U pip" "$P4A_BUILD"; then
            echo "ERROR: old pip self-upgrade command still exists."
            exit 1
          fi

          echo "PASS: old pip self-upgrade command removed."

          echo
          echo "P4A VENV/PIP PATCH: PASS"


      # ============================================================
      # 35B - REMOVE ANY VENV CREATED BEFORE PATCH
      #
      # This is intentionally separate from 35A.
      # It guarantees the patched p4a code creates the venv fresh.
      # ============================================================

      - name: 35B - Remove generated p4a venv after patch
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FINAL P4A VENV CLEANUP"
          echo "========================================"

          find ".buildozer/android/platform" \
            -type d \
            -path "*/build/venv" \
            -print \
            2>/dev/null \
            || true

          find ".buildozer/android/platform" \
            -type d \
            -path "*/build/venv" \
            -prune \
            -exec rm -rf {} + \
            2>/dev/null \
            || true

          echo
          echo "Remaining p4a build/venv directories:"

          find ".buildozer/android/platform" \
            -type d \
            -path "*/build/venv" \
            -print \
            2>/dev/null \
            || true

          echo
          echo "PASS: generated p4a venv removed."


      # ============================================================
      # 36 - FINAL ANDROID BUILD
      # ============================================================

      - name: 36 - Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "MONEYTRACKER ANDROID BUILD"
          echo "========================================"

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "SDK:"
          echo "$ANDROID_SDK_REAL"

          echo
          echo "Build Tools:"
          echo "$ANDROID_BUILD_TOOLS_REAL"

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_REAL"

          echo
          echo "========================================"
          echo "STARTING APK BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # 37 - FIND APK / AAB
      # ============================================================

      - name: 37 - Locate generated Android packages
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e

          echo "========================================"
          echo "GENERATED ANDROID FILES"
          echo "========================================"

          echo
          echo "APK FILES:"

          find "$PROJECT_DIR/bin" \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print \
            2>/dev/null \
            || true

          echo
          echo "ALL BIN FILES:"

          find "$PROJECT_DIR/bin" \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true


      # ============================================================
      # 38 - UPLOAD APK
      # ============================================================

      - name: 38 - Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Android-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error


      # ============================================================
      # 39 - BUILD DIAGNOSTIC ON FAILURE
      # ============================================================

      - name: 39 - Collect Buildozer failure diagnostics
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e

          mkdir -p diagnostic-report

          echo "========================================"
          echo "MONEYTRACKER BUILD FAILURE DIAGNOSTIC"
          echo "========================================"

          echo
          echo "DATE:"
          date

          echo
          echo "PROJECT:"
          pwd

          echo
          echo "PYTHON:"
          python --version 2>&1

          echo
          echo "PYTHON PATH:"
          command -v python 2>&1

          echo
          echo "JAVA:"
          java -version 2>&1

          echo
          echo "BUILDOZER:"
          buildozer --version 2>&1

          echo
          echo "CYTHON:"
          cython --version 2>&1

          echo
          echo "ANDROID SDK:"
          echo "${ANDROID_SDK_REAL:-NOT SET}"

          echo
          echo "BUILD TOOLS:"
          echo "${ANDROID_BUILD_TOOLS_REAL:-NOT SET}"

          echo
          echo "BUILD TOOLS PATH:"
          echo "${ANDROID_BUILD_TOOLS_DIR:-NOT SET}"

          echo
          echo "ANDROID NDK:"
          echo "${ANDROID_NDK_REAL:-NOT SET}"

          echo
          echo "ANDROID_NDK:"
          echo "${ANDROID_NDK:-NOT SET}"

          echo
          echo "ANDROID NDK SOURCE.PROPERTIES:"

          if [ -n "${ANDROID_NDK_REAL:-}" ] \
            && [ -f "$ANDROID_NDK_REAL/source.properties" ]; then

            cat "$ANDROID_NDK_REAL/source.properties"

          fi

          echo
          echo "========================================"
          echo "P4A VENV DIAGNOSTIC"
          echo "========================================"

          find "$PROJECT_DIR/.buildozer/android/platform" \
            -type d \
            -path "*/build/venv" \
            -print \
            2>/dev/null \
            | sort

          echo
          echo "P4A VENV PYTHON FILES:"

          find "$PROJECT_DIR/.buildozer/android/platform" \
            -type f \
            -path "*/build/venv/bin/python*" \
            -print \
            2>/dev/null \
            | sort

          echo
          echo "P4A VENV PIP FILES:"

          find "$PROJECT_DIR/.buildozer/android/platform" \
            -type f \
            -path "*/build/venv/bin/pip*" \
            -print \
            2>/dev/null \
            | sort

          echo
          echo "========================================"
          echo "BUILDOZER DIRECTORY TREE"
          echo "========================================"

          find "$PROJECT_DIR/.buildozer" \
            -maxdepth 6 \
            -print \
            2>/dev/null \
            | sort \
            | head -10000

          echo
          echo "========================================"
          echo "BUILD VENV PYTHON DIRECTORIES"
          echo "========================================"

          find "$PROJECT_DIR/.buildozer" \
            -type d \
            -path "*/build/venv/lib/python*" \
            -print \
            2>/dev/null \
            | sort

          echo
          echo "========================================"
          echo "DISK"
          echo "========================================"

          df -h

          echo
          echo "========================================"
          echo "BUILD LOG FILES"
          echo "========================================"

          find "$PROJECT_DIR/.buildozer" \
            -type f \
            \( \
              -name "*.log" \
              -o \
              -name "*.txt" \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | tail -1000

          {
            echo "MoneyTracker Build Failure Diagnostic"
            echo
            echo "Python:"
            python --version 2>&1
            echo
            echo "Buildozer:"
            buildozer --version 2>&1
            echo
            echo "Cython:"
            cython --version 2>&1
            echo
            echo "SDK:"
            echo "${ANDROID_SDK_REAL:-NOT SET}"
            echo
            echo "Build Tools:"
            echo "${ANDROID_BUILD_TOOLS_REAL:-NOT SET}"
            echo
            echo "NDK:"
            echo "${ANDROID_NDK_REAL:-NOT SET}"
            echo
            echo "NDK source.properties:"
            if [ -f "${ANDROID_NDK_REAL:-}/source.properties" ]; then
              cat "$ANDROID_NDK_REAL/source.properties"
            fi
          } > diagnostic-report/build-summary.txt


      # ============================================================
      # 40 - UPLOAD FAILURE DIAGNOSTIC
      # ============================================================

      - name: 40 - Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Failure-Diagnostic
          path: |
            ${{ env.PROJECT_DIR }}/diagnostic-report
            ${{ env.PROJECT_DIR }}/.buildozer
          if-no-files-found: warn


      # ============================================================
      # 41 - FINAL RESULT
      # ============================================================

      - name: 41 - Final result
        if: always()
        run: |
          echo "========================================"
          echo "MONEYTRACKER WORKFLOW RESULT"
          echo "========================================"

          echo
          echo "Python:"
          python --version || true

          echo
          echo "Buildozer:"
          buildozer --version || true

          echo
          echo "Android SDK:"
          echo "${ANDROID_SDK_REAL:-NOT DETECTED}"

          echo
          echo "Build Tools:"
          echo "${ANDROID_BUILD_TOOLS_REAL:-NOT DETECTED}"

          echo
          echo "NDK:"
          echo "${ANDROID_NDK_REAL:-NOT DETECTED}"

          echo
          echo "APK SEARCH:"
          find "${PROJECT_DIR:-$GITHUB_WORKSPACE}/bin" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            2>/dev/null \
            || true

          echo
          echo "========================================"
          echo "WORKFLOW FINISHED"
          echo "========================================"