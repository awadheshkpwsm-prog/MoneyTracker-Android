name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: ""

      # ============================================================
      # 3. PYTHON 3.11.13
      # ============================================================
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: ""

      # ============================================================
      # 4. VERIFY PYTHON + JAVA
      # ============================================================
      - name: Verify Python and Java
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

      # ============================================================
      # 5. INSTALL LINUX DEPENDENCIES
      # ============================================================
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache

      # ============================================================
      # 6. INSTALL BUILDOZER + P4A
      # ============================================================
      - name: Install Buildozer and Python-for-Android
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<27" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==0.29.34" \
            "buildozer==1.6.0" \
            "python-for-android==2026.5.9"

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "P4A"
          echo "========================================"

          p4a --version

      # ============================================================
      # 7. LOCATE PROJECT
      # ============================================================
      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR BUILDOZER.SPEC"
          echo "========================================"

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."

            echo "Repository files:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/buildozer.spec"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT CONTENT"
          echo "========================================"

          ls -lah "$PROJECT_DIR"

      # ============================================================
      # 8. CLEAN ONLY OLD BUILDOZER SDK/CACHE
      #
      # IMPORTANT:
      # We do NOT connect Buildozer to /usr/local/lib/android/sdk.
      #
      # Buildozer gets its own DEFAULT SDK:
      #
      # ~/.buildozer/android/platform/android-sdk
      #
      # Then Buildozer itself installs Android components there.
      # ============================================================
      - name: Prepare Buildozer default Android SDK
        shell: bash
        run: |
          set -eux

          BUILDOZER_ANDROID_DIR="$HOME/.buildozer/android"
          BUILDOZER_PLATFORM_DIR="$BUILDOZER_ANDROID_DIR/platform"
          BUILDOZER_SDK_DIR="$BUILDOZER_PLATFORM_DIR/android-sdk"

          echo "========================================"
          echo "BUILDOZER DEFAULT SDK"
          echo "========================================"

          echo "BUILDOZER_ANDROID_DIR=$BUILDOZER_ANDROID_DIR"
          echo "BUILDOZER_PLATFORM_DIR=$BUILDOZER_PLATFORM_DIR"
          echo "BUILDOZER_SDK_DIR=$BUILDOZER_SDK_DIR"

          # Remove only previous Buildozer Android platform data.
          # Do not touch the project source.
          rm -rf "$BUILDOZER_SDK_DIR"

          mkdir -p "$BUILDOZER_PLATFORM_DIR"

          echo "Buildozer default SDK directory prepared."

          test -d "$BUILDOZER_PLATFORM_DIR"

      # ============================================================
      # 9. FORCE ENVIRONMENT TO BUILDOZER DEFAULT SDK PATH
      #
      # This is NOT a symlink.
      #
      # Buildozer remains the owner of this SDK.
      # ============================================================
      - name: Configure Buildozer SDK environment
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "CONFIGURING BUILDOZER DEFAULT SDK"
          echo "========================================"

          echo "ANDROID_HOME=$BUILDOZER_SDK_DIR"
          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK_DIR"
          echo "ANDROIDSDK=$BUILDOZER_SDK_DIR"

          echo "ANDROID_HOME=$BUILDOZER_SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$BUILDOZER_SDK_DIR" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$BUILDOZER_SDK_DIR/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$BUILDOZER_SDK_DIR/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$BUILDOZER_SDK_DIR/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "$BUILDOZER_SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$BUILDOZER_SDK_DIR/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo "Buildozer default SDK environment configured."

      # ============================================================
      # 10. SHOW BUILDOZER DEFAULT CONFIGURATION
      # ============================================================
      - name: Verify Buildozer default paths
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER DEFAULT PATHS"
          echo "========================================"

          echo "HOME=$HOME"

          echo "Buildozer Android directory:"
          echo "$HOME/.buildozer/android"

          echo "Buildozer platform directory:"
          echo "$HOME/.buildozer/android/platform"

          echo "Buildozer SDK:"
          echo "$HOME/.buildozer/android/platform/android-sdk"

          echo "Configured ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "Configured ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          test "$ANDROID_HOME" = \
            "$HOME/.buildozer/android/platform/android-sdk"

          test "$ANDROID_SDK_ROOT" = \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "PATH CONFIGURATION OK"
          echo "========================================"

      # ============================================================
      # 11. VERIFY PROJECT CONFIGURATION
      # ============================================================
      - name: Verify Buildozer configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          test -f buildozer.spec

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.' \
            buildozer.spec \
            || true

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          ls -lah

      # ============================================================
      # 12. LET BUILDOZER INITIALIZE ITS OWN SDK
      #
      # IMPORTANT:
      # No sdkmanager from /usr/local/lib/android/sdk.
      #
      # Buildozer is allowed to create and manage:
      #
      # ~/.buildozer/android/platform/android-sdk
      #
      # ============================================================
      - name: Initialize Buildozer Android platform
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER PLATFORM INITIALIZATION"
          echo "========================================"

          echo "Buildozer will use its default Android SDK:"
          echo "$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          # This command allows Buildozer to initialize/download
          # its Android platform and required SDK components.
          #
          # No external Android SDK is linked into Buildozer.
          buildozer android update

      # ============================================================
      # 13. VERIFY BUILDOZER INSTALLED BUILD TOOLS
      #
      # At this point Buildozer should have installed the
      # required Android SDK components into its OWN SDK.
      # ============================================================
      - name: Verify Buildozer SDK Build Tools 37
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          BUILD_TOOLS_DIR="$BUILDOZER_SDK_DIR/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "========================================"
          echo "BUILDOZER SDK"
          echo "========================================"

          echo "$BUILDOZER_SDK_DIR"

          echo "========================================"
          echo "BUILD TOOLS 37"
          echo "========================================"

          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "Build Tools 37.0.0 was not installed by Buildozer."

            echo "Available Build Tools:"

            if [ -d "$BUILDOZER_SDK_DIR/build-tools" ]; then
              find "$BUILDOZER_SDK_DIR/build-tools" \
                -maxdepth 1 \
                -mindepth 1 \
                -type d \
                -print \
                | sort
            else
              echo "Build-tools directory does not exist."
            fi

            exit 1
          fi

          test -x "$BUILD_TOOLS_DIR/aidl"

          test -x "$BUILD_TOOLS_DIR/aapt2"

          echo "========================================"
          echo "BUILD TOOLS 37 VERIFIED"
          echo "========================================"

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/aidl" --version || true
          "$BUILD_TOOLS_DIR/aapt2" version || true

      # ============================================================
      # 14. VERIFY BUILDOZER NDK
      # ============================================================
      - name: Verify Buildozer NDK
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          NDK_DIR="$BUILDOZER_SDK_DIR/ndk/${ANDROID_NDK_VERSION}"

          echo "========================================"
          echo "BUILDOZER NDK"
          echo "========================================"

          echo "NDK_DIR=$NDK_DIR"

          if [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: Buildozer NDK not found."

            if [ -d "$BUILDOZER_SDK_DIR/ndk" ]; then
              find "$BUILDOZER_SDK_DIR/ndk" \
                -maxdepth 1 \
                -mindepth 1 \
                -type d \
                -print \
                | sort
            fi

            exit 1
          fi

          test -f "$NDK_DIR/source.properties"

          echo "NDK ${ANDROID_NDK_VERSION} VERIFIED"

      # ============================================================
      # 15. FINAL ENVIRONMENT CHECK
      # ============================================================
      - name: Final Buildozer environment check
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "FINAL ENVIRONMENT"
          echo "========================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "P4A:"
          p4a --version

          echo "========================================"
          echo "ANDROID PATHS"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "========================================"
          echo "BUILDOZER SDK"
          echo "========================================"

          echo "$BUILDOZER_SDK_DIR"

          test "$ANDROID_HOME" = "$BUILDOZER_SDK_DIR"
          test "$ANDROID_SDK_ROOT" = "$BUILDOZER_SDK_DIR"

          test -d \
            "$BUILDOZER_SDK_DIR/build-tools/${ANDROID_BUILD_TOOLS}"

          test -x \
            "$BUILDOZER_SDK_DIR/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          test -d \
            "$BUILDOZER_SDK_DIR/ndk/${ANDROID_NDK_VERSION}"

          echo "========================================"
          echo "BUILD ENVIRONMENT READY"
          echo "========================================"

      # ============================================================
      # 16. BUILD APK
      # ============================================================
      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "STARTING APK BUILD"
          echo "========================================"

          echo "Buildozer SDK:"
          echo "$ANDROID_HOME"

          echo "Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          echo "NDK:"
          echo "$ANDROID_NDK"

          echo "========================================"
          echo "RUN BUILDOZER"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "========================================"

      # ============================================================
      # 17. VERIFY APK
      # ============================================================
      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "BIN DIRECTORY:"

            ls -lah bin || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"

          ls -lh "$APK_FILE"

      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 19. SUCCESS
      # ============================================================
      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Artifact:"
          echo "MoneyTracker-APK"

          echo "========================================"
