name: Build Money Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Money Tracker APK
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "21"
      ANDROIDNDK: "r28c"

      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON 3.11
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: "pip"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev \
            libsqlite3-dev \
            gettext \
            libtool-bin \
            openjdk-17-jdk


      # ============================================================
      # VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify build environment
        run: |
          set -eux

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          python --version
          python -m pip --version

          java -version

          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "ANDROIDNDK=$ANDROIDNDK"

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          pwd
          find . -maxdepth 2 -type f | sort


      # ============================================================
      # INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0"


      # ============================================================
      # INSTALL KIVY / CYTHON
      # ============================================================

      - name: Install Python build dependencies
        run: |
          set -eux

          python -m pip install \
            "Cython==0.29.34" \
            "kivy==2.3.1"


      # ============================================================
      # VERIFY BUILDOZER
      # ============================================================

      - name: Verify Buildozer and Kivy
        run: |
          set -eux

          echo "========================================"
          echo "VERSIONS"
          echo "========================================"

          python --version
          python -m pip --version

          buildozer --version

          python -c "import kivy; print('Kivy:', kivy.__version__)"
          python -c "import Cython; print('Cython:', Cython.__version__)"


      # ============================================================
      # FIND BUILDOZER SPEC
      # ============================================================

      - name: Locate buildozer.spec
        shell: bash
        run: |
          set -eux

          SPEC_FILE="$(find . -name "buildozer.spec" -type f | head -n 1)"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "SPEC_FILE=$SPEC_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # SHOW BUILDOZER SPEC
      # ============================================================

      - name: Show buildozer.spec
        run: |
          set -eux

          echo "========================================"
          echo "BUILDZER SPEC"
          echo "========================================"

          cat "$SPEC_FILE"


      # ============================================================
      # CLEAN ALL PREVIOUS BUILDS
      #
      # IMPORTANT:
      # This removes stale p4a build/venv and mixed pip state.
      # ============================================================

      - name: Clean Buildozer and p4a caches
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CLEANING OLD BUILD DATA"
          echo "========================================"

          rm -rf .buildozer
          rm -rf bin

          echo "Clean build directory prepared."

          mkdir -p .buildozer


      # ============================================================
      # CREATE BUILD DIRECTORY
      # ============================================================

      - name: Prepare clean build directories
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          mkdir -p .buildozer
          mkdir -p bin

          echo "PROJECT_DIR=$PROJECT_DIR"

          ls -lah


      # ============================================================
      # BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "STARTING BUILDOZER DEBUG BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # SEARCH APK / AAB
      # ============================================================

      - name: Search APK and AAB
        if: always()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "APK / AAB SEARCH"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Searching for APK/AAB files..."

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          echo ""
          echo "bin directory:"
          ls -lah bin 2>/dev/null || true

          echo ""
          echo "Buildozer directory:"
          ls -lah .buildozer 2>/dev/null || true


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # UPLOAD BUILD LOGS IF BUILD FAILS
      # ============================================================

      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            ${{ env.PROJECT_DIR }}/.buildozer/
          if-no-files-found: warn
          retention-days: 7
