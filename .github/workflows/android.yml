name: Build Money Tracker Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Money Tracker APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      # =====================================================
      # EXACT BUILD TOOLCHAIN
      # =====================================================
      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"

      ANDROID_API: "33"
      ANDROID_MIN_API: "21"
      ANDROID_BUILD_TOOLS: "33.0.2"

      # p4a r28c
      ANDROID_NDK_VERSION: "28.2.13676358"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. PYTHON 3.11.13
      # =====================================================
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: ""

      # =====================================================
      # 3. JAVA 17
      #
      # IMPORTANT:
      # NO MAVEN CACHE
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: ""

      # =====================================================
      # 4. SYSTEM DEPENDENCIES
      # =====================================================
      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            build-essential \
            ccache \
            cmake \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip

      # =====================================================
      # 5. VERIFY PYTHON / JAVA
      # =====================================================
      - name: Verify Python and Java
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python3 --version
          which python
          which python3

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

      # =====================================================
      # 6. INSTALL BUILDOZER
      # =====================================================
      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<26" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.34" \
            "sh"

      # =====================================================
      # 7. VERIFY BUILDOZER
      # =====================================================
      - name: Verify Buildozer
        run: |
          set -eux

          buildozer --version

          python -c "import Cython; print('Cython:', Cython.__version__)"

          python -c "import buildozer; print('Buildozer:', buildozer.__version__)"

      # =====================================================
      # 8. USE RUNNER'S EXISTING ANDROID SDK
      #
      # DO NOT CREATE ANOTHER SDK
      # DO NOT DOWNLOAD OLD COMMAND LINE TOOLS
      # =====================================================
      - name: Configure Android SDK
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          test -d "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          # Buildozer / python-for-android names
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"

          echo "SDK configured:"
          echo "$SDK"

      # =====================================================
      # 9. INSTALL EXACT SDK COMPONENTS
      #
      # ONLY:
      # API 33
      # BUILD TOOLS 33.0.2
      #
      # We do NOT install build-tools 37.
      # =====================================================
      - name: Install exact Android SDK components
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "SDKMANAGER:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "========================================"
          echo "VERIFY SDK 33"
          echo "========================================"

          test -d "$SDK/platforms/android-33"

          echo "========================================"
          echo "VERIFY BUILD TOOLS 33.0.2"
          echo "========================================"

          test -d "$SDK/build-tools/33.0.2"

          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "AIDL exists:"
          ls -lh "$SDK/build-tools/33.0.2/aidl"

      # =====================================================
      # 10. INSTALL EXACT NDK 28.2.13676358
      #
      # This is r28c.
      # =====================================================
      - name: Install exact Android NDK r28c
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          test -d "$SDK/ndk/28.2.13676358"

          echo "========================================"
          echo "NDK INSTALLED"
          echo "========================================"

          ls -lah "$SDK/ndk/28.2.13676358"

      # =====================================================
      # 11. CONFIGURE EXACT SDK + NDK FOR BUILDOZER
      #
      # VERY IMPORTANT:
      # Buildozer otherwise creates its own SDK/NDK.
      # =====================================================
      - name: Configure Buildozer Android paths
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/28.2.13676358"

          test -d "$SDK"
          test -d "$NDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"

          echo "NDKAPI=21" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

          echo "========================================"
          echo "ANDROID PATHS"
          echo "========================================"

          echo "ANDROIDSDK=$SDK"
          echo "ANDROIDNDK=$NDK"
          echo "ANDROIDAPI=33"
          echo "ANDROIDMINAPI=21"
          echo "NDKAPI=21"

      # =====================================================
      # 12. VERIFY SDK / NDK
      # =====================================================
      - name: Verify exact Android toolchain
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "========================================"
          echo "SDK"
          echo "========================================"

          test -d "$SDK"
          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/33.0.2"

          echo "========================================"
          echo "AIDL"
          echo "========================================"

          test -x "$SDK/build-tools/33.0.2/aidl"

          # DO NOT use:
          # aidl --version
          #
          # Build-tools 33.0.2 returns an error for that
          # option. Existence/executability is the correct check.

          "$SDK/build-tools/33.0.2/aidl" >/tmp/aidl-output.txt 2>&1 || true

          head -20 /tmp/aidl-output.txt || true

          echo "AIDL executable check passed."

          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -d "$NDK"

          test -f "$NDK/source.properties"

          cat "$NDK/source.properties"

          echo "========================================"
          echo "SDKMANAGER INSTALLED PACKAGES"
          echo "========================================"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed || true

      # =====================================================
      # 13. VERIFY SPEC
      # =====================================================
      - name: Verify buildozer.spec
        run: |
          set -eux

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOVER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "REQUIRED SETTINGS"
          echo "========================================"

          grep -E \
            'android.api|android.minapi|android.ndk|android.ndk_api|android.sdk_path|android.ndk_path|android.build_tools_version|android.archs|android.skip_update|requirements' \
            buildozer.spec

      # =====================================================
      # 14. HARD VALIDATION
      #
      # Prevent accidental incompatible toolchain settings.
      # =====================================================
      - name: Validate toolchain configuration
        run: |
          set -eux

          echo "========================================"
          echo "VALIDATING TOOLCHAIN"
          echo "========================================"

          grep -q '^android.api = 33$' buildozer.spec

          grep -q '^android.minapi = 21$' buildozer.spec

          grep -q '^android.ndk = 28c$' buildozer.spec

          grep -q '^android.ndk_api = 21$' buildozer.spec

          grep -q '^android.build_tools_version = 33.0.2$' buildozer.spec

          grep -q '^android.skip_update = True$' buildozer.spec

          grep -q '^android.sdk_path = /usr/local/lib/android/sdk$' buildozer.spec

          grep -q '^android.ndk_path = /usr/local/lib/android/sdk/ndk/28.2.13676358$' buildozer.spec

          echo "Toolchain configuration is correct."

      # =====================================================
      # 15. CLEAN ONLY PROJECT BUILDOZER STATE
      #
      # Do NOT delete runner SDK/NDK.
      # =====================================================
      - name: Clean project Buildozer state
        run: |
          set -eux

          rm -rf .buildozer

          rm -rf bin

          mkdir -p bin

      # =====================================================
      # 16. FINAL ENVIRONMENT CHECK
      # =====================================================
      - name: Final Build Environment Check
        run: |
          set -eux

          echo "========================================"
          echo "FINAL ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "NDKAPI=$NDKAPI"

          echo "========================================"
          echo "PATHS"
          echo "========================================"

          test -d "$ANDROIDSDK"
          test -d "$ANDROIDNDK"

          test -d "$ANDROIDSDK/platforms/android-33"
          test -d "$ANDROIDSDK/build-tools/33.0.2"
          test -x "$ANDROIDSDK/build-tools/33.0.2/aidl"

          echo "All required Android components are present."

      # =====================================================
      # 17. BUILD APK
      #
      # IMPORTANT:
      # Buildozer must use the exact SDK/NDK paths
      # specified in buildozer.spec.
      # =====================================================
      - name: Build Android APK
        run: |
          set -eux

          export BUILDOZER_WARN_ON_ROOT=0

          echo "========================================"
          echo "STARTING MONEY TRACKER APK BUILD"
          echo "========================================"

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          buildozer -v android debug

      # =====================================================
      # 18. SEARCH APK
      # =====================================================
      - name: Find APK
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "APK / AAB SEARCH"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print

          echo ""
          echo "AAB files:"
          find . -type f -name "*.aab" -print

          echo ""
          echo "bin directory:"
          ls -lah bin 2>/dev/null || true

          echo ""
          echo "Buildozer directory:"
          ls -lah .buildozer 2>/dev/null || true

      # =====================================================
      # 19. UPLOAD APK
      # =====================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error

      # =====================================================
      # 20. UPLOAD BUILD LOGS ON FAILURE
      # =====================================================
      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/
          if-no-files-found: warn
