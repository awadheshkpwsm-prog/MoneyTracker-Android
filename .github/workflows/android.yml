name: Money Tracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"

  ANDROID_BUILD_TOOLS: "37.0.0"

  ANDROID_NDK_VERSION: "28.2.13676358"

  BUILDOZER_WARN_ON_ROOT: "0"

  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build:
    name: Build Money Tracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev

      # ============================================================
      # ANDROID SDK PATH
      # ============================================================

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_SDK="/usr/local/lib/android/sdk"

          test -d "$ANDROID_SDK"

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_SDK" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_SDK"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK"
          echo "ANDROIDSDK=$ANDROID_SDK"

      # ============================================================
      # SDKMANAGER
      # ============================================================

      - name: Verify SDK manager
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version

      # ============================================================
      # ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          echo "Android SDK licenses accepted/processed."

      # ============================================================
      # ANDROID PLATFORM 33
      # ============================================================

      - name: Install Android API 33
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33"

      # ============================================================
      # BUILD TOOLS 37.0.0
      # ============================================================

      - name: Install Android Build Tools 37.0.0
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "INSTALLING BUILD TOOLS 37.0.0"
          echo "========================================"

          "$SDKMANAGER" "build-tools;37.0.0"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          test -d "$BUILD_TOOLS"

          echo "BUILD_TOOLS=$BUILD_TOOLS"

          ls -lah "$BUILD_TOOLS"

      # ============================================================
      # NDK 28.2.13676358
      # ============================================================

      - name: Install Android NDK 28.2.13676358
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" "ndk;28.2.13676358"

          NDK_PATH="$ANDROID_HOME/ndk/28.2.13676358"

          test -d "$NDK_PATH"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "========================================"
          echo "NDK VERIFIED"
          echo "========================================"

          echo "NDK_PATH=$NDK_PATH"

          ls -lah "$NDK_PATH"

      # ============================================================
      # BUILD ENVIRONMENT
      # ============================================================

      - name: Configure Android build environment
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROIDSDK" >> "$GITHUB_ENV"

          echo "ANDROID_BUILD_TOOLS=37.0.0" >> "$GITHUB_ENV"

          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "========================================"
          echo "ANDROID BUILD ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_BUILD_TOOLS=37.0.0"

      # ============================================================
      # PYTHON BUILD PACKAGES
      # ============================================================

      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python --version
          python -m pip --version

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "cython==0.29.34" \
            "buildozer==1.6.0"

      # ============================================================
      # VERIFY BUILDOZER
      # ============================================================

      - name: Verify Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER VERSION"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"

          python --version

          echo "========================================"
          echo "CYTHON VERSION"
          echo "========================================"

          cython --version

      # ============================================================
      # VERIFY ANDROID TOOLS
      # ============================================================

      - name: Verify Android tools
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID CONFIGURATION"
          echo "========================================"

          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"

          echo "========================================"
          echo "BUILD TOOLS 37.0.0"
          echo "========================================"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          test -d "$BUILD_TOOLS"

          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/aidl"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          echo "Build Tools 37.0.0: READY"

          echo "========================================"
          echo "ANDROID API 33"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-33"

          echo "Android API 33: READY"

          echo "========================================"
          echo "NDK 28.2"
          echo "========================================"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "NDK 28.2.13676358: READY"

      # ============================================================
      # VERIFY BUILDOZER SPEC
      # ============================================================

      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOZER SPEC SETTINGS"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version' \
            buildozer.spec

          echo "========================================"
          echo "CHECK BUILD TOOLS VERSION"
          echo "========================================"

          grep -q \
            '^android\.build_tools_version[[:space:]]*=[[:space:]]*37\.0\.0' \
            buildozer.spec

          echo "buildozer.spec Build Tools 37.0.0: OK"

      # ============================================================
      # CONNECT BUILDOZER TO ANDROID SDK
      # ============================================================

      - name: Connect Buildozer to Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROIDSDK="/usr/local/lib/android/sdk"

          export ANDROID_BUILD_TOOLS="37.0.0"

          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"

          export PATH="$ANDROID_HOME/build-tools/37.0.0:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          echo "========================================"
          echo "BUILDOZER ANDROID SDK CONNECTION"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"

          echo "ANDROID_NDK=$ANDROID_NDK"

          echo "========================================"
          echo "ANDROID TOOLS"
          echo "========================================"

          command -v aapt
          command -v aidl
          command -v zipalign
          command -v apksigner

          echo "========================================"
          echo "BUILD TOOLS PATH"
          echo "========================================"

          echo "$ANDROID_HOME/build-tools/37.0.0"

      # ============================================================
      # CLEAN OLD PROJECT BUILDOZER CACHE
      # ============================================================

      - name: Clean old Buildozer project cache
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer

          echo "Old project .buildozer cache removed."

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build Money Tracker APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "STARTING APK BUILD"
          echo "========================================"

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROIDSDK="/usr/local/lib/android/sdk"

          export ANDROID_BUILD_TOOLS="37.0.0"

          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"

          export PATH="$ANDROID_HOME/build-tools/37.0.0:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK=$ANDROID_NDK"

          echo "========================================"
          echo "BUILDOZER ANDROID DEBUG BUILD"
          echo "========================================"

          buildozer android debug

      # ============================================================
      # FIND APK
      # ============================================================

      - name: Locate generated APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(find . -type f -name "*.apk" | wc -l)"

          test "$APK_COUNT" -gt 0

          echo "APK_COUNT=$APK_COUNT"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Money Tracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # SUCCESS
      # ============================================================

      - name: Build completed
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          echo "Money Tracker APK build completed."

          echo "Buildozer   : 1.6.0"
          echo "Build Tools : 37.0.0"
          echo "Android API : 33"
          echo "Min API     : 21"
          echo "NDK         : 28.2.13676358"

          echo "========================================"
