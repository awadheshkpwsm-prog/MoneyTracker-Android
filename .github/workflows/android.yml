name: MoneyTracker Pre-Build Full Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  prebuild-diagnostic:

    name: Full Pre-Build Environment Check

    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive

      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"
      BUILDOZER_VERSION: "1.6.0"
      CYTHON_VERSION: "0.29.34"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      MAVEN_ARGS: "-ntp"

    steps:

      # ============================================================
      # 01. CHECKOUT REPOSITORY
      # ============================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 02. BASIC RUNNER INFORMATION
      # ============================================================

      - name: 02 - Runner system diagnostic
        run: |
          set -o pipefail

          echo "========================================"
          echo "RUNNER INFORMATION"
          echo "========================================"

          echo "PWD:"
          pwd

          echo
          echo "GITHUB_WORKSPACE:"
          echo "$GITHUB_WORKSPACE"

          echo
          echo "HOME:"
          echo "$HOME"

          echo
          echo "USER:"
          whoami

          echo
          echo "KERNEL:"
          uname -a

          echo
          echo "OS:"
          cat /etc/os-release || true

          echo
          echo "CPU:"
          nproc || true

          echo
          echo "MEMORY:"
          free -h || true

          echo
          echo "DISK:"
          df -h || true


      # ============================================================
      # 03. SHOW REPOSITORY FILE STRUCTURE
      # ============================================================

      - name: 03 - Repository file and folder check
        run: |
          set -o pipefail

          echo "========================================"
          echo "REPOSITORY ROOT"
          echo "========================================"

          ls -la "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo "PROJECT TREE"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -print \
            | sort \
            | head -3000

          echo
          echo "========================================"
          echo "TOTAL FILE COUNTS"
          echo "========================================"

          echo "Python files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.py" | wc -l

          echo "JSON files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.json" | wc -l

          echo "KV files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.kv" | wc -l

          echo "PNG files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.png" | wc -l

          echo "JPG files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.jpg" | wc -l

          echo "buildozer.spec files:"
          find "$GITHUB_WORKSPACE" -type f -name "buildozer.spec" | wc -l


      # ============================================================
      # 04. LOCATE BUILD PROJECT
      # ============================================================

      - name: 04 - Detect buildozer project
        run: |
          set -euxo pipefail

          SPEC_FILE="$(find "$GITHUB_WORKSPACE" \
            -name "buildozer.spec" \
            -type f \
            | head -n 1)"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "========================================"
          echo "PROJECT DETECTED"
          echo "========================================"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$SPEC_FILE"
          test -d "$PROJECT_DIR"

          echo "SPEC_FILE=$SPEC_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 05. PROJECT ROOT CONTENTS
      # ============================================================

      - name: 05 - Project root validation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"

          pwd

          echo
          echo "========================================"
          echo "PROJECT CONTENTS"
          echo "========================================"

          ls -lah

          echo
          echo "========================================"
          echo "IMPORTANT FILES"
          echo "========================================"

          for FILE in \
            buildozer.spec \
            main.py \
            README.md \
            README.txt \
            requirements.txt \
            pyproject.toml
          do
            if [ -e "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "NOT FOUND: $FILE"
            fi
          done

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec missing from PROJECT_DIR."
            exit 1
          fi


      # ============================================================
      # 06. SETUP JAVA 17
      # ============================================================

      - name: 06 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 07. VERIFY JAVA
      # ============================================================

      - name: 07 - Java full diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"

          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "JAVA PATH:"
          command -v java

          echo
          echo "JAVAC VERSION:"
          javac -version

          echo
          echo "JAVAC PATH:"
          command -v javac

          test -n "$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"


      # ============================================================
      # 08. SETUP PYTHON
      #
      # cache: pip intentionally removed because this project may not
      # contain requirements.txt or pyproject.toml.
      # ============================================================

      - name: 08 - Set up Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          check-latest: false


      # ============================================================
      # 09. PYTHON DIAGNOSTIC
      # ============================================================

      - name: 09 - Python environment diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -V
          command -v python

          echo
          echo "PYTHON LOCATION:"
          python -c "import sys; print(sys.executable)"

          echo
          echo "PYTHON VERSION DETAIL:"
          python -c "import sys; print(sys.version)"

          echo
          echo "PIP:"
          python -m pip --version

          echo
          echo "SITE PACKAGES:"
          python -c "import site; print(site.getsitepackages())"

          python - <<'PY'
          import sys

          expected = (3, 11)

          print("Python version tuple:", sys.version_info[:3])

          if sys.version_info[:2] != expected:
              raise SystemExit(
                  f"ERROR: Expected Python {expected[0]}.{expected[1]}, "
                  f"got {sys.version_info.major}.{sys.version_info.minor}"
              )

          print("PASS: Python major/minor version is correct.")
          PY


      # ============================================================
      # 10. INSTALL SYSTEM DEPENDENCIES
      #
      # These are host dependencies only.
      # No Android SDK, Build Tools or NDK are installed here.
      # ============================================================

      - name: 10 - Install host build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libltdl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            liblzma-dev \
            patch \
            file


      # ============================================================
      # 11. VERIFY HOST TOOLS
      # ============================================================

      - name: 11 - Host tools diagnostic
        run: |
          set -o pipefail

          echo "========================================"
          echo "HOST TOOL CHECK"
          echo "========================================"

          TOOLS=(
            git
            gcc
            g++
            make
            cmake
            autoconf
            automake
            libtool
            pkg-config
            zip
            unzip
            patch
            file
          )

          FAILED=0

          for TOOL in "${TOOLS[@]}"; do

            if command -v "$TOOL" >/dev/null 2>&1; then
              echo "PASS: $TOOL"
              command -v "$TOOL"
            else
              echo "FAIL: $TOOL not found"
              FAILED=1
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi


      # ============================================================
      # 12. INSTALL BUILDOZER / CYTHON ONLY
      # ============================================================

      - name: 12 - Install Buildozer environment
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}"

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}"

          echo
          echo "========================================"
          echo "INSTALLED PACKAGES"
          echo "========================================"

          python -m pip show buildozer
          python -m pip show Cython


      # ============================================================
      # 13. VERIFY BUILDOZER AND CYTHON
      # ============================================================

      - name: 13 - Buildozer and Cython diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          command -v buildozer
          buildozer --version

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          command -v cython
          cython --version

          echo
          echo "========================================"
          echo "PYTHON PACKAGE IMPORT TEST"
          echo "========================================"

          python - <<'PY'
          import Cython
          import buildozer

          print("Cython import:", Cython.__version__)
          print("Buildozer import: PASS")
          PY


      # ============================================================
      # 14. READ AND DISPLAY BUILDOZER SPEC
      # ============================================================

      - name: 14 - Read buildozer.spec
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FULL buildozer.spec"
          echo "========================================"

          cat buildozer.spec

          echo
          echo "========================================"
          echo "IMPORTANT ANDROID SETTINGS"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(title|package\.name|package\.domain|source\.dir|source\.include_exts|requirements|orientation|fullscreen|android\.api|android\.minapi|android\.ndk|android\.archs|android\.build_tools_version|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true


      # ============================================================
      # 15. BUILD SPEC REQUIRED FIELD CHECK
      # ============================================================

      - name: 15 - Validate required buildozer.spec settings
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "SPEC VALIDATION"
          echo "========================================"

          REQUIRED_KEYS=(
            "title"
            "package.name"
            "package.domain"
            "source.dir"
            "source.include_exts"
            "version"
            "requirements"
            "orientation"
            "android.api"
            "android.minapi"
          )

          FAILED=0

          for KEY in "${REQUIRED_KEYS[@]}"; do

            VALUE="$(
              grep -E "^[[:space:]]*${KEY//./\\.}[[:space:]]*=" \
                buildozer.spec \
                | head -n 1 \
                | cut -d '=' -f2- \
                | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
            )"

            if [ -z "$VALUE" ]; then
              echo "FAIL: $KEY is missing or empty"
              FAILED=1
            else
              echo "PASS: $KEY = $VALUE"
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: buildozer.spec validation failed."
            exit 1
          fi


      # ============================================================
      # 16. VALIDATE SOURCE DIRECTORY
      # ============================================================

      - name: 16 - Validate source directory
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          SOURCE_DIR="$(
            grep -E '^[[:space:]]*source\.dir[[:space:]]*=' \
              buildozer.spec \
              | head -n 1 \
              | cut -d '=' -f2- \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          echo "source.dir=$SOURCE_DIR"

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: source.dir is empty."
            exit 1
          fi

          if [ "$SOURCE_DIR" = "." ]; then
            SOURCE_PATH="$PWD"
          else
            SOURCE_PATH="$PWD/$SOURCE_DIR"
          fi

          echo "Resolved source path:"
          echo "$SOURCE_PATH"

          if [ ! -d "$SOURCE_PATH" ]; then
            echo "ERROR: source directory does not exist."
            exit 1
          fi

          echo "SOURCE_PATH=$SOURCE_PATH" >> "$GITHUB_ENV"

          echo
          echo "SOURCE CONTENTS:"
          find "$SOURCE_PATH" \
            -maxdepth 3 \
            -print \
            | sort \
            | head -2000


      # ============================================================
      # 17. CHECK ALL PYTHON FILES
      #
      # This compiles syntax only.
      # It does NOT build Android APK.
      # ============================================================

      - name: 17 - Python syntax compilation check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "PYTHON SYNTAX CHECK"
          echo "========================================"

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' FILE_PATH; do

            COUNT=$((COUNT + 1))

            echo "Checking: $FILE_PATH"

            if ! python -m py_compile "$FILE_PATH"; then
              echo "FAIL: $FILE_PATH"
              FAILED=1
            fi

          done < <(find "$SOURCE_PATH" -type f -name "*.py" -print0)

          echo
          echo "Python files checked: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No Python files found."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Python syntax check failed."
            exit 1
          fi

          echo "PASS: All Python files passed syntax compilation."


      # ============================================================
      # 18. CHECK MAIN.PY
      # ============================================================

      - name: 18 - Check main.py
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "MAIN.PY CHECK"
          echo "========================================"

          if [ -f "$SOURCE_PATH/main.py" ]; then
            echo "PASS: main.py found"
            echo "Path: $SOURCE_PATH/main.py"

            python -m py_compile "$SOURCE_PATH/main.py"

          else
            echo "WARNING: main.py not found directly in source directory."

            echo "Searching for main.py..."

            find "$SOURCE_PATH" \
              -type f \
              -name "main.py" \
              -print \
              | sort

            MAIN_COUNT="$(find "$SOURCE_PATH" -type f -name "main.py" | wc -l)"

            if [ "$MAIN_COUNT" -eq 0 ]; then
              echo "ERROR: No main.py found."
              exit 1
            fi
          fi


      # ============================================================
      # 19. PYTHON PACKAGE / IMPORT STRUCTURE CHECK
      #
      # Does not execute main.py.
      # Only checks discoverable local modules.
      # ============================================================

      - name: 19 - Python project structure check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "PYTHON PROJECT STRUCTURE"
          echo "========================================"

          echo "Python files:"
          find "$SOURCE_PATH" \
            -type f \
            -name "*.py" \
            | sort

          echo
          echo "Python package markers:"
          find "$SOURCE_PATH" \
            -type f \
            -name "__init__.py" \
            | sort \
            || true

          echo
          echo "Potential local modules:"
          find "$SOURCE_PATH" \
            -maxdepth 3 \
            -type f \
            -name "*.py" \
            | sort


      # ============================================================
      # 20. CHECK REQUIRED PYTHON PACKAGES FROM BUILDOZER SPEC
      #
      # Separates known Android recipes from normal Python packages.
      # It only reports whether host-side import/install information
      # can be checked. No APK build is started.
      # ============================================================

      - name: 20 - Analyze Buildozer requirements
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          REQUIREMENTS="$(
            grep -E '^[[:space:]]*requirements[[:space:]]*=' \
              buildozer.spec \
              | head -n 1 \
              | cut -d '=' -f2- \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          echo "========================================"
          echo "RAW REQUIREMENTS"
          echo "========================================"

          echo "$REQUIREMENTS"

          python - "$REQUIREMENTS" <<'PY'
          import sys

          raw = sys.argv[1]

          requirements = [
              item.strip()
              for item in raw.split(",")
              if item.strip()
          ]

          print()
          print("Parsed requirements:")

          for item in requirements:
              print(f" - {item}")

          if not requirements:
              raise SystemExit("ERROR: No requirements found.")

          print()
          print("PASS: Requirements field was successfully parsed.")
          PY


      # ============================================================
      # 21. CHECK FILE EXTENSIONS DECLARED IN SPEC
      # ============================================================

      - name: 21 - Validate source.include_exts files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          INCLUDE_EXTS="$(
            grep -E '^[[:space:]]*source\.include_exts[[:space:]]*=' \
              buildozer.spec \
              | head -n 1 \
              | cut -d '=' -f2- \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          echo "========================================"
          echo "SOURCE INCLUDE EXTENSIONS"
          echo "========================================"

          echo "$INCLUDE_EXTS"

          IFS=',' read -ra EXTS <<< "$INCLUDE_EXTS"

          for EXT in "${EXTS[@]}"; do

            EXT="$(echo "$EXT" | xargs)"

            if [ -z "$EXT" ]; then
              continue
            fi

            COUNT="$(find "$SOURCE_PATH" \
              -type f \
              -iname "*.${EXT}" \
              | wc -l)"

            echo "${EXT}: ${COUNT} file(s)"

          done


      # ============================================================
      # 22. JSON FILE VALIDATION
      # ============================================================

      - name: 22 - Validate JSON files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "JSON VALIDATION"
          echo "========================================"

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' JSON_FILE; do

            COUNT=$((COUNT + 1))

            echo "Checking: $JSON_FILE"

            if ! python -m json.tool \
              "$JSON_FILE" \
              >/dev/null; then

              echo "FAIL: Invalid JSON -> $JSON_FILE"
              FAILED=1

            fi

          done < <(
            find "$SOURCE_PATH" \
              -type f \
              -name "*.json" \
              -print0
          )

          echo
          echo "JSON files checked: $COUNT"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "PASS: JSON validation completed."


      # ============================================================
      # 23. CHECK ANDROID / BUILDOZER DIRECTORIES
      #
      # Important:
      # No SDK, Build Tools, or NDK installation occurs here.
      # This only detects what already exists.
      # ============================================================

      - name: 23 - Android directory discovery
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID ENVIRONMENT VARIABLES"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-NOT SET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-NOT SET}"
          echo "ANDROID_NDK=${ANDROID_NDK:-NOT SET}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-NOT SET}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-NOT SET}"

          echo
          echo "========================================"
          echo "HOME/.buildozer"
          echo "========================================"

          if [ -d "$HOME/.buildozer" ]; then

            find "$HOME/.buildozer" \
              -maxdepth 5 \
              -print \
              | sort \
              | head -5000

          else
            echo "NOT FOUND: $HOME/.buildozer"
          fi

          echo
          echo "========================================"
          echo "COMMON ANDROID LOCATIONS"
          echo "========================================"

          LOCATIONS=(
            "$HOME/.buildozer/android/platform"
            "$HOME/.buildozer/android/platform/android-sdk"
            "$HOME/Android/Sdk"
            "/usr/local/lib/android/sdk"
            "/opt/android-sdk"
          )

          for DIR in "${LOCATIONS[@]}"; do

            if [ -d "$DIR" ]; then
              echo "FOUND: $DIR"
            else
              echo "NOT FOUND: $DIR"
            fi

          done


      # ============================================================
      # 24. AUTO-DETECT EXISTING ANDROID SDK
      # ============================================================

      - name: 24 - Detect existing Android SDK
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID SDK DETECTION"
          echo "========================================"

          SDK=""

          CANDIDATES=(
            "${ANDROID_SDK_ROOT:-}"
            "${ANDROID_HOME:-}"
            "$HOME/.buildozer/android/platform/android-sdk"
            "$HOME/Android/Sdk"
            "/usr/local/lib/android/sdk"
            "/opt/android-sdk"
          )

          for CANDIDATE in "${CANDIDATES[@]}"; do

            if [ -n "$CANDIDATE" ] \
              && [ -d "$CANDIDATE" ]; then

              echo "Candidate found:"
              echo "$CANDIDATE"

              if [ -d "$CANDIDATE/platform-tools" ]; then
                SDK="$CANDIDATE"
                break
              fi

            fi

          done

          if [ -z "$SDK" ]; then

            echo "RESULT: No existing Android SDK detected."

            echo "ANDROID_SDK_FOUND=false" >> "$GITHUB_ENV"

            exit 0
          fi

          echo
          echo "PASS: Android SDK detected:"
          echo "$SDK"

          echo "ANDROID_SDK_FOUND=true" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_REAL=$SDK" >> "$GITHUB_ENV"

          echo
          echo "SDK top-level folders:"

          find "$SDK" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort


      # ============================================================
      # 25. CHECK SDK CONTENTS
      # ============================================================

      - name: 25 - Android SDK content diagnostic
        if: env.ANDROID_SDK_FOUND == 'true'
        run: |
          set -o pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "SDK PATH"
          echo "========================================"

          echo "$SDK"

          echo
          echo "========================================"
          echo "PLATFORM TOOLS"
          echo "========================================"

          if [ -d "$SDK/platform-tools" ]; then
            echo "PASS: platform-tools exists"

            if [ -x "$SDK/platform-tools/adb" ]; then
              "$SDK/platform-tools/adb" version || true
            fi
          else
            echo "FAIL: platform-tools missing"
          fi

          echo
          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          if [ -d "$SDK/build-tools" ]; then

            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V

          else
            echo "NOT FOUND: build-tools"
          fi

          echo
          echo "========================================"
          echo "PLATFORMS"
          echo "========================================"

          if [ -d "$SDK/platforms" ]; then

            find "$SDK/platforms" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V

          else
            echo "NOT FOUND: platforms"
          fi

          echo
          echo "========================================"
          echo "CMDLINE TOOLS"
          echo "========================================"

          if [ -d "$SDK/cmdline-tools" ]; then

            find "$SDK/cmdline-tools" \
              -maxdepth 3 \
              -type f \
              -name sdkmanager \
              -print

          else
            echo "NOT FOUND: cmdline-tools"
          fi


      # ============================================================
      # 26. CHECK BUILD TOOLS DETECTION
      # ============================================================

      - name: 26 - Detect available Android Build Tools
        if: env.ANDROID_SDK_FOUND == 'true'
        run: |
          set -o pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "BUILD TOOLS DETECTION"
          echo "========================================"

          if [ ! -d "$SDK/build-tools" ]; then
            echo "RESULT: No build-tools directory found."
            echo "ANDROID_BUILD_TOOLS_FOUND=false" >> "$GITHUB_ENV"
            exit 0
          fi

          BUILD_TOOLS_VERSION="$(
            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "RESULT: No Build Tools version detected."
            echo "ANDROID_BUILD_TOOLS_FOUND=false" >> "$GITHUB_ENV"
            exit 0
          fi

          BUILD_TOOLS_DIR="$SDK/build-tools/$BUILD_TOOLS_VERSION"

          echo "PASS: Latest detected Build Tools"
          echo "VERSION=$BUILD_TOOLS_VERSION"
          echo "PATH=$BUILD_TOOLS_DIR"

          echo "ANDROID_BUILD_TOOLS_FOUND=true" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_REAL=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

          echo
          echo "Directory contents:"
          ls -lah "$BUILD_TOOLS_DIR"


      # ============================================================
      # 27. AUTO-DETECT EXISTING NDK
      #
      # Does NOT install NDK.
      # Searches all likely Buildozer and SDK locations.
      # ============================================================

      - name: 27 - Detect existing Android NDK
        run: |
          set -o pipefail

          echo "========================================"
          echo "ANDROID NDK DETECTION"
          echo "========================================"

          NDK_DIR=""

          SEARCH_ROOTS=(
            "${ANDROID_SDK_REAL:-}"
            "$HOME/.buildozer/android/platform"
            "$HOME/.buildozer"
            "$HOME/Android/Sdk"
          )

          for ROOT in "${SEARCH_ROOTS[@]}"; do

            if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
              continue
            fi

            echo
            echo "Searching:"
            echo "$ROOT"

            CANDIDATE="$(
              find "$ROOT" \
                -type f \
                -name "source.properties" \
                -path "*ndk*" \
                2>/dev/null \
                | sed 's#/source.properties##' \
                | sort -V \
                | tail -n 1 \
                || true
            )"

            if [ -n "$CANDIDATE" ] \
              && [ -d "$CANDIDATE" ]; then

              NDK_DIR="$CANDIDATE"
              break
            fi

          done

          if [ -z "$NDK_DIR" ]; then

            echo
            echo "RESULT: No existing Android NDK detected."

            echo "ANDROID_NDK_FOUND=false" >> "$GITHUB_ENV"

            exit 0
          fi

          echo
          echo "PASS: Android NDK detected"
          echo "$NDK_DIR"

          if [ -f "$NDK_DIR/source.properties" ]; then

            echo
            echo "========================================"
            echo "NDK source.properties"
            echo "========================================"

            cat "$NDK_DIR/source.properties"

          else

            echo "WARNING: source.properties missing."

          fi

          echo "ANDROID_NDK_FOUND=true" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_REAL=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 28. CHECK SPEC VS DETECTED ENVIRONMENT
      #
      # Informational comparison only.
      # Does not install or build anything.
      # ============================================================

      - name: 28 - Compare buildozer.spec with detected environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "SPEC VS ENVIRONMENT"
          echo "========================================"

          echo
          echo "FROM buildozer.spec:"

          grep -E \
            '^[[:space:]]*(android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true

          echo
          echo "DETECTED ENVIRONMENT:"

          echo "ANDROID_SDK_FOUND=${ANDROID_SDK_FOUND:-false}"
          echo "ANDROID_SDK_REAL=${ANDROID_SDK_REAL:-NOT DETECTED}"

          echo "ANDROID_BUILD_TOOLS_FOUND=${ANDROID_BUILD_TOOLS_FOUND:-false}"
          echo "ANDROID_BUILD_TOOLS_REAL=${ANDROID_BUILD_TOOLS_REAL:-NOT DETECTED}"
          echo "ANDROID_BUILD_TOOLS_DIR=${ANDROID_BUILD_TOOLS_DIR:-NOT DETECTED}"

          echo "ANDROID_NDK_FOUND=${ANDROID_NDK_FOUND:-false}"
          echo "ANDROID_NDK_REAL=${ANDROID_NDK_REAL:-NOT DETECTED}"


      # ============================================================
      # 29. BUILD PREREQUISITE SUMMARY
      #
      # This is the final pass/fail diagnostic.
      #
      # SDK / NDK are reported separately because this workflow does
      # not intentionally initialize or download Android components.
      # ============================================================

      - name: 29 - Final pre-build prerequisite report
        run: |
          set -o pipefail

          echo "========================================"
          echo "FINAL PRE-BUILD REPORT"
          echo "========================================"

          FAILED=0

          echo
          echo "PROJECT:"

          if [ -f "$SPEC_FILE" ]; then
            echo "PASS - buildozer.spec found"
          else
            echo "FAIL - buildozer.spec missing"
            FAILED=1
          fi

          if [ -d "$PROJECT_DIR" ]; then
            echo "PASS - project directory found"
          else
            echo "FAIL - project directory missing"
            FAILED=1
          fi

          echo
          echo "PYTHON:"

          if python -c \
            "import sys; raise SystemExit(0 if sys.version_info[:2] == (3,11) else 1)"
          then
            echo "PASS - Python 3.11 active"
          else
            echo "FAIL - Python 3.11 not active"
            FAILED=1
          fi

          echo
          echo "JAVA:"

          if command -v java >/dev/null 2>&1 \
            && command -v javac >/dev/null 2>&1
          then
            echo "PASS - Java and javac available"
          else
            echo "FAIL - Java environment incomplete"
            FAILED=1
          fi

          echo
          echo "BUILDOZER:"

          if command -v buildozer >/dev/null 2>&1; then
            echo "PASS - Buildozer executable"
          else
            echo "FAIL - Buildozer missing"
            FAILED=1
          fi

          echo
          echo "CYTHON:"

          if python -c "import Cython" >/dev/null 2>&1; then
            echo "PASS - Cython import works"
          else
            echo "FAIL - Cython missing"
            FAILED=1
          fi

          echo
          echo "ANDROID SDK:"

          if [ "${ANDROID_SDK_FOUND:-false}" = "true" ]; then
            echo "PASS - Existing SDK detected"
            echo "PATH: $ANDROID_SDK_REAL"
          else
            echo "INFO - No SDK currently detected"
            echo "This workflow did not install or initialize Android SDK."
          fi

          echo
          echo "ANDROID BUILD TOOLS:"

          if [ "${ANDROID_BUILD_TOOLS_FOUND:-false}" = "true" ]; then
            echo "PASS - Build Tools detected"
            echo "VERSION: $ANDROID_BUILD_TOOLS_REAL"
            echo "PATH: $ANDROID_BUILD_TOOLS_DIR"
          else
            echo "INFO - Build Tools not currently detected"
          fi

          echo
          echo "ANDROID NDK:"

          if [ "${ANDROID_NDK_FOUND:-false}" = "true" ]; then
            echo "PASS - NDK detected"
            echo "PATH: $ANDROID_NDK_REAL"
          else
            echo "INFO - NDK not currently detected"
            echo "No NDK was installed because this is diagnostic-only."
          fi

          echo
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then

            echo "PRE-BUILD CORE CHECK: FAILED"

            exit 1

          fi

          echo "PRE-BUILD CORE CHECK: PASSED"
          echo "NO APK BUILD WAS RUN."


      # ============================================================
      # 30. CREATE COMPLETE DIAGNOSTIC REPORT
      # ============================================================

      - name: 30 - Create diagnostic report
        if: always()
        run: |
          mkdir -p diagnostic-report

          {
            echo "========================================"
            echo "MONEYTRACKER PRE-BUILD DIAGNOSTIC"
            echo "========================================"

            echo
            echo "DATE:"
            date

            echo
            echo "PROJECT:"
            echo "SPEC_FILE=${SPEC_FILE:-NOT SET}"
            echo "PROJECT_DIR=${PROJECT_DIR:-NOT SET}"

            echo
            echo "PYTHON:"
            python --version || true

            echo
            echo "JAVA:"
            java -version 2>&1 || true

            echo
            echo "BUILDOZER:"
            buildozer --version 2>&1 || true

            echo
            echo "CYTHON:"
            cython --version 2>&1 || true

            echo
            echo "ANDROID SDK:"
            echo "${ANDROID_SDK_REAL:-NOT DETECTED}"

            echo
            echo "BUILD TOOLS:"
            echo "${ANDROID_BUILD_TOOLS_REAL:-NOT DETECTED}"
            echo "${ANDROID_BUILD_TOOLS_DIR:-NOT DETECTED}"

            echo
            echo "NDK:"
            echo "${ANDROID_NDK_REAL:-NOT DETECTED}"

            echo
            echo "DISK:"
            df -h || true

          } > diagnostic-report/prebuild-summary.txt

          cp \
            "$SPEC_FILE" \
            diagnostic-report/buildozer.spec.copy \
            2>/dev/null \
            || true

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -print \
            | sort \
            > diagnostic-report/project-tree.txt \
            || true


      # ============================================================
      # 31. UPLOAD COMPLETE DIAGNOSTIC REPORT
      # ============================================================

      - name: 31 - Upload pre-build diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-PreBuild-Diagnostic
          path: diagnostic-report
          if-no-files-found: error