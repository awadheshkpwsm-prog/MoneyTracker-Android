name: MoneyTracker Android Full Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneytracker-android-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

  # ============================================================
  # HOST BUILD ENVIRONMENT
  # ============================================================
  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"
  BUILDOZER_VERSION: "1.6.0"
  CYTHON_VERSION: "0.29.34"

  # ============================================================
  # ANDROID TARGET
  # ============================================================
  ANDROID_API: "33"
  ANDROID_MINAPI: "21"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_NDK_API: "21"

  # ============================================================
  # IMPORTANT:
  # p4a currently has a known pip/build-venv issue where the
  # internal venv can become Python 3.14.
  #
  # We explicitly request Python 3.11 for BOTH:
  #   python3
  #   hostpython3
  # ============================================================
  P4A_PYTHON_VERSION: "3.11.13"

  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_ROOT_USER_ACTION: "ignore"

  BUILDOZER_WARN_ON_ROOT: "0"

  MAVEN_ARGS: "-ntp"

jobs:

  build-android:

    name: Build MoneyTracker Android

    runs-on: ubuntu-24.04

    timeout-minutes: 90

    steps:

      # ==========================================================
      # 01 - CHECKOUT
      # ==========================================================
      - name: 01 - Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 02 - LOCATE PROJECT
      # ==========================================================
      - name: 02 - Locate Buildozer project
        shell: bash
        run: |
          set -euxo pipefail

          SPEC_FILE="$(find "$GITHUB_WORKSPACE" \
            -name buildozer.spec \
            -type f \
            -print -quit)"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

      # ==========================================================
      # 03 - SYSTEM PACKAGES
      # ==========================================================
      - name: 03 - Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            rsync \
            file \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libffi-dev \
            libssl-dev \
            liblzma-dev \
            libsqlite3-dev \
            libreadline-dev \
            libbz2-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            uuid-dev

      # ==========================================================
      # 04 - JAVA 17
      # ==========================================================
      - name: 04 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 05 - PYTHON 3.11.13
      # ==========================================================
      - name: 05 - Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          check-latest: false
          cache: pip

      # ==========================================================
      # 06 - VERIFY HOST PYTHON
      # ==========================================================
      - name: 06 - Verify host Python
        shell: bash
        run: |
          set -euxo pipefail

          python --version
          python3 --version
          which python
          which python3

          python - <<'PY'
          import sys

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)

          assert sys.version_info[:2] == (3, 11), \
              "HOST PYTHON MUST BE PYTHON 3.11"
          PY

      # ==========================================================
      # 07 - CREATE CONTROLLED VENV
      # ==========================================================
      - name: 07 - Create controlled Python 3.11 venv
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/moneytracker-venv"

          python -m venv "$RUNNER_TEMP/moneytracker-venv"

          source "$RUNNER_TEMP/moneytracker-venv/bin/activate"

          python --version
          python -m pip --version

          python -m pip install \
            "pip<25" \
            "setuptools<81" \
            "wheel"

      # ==========================================================
      # 08 - INSTALL CYTHON
      # ==========================================================
      - name: 08 - Install compatible Cython
        shell: bash
        run: |
          set -euxo pipefail

          source "$RUNNER_TEMP/moneytracker-venv/bin/activate"

          python -m pip install \
            "Cython==${CYTHON_VERSION}"

          cython --version

      # ==========================================================
      # 09 - INSTALL BUILDOZER
      # ==========================================================
      - name: 09 - Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          source "$RUNNER_TEMP/moneytracker-venv/bin/activate"

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}"

          buildozer --version

      # ==========================================================
      # 10 - ANDROID SDK
      # ==========================================================
      - name: 10 - Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================================
      # 11 - INSTALL EXACT ANDROID SDK COMPONENTS
      # ==========================================================
      - name: 11 - Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;33.0.2"

      # ==========================================================
      # 12 - INSTALL EXACT NDK r28c
      #
      # Android SDK package version:
      # 28.2.13676358
      # ==========================================================
      - name: 12 - Install Android NDK r28c
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

          if [ ! -d "$NDK_PATH" ]; then
            echo "ERROR: Exact NDK was not installed:"
            echo "$NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK_PATH"
          echo "ANDROID_NDK_ROOT=$NDK_PATH"

      # ==========================================================
      # 13 - REMOVE SYSTEM NDK OVERRIDES
      # ==========================================================
      - name: 13 - Lock Android NDK environment
        shell: bash
        run: |
          set -euxo pipefail

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK=$NDK_PATH"
            echo "ANDROIDNDK=$NDK_PATH"
            echo "ANDROID_NDK_REAL=$NDK_PATH"
          } >> "$GITHUB_ENV"

          echo "Locked NDK:"
          "$NDK_PATH/ndk-build" --version || true

      # ==========================================================
      # 14 - VERIFY JAVA / SDK / NDK
      # ==========================================================
      - name: 14 - Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "Java:"
          java -version

          echo
          echo "ADB:"
          adb version

          echo
          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_SDK_ROOT/build-tools/33.0.2"
          test -d "$ANDROID_NDK_HOME"

      # ==========================================================
      # 15 - VERIFY PROJECT
      # ==========================================================
      - name: 15 - Verify MoneyTracker project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec
          test -f main.py

          echo "Project:"
          pwd

          echo
          echo "Files:"
          ls -lah

      # ==========================================================
      # 16 - SHOW CURRENT SPEC
      # ==========================================================
      - name: 16 - Show Buildozer spec
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          sed -n '1,240p' buildozer.spec

      # ==========================================================
      # 17 - CRITICAL SPEC VALIDATION
      #
      # We do NOT allow an unversioned python3 requirement here.
      # This prevents p4a from silently selecting Python 3.14.
      # ==========================================================
      - name: 17 - Validate Python requirement
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          REQUIREMENTS_LINE="$(
            grep -E '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec || true
          )"

          echo "$REQUIREMENTS_LINE"

          if echo "$REQUIREMENTS_LINE" | grep -Eq \
            'python3[[:space:]]*(,|$)'; then

            echo "ERROR: buildozer.spec contains unversioned python3."
            echo "Use:"
            echo "python3==3.11.13,hostpython3==3.11.13"
            exit 1
          fi

      # ==========================================================
      # 18 - PATCH BUILD SPEC PYTHON REQUIREMENTS
      #
      # Keep all existing requirements except replace unversioned
      # python3 with explicit Python 3.11.13 + hostpython3.
      # ==========================================================
      - name: 18 - Force Python 3.11.13 in Buildozer requirements
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          cp buildozer.spec buildozer.spec.before-python-fix

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildozer.spec")
          text = p.read_text()

          lines = text.splitlines()

          found = False
          output = []

          for line in lines:
              if re.match(r'^\s*requirements\s*=', line):
                  found = True

                  prefix, value = line.split("=", 1)
                  value = value.strip()

                  items = [
                      x.strip()
                      for x in value.split(",")
                      if x.strip()
                  ]

                  new_items = []

                  for item in items:
                      if item == "python3":
                          continue

                      if item.startswith("python3=="):
                          continue

                      if item.startswith("hostpython3"):
                          continue

                      new_items.append(item)

                  new_items.insert(
                      0,
                      "python3==3.11.13"
                  )

                  new_items.insert(
                      1,
                      "hostpython3==3.11.13"
                  )

                  output.append(
                      prefix.rstrip()
                      + " = "
                      + ",".join(new_items)
                  )
              else:
                  output.append(line)

          if not found:
              raise SystemExit(
                  "ERROR: requirements= line not found"
              )

          p.write_text("\n".join(output) + "\n")
          PY

          echo "Final requirements:"
          grep -E '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec

      # ==========================================================
      # 19 - CLEAN OLD BUILDOZER ENVIRONMENT
      #
      # VERY IMPORTANT:
      # The previous build contained:
      #   build/venv/lib/python3.14
      #
      # That stale environment MUST NOT survive.
      # ==========================================================
      - name: 19 - Remove stale Buildozer Android build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer

          echo "Stale .buildozer removed."

      # ==========================================================
      # 20 - CLEAN P4A CACHE
      # ==========================================================
      - name: 20 - Clean python-for-android caches
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/.cache/pip" || true
          rm -rf "$HOME/.cache/buildozer" || true

      # ==========================================================
      # 21 - VERIFY BUILD ENVIRONMENT
      # ==========================================================
      - name: 21 - Final environment verification
        shell: bash
        run: |
          set -euxo pipefail

          source "$RUNNER_TEMP/moneytracker-venv/bin/activate"

          echo "========================================"
          echo "HOST PYTHON"
          echo "========================================"

          python --version
          python -c 'import sys; print(sys.executable)'

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo
          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"

          echo "$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

      # ==========================================================
      # 22 - BOOTSTRAP / UPDATE
      #
      # Do NOT manually create a separate Python 3.14 environment.
      # Buildozer/p4a will receive explicit 3.11 requirements.
      # ==========================================================
      - name: 22 - Bootstrap Buildozer Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          ANDROIDNDK: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          source "$RUNNER_TEMP/moneytracker-venv/bin/activate"

          echo "========================================"
          echo "BUILDOZER UPDATE"
          echo "========================================"

          python --version
          buildozer --version

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          buildozer -v android update

      # ==========================================================
      # 23 - VERIFY P4A SOURCE
      # ==========================================================
      - name: 23 - Verify python-for-android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          P4A_DIR=".buildozer/android/platform/python-for-android"

          test -d "$P4A_DIR"

          cd "$P4A_DIR"

          git rev-parse --short HEAD || true

          python - <<'PY'
          import pythonforandroid
          print(
              "python-for-android:",
              getattr(
                  pythonforandroid,
                  "__version__",
                  "unknown"
              )
          )
          PY

      # ==========================================================
      # 24 - VERIFY NO PYTHON 3.14 BUILD VENV EXISTS
      # ==========================================================
      - name: 24 - Verify p4a build environment before build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_ROOT=".buildozer/android/platform"

          echo "Searching for Python 3.14 inside build tree..."

          if find "$BUILD_ROOT" \
            -type d \
            -path '*lib/python3.14*' \
            -print \
            | grep -q .; then

            echo "ERROR: Python 3.14 detected before final build."

            find "$BUILD_ROOT" \
              -type d \
              -path '*lib/python3.14*' \
              -print

            exit 1
          fi

          echo "No Python 3.14 build environment detected."

      # ==========================================================
      # 25 - BUILD DEBUG APK
      #
      # Explicit clean build.
      # ==========================================================
      - name: 25 - Build Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROIDNDK: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        shell: bash
        run: |
          set -euxo pipefail

          source "$RUNNER_TEMP/moneytracker-venv/bin/activate"

          echo "========================================"
          echo "FINAL APK BUILD"
          echo "========================================"

          python --version

          buildozer -v \
            --stacktrace \
            --log_level=2 \
            android debug

      # ==========================================================
      # 26 - FIND APK/AAB
      # ==========================================================
      - name: 26 - Locate Android artifacts
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID ARTIFACTS"
          echo "========================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # ==========================================================
      # 27 - UPLOAD APK
      # ==========================================================
      - name: 27 - Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Android-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 28 - UPLOAD AAB IF PRESENT
      # ==========================================================
      - name: 28 - Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Android-AAB
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # ==========================================================
      # 29 - FAILURE DIAGNOSTICS
      # ==========================================================
      - name: 29 - Collect build diagnostics
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "========================================"

          echo
          echo "HOST PYTHON:"
          "$RUNNER_TEMP/moneytracker-venv/bin/python" --version

          echo
          echo "BUILDOZER:"
          "$RUNNER_TEMP/moneytracker-venv/bin/buildozer" --version

          echo
          echo "SPEC REQUIREMENTS:"
          grep -E '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec || true

          echo
          echo "ANDROID NDK:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "PYTHON 3.14 DIRECTORIES:"
          find .buildozer \
            -type d \
            -path '*lib/python3.14*' \
            -print 2>/dev/null || true

          echo
          echo "PYTHON 3.11 DIRECTORIES:"
          find .buildozer \
            -type d \
            -path '*lib/python3.11*' \
            -print 2>/dev/null || true

          echo
          echo "RECENT BUILD ERRORS:"
          grep -RniE \
            "BuildDependencyInstallError|ImportError|Traceback|Error code|FAILED|error:" \
            .buildozer/android/platform 2>/dev/null \
            | tail -n 300 || true

      # ==========================================================
      # 30 - UPLOAD BUILDOZER LOGS ON FAILURE
      # ==========================================================
      - name: 30 - Upload Buildozer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/.buildozer
            ${{ env.PROJECT_DIR }}/buildozer.spec
            ${{ env.PROJECT_DIR }}/buildozer.spec.before-python-fix
          if-no-files-found: ignore
          retention-days: 7