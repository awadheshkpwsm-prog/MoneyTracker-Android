name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # PYTHON 3.11
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      # ============================================================
      # PYTHON BUILD TOOLS
      # ============================================================
      - name: Install Buildozer and Cython
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36


      # ============================================================
      # SHOW VERSIONS
      # ============================================================
      - name: Show build environment
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Java:"
          java -version

          echo "=========================================="


      # ============================================================
      # PREPARE BUILDOZER DIRECTORY
      # ============================================================
      - name: Prepare Buildozer directory
        run: |
          set -e

          rm -rf "$HOME/.buildozer"

          mkdir -p "$HOME/.buildozer/android/platform"


      # ============================================================
      # INSTALL ANDROID SDK
      #
      # Buildozer 1.5 searches for:
      #
      # android-sdk/tools/bin/sdkmanager
      #
      # Therefore we create a REAL compatibility directory.
      # ============================================================
      - name: Install Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK"

          cd "$SDK"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          mkdir -p cmdline-tools

          unzip -q commandlinetools.zip -d cmdline-tools

          mv \
            cmdline-tools/cmdline-tools \
            cmdline-tools/latest

          rm -f commandlinetools.zip

          # --------------------------------------------------------
          # Buildozer compatibility path
          # --------------------------------------------------------

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools"

          cp -a \
            "$SDK/cmdline-tools/latest/." \
            "$SDK/tools/"

          chmod +x "$SDK/tools/bin/sdkmanager"

          touch "$SDK/repositories.cfg"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Checking sdkmanager..."

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version


      # ============================================================
      # ACCEPT LICENSES
      # ============================================================
      - name: Accept Android licenses
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true


      # ============================================================
      # INSTALL ANDROID PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "=========================================="
          echo "INSTALLING ANDROID PACKAGES"
          echo "=========================================="

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true


      # ============================================================
      # SDK VERIFICATION
      # ============================================================
      - name: Verify Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "SDK Manager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Installed SDK packages:"
          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "Build Tools:"
          ls -lah "$SDK/build-tools"

          echo ""
          echo "Build Tools 33.0.2:"
          ls -lah "$SDK/build-tools/33.0.2"

          echo ""
          echo "Checking AIDL:"
          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "AIDL found."

          echo ""
          echo "Checking Android platform:"
          test -d "$SDK/platforms/android-33"

          echo "Android 33 platform found."

          echo ""
          echo "SDK verification completed successfully."


      # ============================================================
      # EXPORT ANDROID ENVIRONMENT
      # ============================================================
      - name: Configure Android environment
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # ============================================================
      # VERIFY MONEYTRACKER PROJECT
      # ============================================================
      - name: Verify MoneyTracker project
        run: |
          set -e

          echo "=========================================="
          echo "MONEYTRACKER PROJECT CHECK"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "buildozer.spec:"
          test -f buildozer.spec

          echo "buildozer.spec found."

          echo ""
          echo "main.py:"
          test -f main.py

          echo "main.py found."

          echo ""
          echo "mt directory:"
          test -d mt

          echo "mt directory found."

          echo ""
          echo "MT files:"
          find mt -maxdepth 2 -type f | sort


      # ============================================================
      # CLEAN OLD BUILDS
      # ============================================================
      - name: Clean previous Buildozer output
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          echo "Previous Buildozer output cleaned."


      # ============================================================
      # RESTORE ANDROID ENVIRONMENT
      # ============================================================
      - name: Restore Android environment
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          test -x "$SDK/tools/bin/sdkmanager"


      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build MoneyTracker APK
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ============================================================
      # SEARCH APK
      # ============================================================
      - name: Search for APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo ""
          echo "APK/AAB files:"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
