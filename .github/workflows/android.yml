name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:

      # --------------------------------------------------
      # CHECKOUT PROJECT
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # JAVA 17
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # PYTHON 3.11
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # LINUX DEPENDENCIES
      # --------------------------------------------------

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake


      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # PREPARE ANDROID SDK
      # --------------------------------------------------

      - name: Prepare Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true


      # --------------------------------------------------
      # INSTALL REQUIRED ANDROID PACKAGES
      # --------------------------------------------------

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"


      # --------------------------------------------------
      # VERIFY ANDROID SDK
      # --------------------------------------------------

      - name: Verify Android SDK
        run: |
          echo "======================================"
          echo "ANDROID SDK INFORMATION"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed SDK Packages:"
          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --list_installed || true

          echo ""
          echo "======================================"
          echo "BUILD TOOLS 33.0.2"
          echo "======================================"

          ls -lah \
            "$ANDROID_HOME/build-tools/33.0.2"

          echo ""
          echo "======================================"
          echo "CHECK AIDL"
          echo "======================================"

          test -x \
            "$ANDROID_HOME/build-tools/33.0.2/aidl"

          "$ANDROID_HOME/build-tools/33.0.2/aidl" \
            --help >/dev/null

          echo "AIDL executable OK"

          echo ""
          echo "Android SDK 33 verified"
          echo "Build Tools 33.0.2 verified"


      # --------------------------------------------------
      # PYTHON BUILD DEPENDENCIES
      # --------------------------------------------------

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install "Cython<3"

          pip install buildozer==1.5.0


      # --------------------------------------------------
      # CLEAN OLD BUILD
      # --------------------------------------------------

      - name: Clean Build Cache
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------
      # ACCEPT ANDROID LICENSES
      # --------------------------------------------------

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true


      # --------------------------------------------------
      # SHOW BUILD CONFIGURATION
      # --------------------------------------------------

      - name: Show Build Configuration
        run: |
          echo "======================================"
          echo "BUILD CONFIGURATION"
          echo "======================================"

          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Android Platform:"
          ls -lah "$ANDROID_HOME/platforms/android-33"

          echo ""
          echo "Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools/33.0.2"


      # --------------------------------------------------
      # BUILD APK
      # --------------------------------------------------

      - name: Build APK
        run: |
          buildozer -v android debug


      # --------------------------------------------------
      # CHECK APK
      # --------------------------------------------------

      - name: Check APK Output
        if: always()
        run: |
          echo "======================================"
          echo "APK OUTPUT"
          echo "======================================"

          ls -lah bin || true

          echo ""
          echo "APK FILES:"
          find bin -maxdepth 1 -type f -name "*.apk" -print || true


      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
