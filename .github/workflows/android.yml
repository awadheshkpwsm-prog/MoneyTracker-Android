name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  BUILDOZER_VERSION: "1.6.0"
  CYTHON_VERSION: "0.29.34"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:

  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11.13
      # ============================================================

      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. LINUX BUILD DEPENDENCIES
      # ============================================================

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            libltdl-dev \
            ccache


      # ============================================================
      # 5. INSTALL BUILDOZER
      #
      # IMPORTANT:
      #
      # We install Buildozer only.
      #
      # We do NOT manually install:
      # - Android SDK
      # - Android Build Tools
      # - Android NDK
      # - python-for-android
      #
      # Buildozer/p4a will manage those according to buildozer.spec.
      # ============================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<25" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}" \
            "buildozer==${BUILDOZER_VERSION}"

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          python --version
          python -m pip --version
          buildozer --version


      # ============================================================
      # 6. LOCATE BUILDOZER PROJECT
      # ============================================================

      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "========================================"
          echo "BUILDOZER PROJECT"
          echo "========================================"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/buildozer.spec"


      # ============================================================
      # 7. VERIFY SPEC
      # ============================================================

      - name: Verify buildozer.spec
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"

          pwd

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          ls -lah

          echo "========================================"
          echo "ANDROID CONFIGURATION"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.accept_sdk_license|android\.archs|p4a\.bootstrap' \
            buildozer.spec

          echo "========================================"
          echo "BUILD TOOLS REQUESTED BY SPEC"
          echo "========================================"

          grep -n \
            'android.build_tools_version' \
            buildozer.spec

          echo "========================================"
          echo "NDK REQUESTED BY SPEC"
          echo "========================================"

          grep -n \
            'android.ndk' \
            buildozer.spec


      # ============================================================
      # 8. SHOW BUILDOZER GLOBAL DIRECTORY BEFORE BUILD
      # ============================================================

      - name: Inspect Buildozer environment
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "HOME"
          echo "========================================"

          echo "$HOME"

          echo "========================================"
          echo "BUILDOZER DIRECTORY"
          echo "========================================"

          if [ -d "$HOME/.buildozer" ]; then
            find "$HOME/.buildozer" \
              -maxdepth 6 \
              -type d \
              | sort \
              | head -500
          else
            echo "No existing .buildozer directory."
          fi


      # ============================================================
      # 9. PREPARE ANDROID ENVIRONMENT
      #
      # IMPORTANT:
      #
      # Buildozer owns the Android SDK/NDK installation.
      #
      # No ANDROID_HOME is forced to another SDK.
      # No build-tools version is manually installed.
      # No NDK version is manually installed.
      #
      # buildozer.spec is the source of truth.
      #
      # android.accept_sdk_license = True handles licenses.
      # ============================================================

      - name: Prepare Buildozer Android environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "PREPARING BUILDOZER ANDROID ENVIRONMENT"
          echo "========================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "========================================"
          echo "ANDROID CONFIG FROM SPEC"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.accept_sdk_license' \
            buildozer.spec

          echo "========================================"
          echo "P4A HELP / PREREQUISITE INITIALIZATION"
          echo "========================================"

          buildozer android p4a -- --help


      # ============================================================
      # 10. INSPECT SDK AFTER PREPARATION
      # ============================================================

      - name: Inspect prepared Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "BUILDOZER SDK"
          echo "========================================"

          echo "SDK=$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Buildozer SDK was not created."
            exit 1
          fi

          echo "========================================"
          echo "SDK DIRECTORIES"
          echo "========================================"

          find "$SDK" \
            -maxdepth 4 \
            -type d \
            | sort \
            | head -500

          echo "========================================"
          echo "BUILD TOOLS DIRECTORIES"
          echo "========================================"

          find "$SDK/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            2>/dev/null \
            | sort \
            || true

          echo "========================================"
          echo "NDK DIRECTORIES"
          echo "========================================"

          find "$SDK/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            2>/dev/null \
            | sort \
            || true


      # ============================================================
      # 11. VERIFY REQUESTED BUILD TOOLS DYNAMICALLY
      #
      # We read the version directly from buildozer.spec.
      #
      # Nothing is hard-coded as 33 or 37 in this step.
      # ============================================================

      - name: Verify requested Build Tools
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          BUILD_TOOLS_VERSION="$(
            sed -n \
              's/^[[:space:]]*android\.build_tools_version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec \
              | head -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: android.build_tools_version not found."
            exit 1
          fi

          BUILD_TOOLS="$SDK/build-tools/$BUILD_TOOLS_VERSION"

          echo "========================================"
          echo "BUILD TOOLS REQUESTED BY SPEC"
          echo "========================================"

          echo "VERSION=$BUILD_TOOLS_VERSION"
          echo "PATH=$BUILD_TOOLS"

          test -d "$BUILD_TOOLS"

          echo "========================================"
          echo "AIDL"
          echo "========================================"

          test -x "$BUILD_TOOLS/aidl"

          "$BUILD_TOOLS/aidl" --version || true

          echo "========================================"
          echo "AAPT2"
          echo "========================================"

          test -x "$BUILD_TOOLS/aapt2"

          "$BUILD_TOOLS/aapt2" version || true

          echo "========================================"
          echo "ZIPALIGN"
          echo "========================================"

          test -x "$BUILD_TOOLS/zipalign"

          echo "zipalign OK"

          echo "Requested Build Tools are installed and usable."


      # ============================================================
      # 12. VERIFY SDK PLATFORM DYNAMICALLY
      # ============================================================

      - name: Verify Android API
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          ANDROID_API="$(
            sed -n \
              's/^[[:space:]]*android\.api[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec \
              | head -n 1
          )"

          if [ -z "$ANDROID_API" ]; then
            echo "ERROR: android.api not found."
            exit 1
          fi

          PLATFORM="$SDK/platforms/android-$ANDROID_API"

          echo "========================================"
          echo "ANDROID API"
          echo "========================================"

          echo "API=$ANDROID_API"
          echo "PLATFORM=$PLATFORM"

          test -d "$PLATFORM"

          echo "Android API platform is installed."


      # ============================================================
      # 13. VERIFY NDK DYNAMICALLY
      #
      # We do NOT hard-code r25b or 28.2.13676358.
      #
      # Buildozer/p4a is responsible for resolving android.ndk = 28c.
      # ============================================================

      - name: Verify resolved Android NDK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "NDK DIRECTORIES"
          echo "========================================"

          find "$SDK/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            2>/dev/null \
            | sort \
            || true

          echo "========================================"
          echo "SEARCHING FOR NDK source.properties"
          echo "========================================"

          NDK_FILE="$(
            find "$SDK/ndk" \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name "source.properties" \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "$NDK_FILE" ]; then
            echo "ERROR: No resolved Android NDK was found."
            exit 1
          fi

          echo "NDK metadata:"
          echo "$NDK_FILE"

          cat "$NDK_FILE"


      # ============================================================
      # 14. FINAL ANDROID ENVIRONMENT
      # ============================================================

      - name: Final Android environment check
        shell: bash
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "FINAL ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID SDK:"
          echo "$SDK"

          test -d "$SDK"

          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          SDKMANAGER="$(
            find "$SDK" \
              -type f \
              -name "sdkmanager" \
              -perm -111 \
              2>/dev/null \
              | head -n 1
          )"

          if [ -n "$SDKMANAGER" ]; then
            echo "$SDKMANAGER"
            "$SDKMANAGER" --version || true
          else
            echo "sdkmanager executable not found in SDK."
          fi

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          find "$SDK/build-tools" \
            -maxdepth 2 \
            -type f \
            -name "aidl" \
            -print \
            2>/dev/null \
            || true

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version


      # ============================================================
      # 15. BUILD APK
      #
      # No manual SDK/NDK/build-tools installation here.
      # Buildozer uses buildozer.spec.
      # ============================================================

      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "START MONEYTRACKER APK BUILD"
          echo "========================================"

          echo "Project:"
          pwd

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.accept_sdk_license|android\.archs|p4a\.bootstrap' \
            buildozer.spec

          echo "========================================"
          echo "BUILDING"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 16. FIND GENERATED APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "========================================"
            echo "BIN DIRECTORY"
            echo "========================================"

            ls -lah bin || true

            echo "========================================"
            echo "BUILD OUTPUT"
            echo "========================================"

            find .buildozer \
              -maxdepth 5 \
              -type f \
              2>/dev/null \
              | tail -200 \
              || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"
          ls -lh "$APK_FILE"


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================

      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 18. SUCCESS
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Artifact:"
          echo "MoneyTracker-APK"