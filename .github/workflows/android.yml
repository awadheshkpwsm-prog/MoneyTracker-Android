name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  BUILDOZER_VERSION: "1.6.0"
  CYTHON_VERSION: "0.29.34"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:

  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11.13
      # ============================================================

      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. LINUX BUILD DEPENDENCIES
      # ============================================================

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            libltdl-dev \
            ccache


      # ============================================================
      # 5. INSTALL CYTHON + BUILDOZER
      #
      # python-for-android is NOT separately pinned here.
      #
      # Buildozer/p4a dependency handling remains in control.
      # ============================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<25" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}" \
            "buildozer==${BUILDOZER_VERSION}"

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version


      # ============================================================
      # 6. LOCATE BUILDOZER PROJECT
      # ============================================================

      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "========================================"
          echo "BUILDOZER PROJECT"
          echo "========================================"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/buildozer.spec"


      # ============================================================
      # 7. VERIFY SPEC
      #
      # The spec is the source of truth.
      # ============================================================

      - name: Verify buildozer.spec
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd
          ls -lah

          echo "========================================"
          echo "ANDROID CONFIGURATION"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.accept_sdk_license|android\.archs|p4a\.bootstrap' \
            buildozer.spec

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          grep -n \
            'android.build_tools_version' \
            buildozer.spec

          echo "========================================"
          echo "NDK"
          echo "========================================"

          grep -n \
            'android.ndk' \
            buildozer.spec


      # ============================================================
      # 8. VERIFY BUILD CONFIGURATION
      #
      # Do not override Android SDK/NDK versions here.
      # ============================================================

      - name: Verify build configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "========================================"
          echo "SPEC"
          echo "========================================"

          cat buildozer.spec


      # ============================================================
      # 9. BUILD
      #
      # IMPORTANT:
      #
      # Buildozer is responsible for preparing the Android
      # environment according to buildozer.spec.
      #
      # No manual:
      #   - Build Tools 33
      #   - Build Tools 37
      #   - NDK version
      #   - sdkmanager package installation
      #   - Android SDK replacement
      #
      # is performed here.
      #
      # android.accept_sdk_license = True in the spec allows
      # non-interactive license acceptance.
      # ============================================================

      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "MONEYTRACKER ANDROID BUILD"
          echo "========================================"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "SPEC ANDROID SETTINGS"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.accept_sdk_license|android\.archs|p4a\.bootstrap' \
            buildozer.spec

          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 10. INSPECT BUILDOZER SDK AFTER BUILD
      #
      # This happens AFTER Buildozer has had the opportunity to
      # create/install its required Android components.
      # ============================================================

      - name: Inspect Android environment after build
        shell: bash
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "BUILDOZER SDK"
          echo "========================================"

          echo "SDK=$SDK"

          if [ -d "$SDK" ]; then

            echo "========================================"
            echo "BUILD TOOLS"
            echo "========================================"

            find "$SDK/build-tools" \
              -maxdepth 2 \
              -type f \
              -name "aidl" \
              -print \
              2>/dev/null \
              || true

            echo "========================================"
            echo "NDK"
            echo "========================================"

            find "$SDK/ndk" \
              -maxdepth 2 \
              -type f \
              -name "source.properties" \
              -print \
              2>/dev/null \
              || true

          else
            echo "Buildozer SDK directory not found at:"
            echo "$SDK"

            echo "This does not automatically mean the APK build failed."
            echo "The actual build result is checked in the next step."

          fi


      # ============================================================
      # 11. FIND APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "========================================"
            echo "BIN DIRECTORY"
            echo "========================================"

            ls -lah bin || true

            echo "========================================"
            echo "BUILDOZER BUILD DIRECTORY"
            echo "========================================"

            find .buildozer \
              -maxdepth 6 \
              -type f \
              2>/dev/null \
              | tail -300 \
              || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"
          ls -lh "$APK_FILE"


      # ============================================================
      # 12. APK INFORMATION
      # ============================================================

      - name: Show APK information
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          test -n "$APK_FILE"

          echo "========================================"
          echo "APK"
          echo "========================================"

          echo "File:"
          echo "$APK_FILE"

          echo "Size:"
          ls -lh "$APK_FILE"

          echo "SHA256:"
          sha256sum "$APK_FILE"


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================

      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 14. SUCCESS
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Artifact:"
          echo "MoneyTracker-APK"