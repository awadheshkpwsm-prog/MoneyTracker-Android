name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    name: Build MoneyTracker Android APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # IMPORTANT:
      # No Gradle cache because this is a Buildozer project.
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false


      # ==========================================================
      # PYTHON 3.11
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          check-latest: false
          


      # ==========================================================
      # SYSTEM DEPENDENCIES
      # ==========================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            liblzma-dev \
            gettext \
            autopoint


      # ==========================================================
      # PYTHON BUILD TOOLS
      # ==========================================================
      - name: Install Python build tools
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "INSTALLING PYTHON BUILD TOOLS"
          echo "=========================================="

          python --version
          python -m pip --version

          python -m pip install \
            "pip<26" \
            "setuptools<81" \
            wheel \
            "Cython==0.29.34" \
            "buildozer==1.6.0"

          python -m pip check


      # ==========================================================
      # VERIFY PYTHON / CYTHON / BUILDOZER
      # ==========================================================
      - name: Verify Python build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "PYTHON BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version
          which python

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version


      # ==========================================================
      # INSTALL ANDROID SDK
      # ==========================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip \
            -d "$SDK/cmdline-tools"

          rm -f commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          # ------------------------------------------------------
          # Buildozer compatibility path
          # ------------------------------------------------------

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools"

          cp -a \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/"

          cp -a \
            "$SDK/cmdline-tools/latest/lib" \
            "$SDK/tools/"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          chmod +x \
            "$SDK/tools/bin/sdkmanager"

          touch "$SDK/repositories.cfg"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools:$SDK/build-tools/33.0.2:$PATH" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"

          echo ""
          echo "sdkmanager version:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ==========================================================
      # ACCEPT ANDROID LICENSES
      # ==========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true


      # ==========================================================
      # INSTALL ANDROID SDK PACKAGES
      # ==========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true


      # ==========================================================
      # VERIFY ANDROID SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed packages:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "Checking Android 33 platform:"

          test -d "$SDK/platforms/android-33"

          echo "Android 33 platform OK"

          echo ""
          echo "Checking Build Tools 33.0.2:"

          test -d "$SDK/build-tools/33.0.2"

          ls -lah "$SDK/build-tools/33.0.2"

          echo ""
          echo "Checking AIDL:"

          test -x "$SDK/build-tools/33.0.2/aidl"

          "$SDK/build-tools/33.0.2/aidl" \
            --help >/dev/null

          echo "AIDL OK"

          echo ""
          echo "Checking AAPT2:"

          test -x "$SDK/build-tools/33.0.2/aapt2"

          echo "AAPT2 OK"

          echo ""
          echo "Checking D8:"

          test -x "$SDK/build-tools/33.0.2/d8"

          echo "D8 OK"

          echo ""
          echo "Checking ZIPALIGN:"

          test -x "$SDK/build-tools/33.0.2/zipalign"

          echo "ZIPALIGN OK"


      # ==========================================================
      # CONFIGURE ANDROID ENVIRONMENT
      # ==========================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"

          # ------------------------------------------------------
          # Use Android NDK r28c with Buildozer/p4a
          # ------------------------------------------------------

          echo "ANDROIDNDK=28c" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r28c" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r28c" >> "$GITHUB_ENV"

          echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools:$SDK/build-tools/33.0.2:$PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # VERIFY MONEYTRACKER PROJECT
      # ==========================================================
      - name: Verify MoneyTracker project
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "MONEYTRACKER PROJECT CHECK"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -lah

          echo ""
          echo "Checking buildozer.spec:"

          test -f buildozer.spec

          echo "buildozer.spec FOUND"

          echo ""
          echo "Checking main.py:"

          test -f main.py

          echo "main.py FOUND"

          echo ""
          echo "Checking mt directory:"

          test -d mt

          echo "mt directory FOUND"

          echo ""
          echo "=========================================="
          echo "BUILDOZER.SPEC"
          echo "=========================================="

          cat buildozer.spec


      # ==========================================================
      # CLEAN OLD BUILDOZER / P4A STATE
      #
      # IMPORTANT FIX:
      # Removes stale internal venv/pip state.
      # ==========================================================
      - name: Clean Buildozer and p4a build state
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CLEANING BUILDOZER BUILD STATE"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer

          echo ""
          echo "Buildozer directory cleaned."

          echo ""
          echo "Checking for stale virtual environments:"

          if find .buildozer \
            -type d \
            -name "venv" \
            -print \
            -quit | grep -q .; then

            echo "ERROR: stale venv still exists!"
            exit 1

          fi

          echo "No stale venv found."


      # ==========================================================
      # PREFLIGHT CHECK
      # ==========================================================
      - name: Preflight build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "FINAL PREFLIGHT CHECK"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version
          which python

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "ANDROIDAPI:"
          echo "$ANDROIDAPI"

          echo ""
          echo "ANDROIDMINAPI:"
          echo "$ANDROIDMINAPI"

          echo ""
          echo "ANDROIDNDK:"
          echo "$ANDROIDNDK"

          echo ""
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "ANDROID_NDK_ROOT:"
          echo "$ANDROID_NDK_ROOT"

          echo ""
          echo "Checking Android platform:"
          test -d "$ANDROID_HOME/platforms/android-33"

          echo "Android platform OK"

          echo ""
          echo "Checking Build Tools:"
          test -d "$ANDROID_HOME/build-tools/33.0.2"

          echo "Build Tools OK"

          echo ""
          echo "Checking AIDL:"
          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "AIDL OK"

          echo ""
          echo "Checking Java:"
          test -n "$JAVA_HOME"

          echo "JAVA_HOME=$JAVA_HOME"

          echo ""
          echo "PATH:"
          echo "$PATH"


      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Build MoneyTracker APK
        shell: bash
        env:
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Android API:"
          echo "$ANDROIDAPI"

          echo ""
          echo "Android Minimum API:"
          echo "$ANDROIDMINAPI"

          echo ""
          echo "Android NDK:"
          echo "$ANDROIDNDK"

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Starting clean Buildozer build..."

          buildozer -v android debug


      # ==========================================================
      # SEARCH APK / AAB
      # ==========================================================
      - name: Search for APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo ""
          echo "Searching for APK/AAB files..."

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print || true

          echo ""
          echo "bin directory:"

          if [ -d bin ]; then
            ls -lah bin
          else
            echo "bin directory does not exist."
          fi


      # ==========================================================
      # UPLOAD APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error
          compression-level: 6
          overwrite: true


      # ==========================================================
      # UPLOAD BUILDOZER LOGS
      # ==========================================================
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/**
          if-no-files-found: warn
          compression-level: 6
          overwrite: true
          include-hidden-files: true
