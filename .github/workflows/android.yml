name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  BUILDOZER_VERSION: "1.6.0"
  CYTHON_VERSION: "0.29.34"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:

  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11.13
      # ============================================================

      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. LINUX DEPENDENCIES
      # ============================================================

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            lbzip2 \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache \
            patch


      # ============================================================
      # 5. INSTALL BUILDOZER
      #
      # Do NOT separately pin python-for-android.
      #
      # Buildozer/p4a dependency resolution is left intact.
      # ============================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<25" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}" \
            "buildozer==${BUILDOZER_VERSION}"

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "P4A LOCATION IF PRESENT"
          echo "========================================"

          command -v p4a || true
          p4a --version || true


      # ============================================================
      # 6. LOCATE PROJECT
      # ============================================================

      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/buildozer.spec"


      # ============================================================
      # 7. VERIFY SPEC
      # ============================================================

      - name: Verify buildozer.spec
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          pwd
          ls -lah

          echo "========================================"
          echo "ANDROID SETTINGS FROM SPEC"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.accept_sdk_license|android\.archs|p4a\.bootstrap' \
            buildozer.spec \
            || true

          echo "========================================"
          echo "COMPLETE SPEC"
          echo "========================================"

          cat buildozer.spec


      # ============================================================
      # 8. CLEAN ONLY PROJECT BUILD CACHE
      #
      # IMPORTANT:
      #
      # Do NOT delete ~/.buildozer Android SDK here.
      # Buildozer owns and manages that SDK.
      # ============================================================

      - name: Clean project Buildozer cache
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer

          mkdir -p bin

          echo "========================================"
          echo "PROJECT BUILD CACHE CLEANED"
          echo "========================================"

          echo "Source files preserved."
          echo "Buildozer global Android environment was NOT deleted."


      # ============================================================
      # 9. REMOVE ONLY CONFLICTING EXTERNAL ANDROID VARIABLES
      #
      # GitHub hosted runners can expose their own Android SDK/NDK.
      #
      # We do not use those locations.
      #
      # Buildozer will use its own Android environment.
      # ============================================================

      - name: Isolate Buildozer Android environment
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BEFORE ISOLATION"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROIDSDK=${ANDROIDSDK:-}"
          echo "ANDROID_NDK=${ANDROID_NDK:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-}"
          echo "ANDROIDNDK=${ANDROIDNDK:-}"

          # Remove runner-provided Android locations.
          #
          # We are NOT deleting the runner's files.
          # We are only preventing them from being selected
          # through environment variables.

          echo "ANDROID_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=" >> "$GITHUB_ENV"

          echo "========================================"
          echo "EXTERNAL ANDROID VARIABLES ISOLATED"
          echo "========================================"


      # ============================================================
      # 10. BUILDOZER ANDROID BUILD
      #
      # IMPORTANT:
      #
      # No sdkmanager package is manually installed here.
      #
      # No Build Tools version is forced here.
      #
      # No NDK version is forced here.
      #
      # The buildozer.spec is the source of truth.
      # ============================================================

      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "MONEYTRACKER BUILD"
          echo "========================================"

          echo "Project:"
          pwd

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "ANDROID ENVIRONMENT BEFORE BUILDOZER"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROIDSDK=${ANDROIDSDK:-}"

          echo "ANDROID_NDK=${ANDROID_NDK:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-}"
          echo "ANDROIDNDK=${ANDROIDNDK:-}"

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.build_tools_version|android\.accept_sdk_license|android\.archs|p4a\.bootstrap' \
            buildozer.spec \
            || true

          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 11. INSPECT BUILDOZER ENVIRONMENT AFTER BUILD
      #
      # This is informational only.
      # It does NOT fail the build if a particular directory
      # is absent after a successful APK build.
      # ============================================================

      - name: Inspect Buildozer Android environment
        if: always()
        shell: bash
        run: |
          set -u

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "BUILDOZER SDK"
          echo "========================================"

          echo "SDK=$SDK"

          if [ -d "$SDK" ]; then

            echo "SDK exists."

            echo "========================================"
            echo "SDK DIRECTORIES"
            echo "========================================"

            find "$SDK" \
              -maxdepth 2 \
              -type d \
              2>/dev/null \
              | sort \
              | head -300 \
              || true

            echo "========================================"
            echo "BUILD TOOLS"
            echo "========================================"

            find "$SDK/build-tools" \
              -maxdepth 2 \
              -type d \
              2>/dev/null \
              | sort \
              || true

            echo "========================================"
            echo "AIDL"
            echo "========================================"

            find "$SDK/build-tools" \
              -type f \
              -name "aidl" \
              -print \
              2>/dev/null \
              || true

            echo "========================================"
            echo "NDK"
            echo "========================================"

            find "$SDK/ndk" \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name "source.properties" \
              -print \
              2>/dev/null \
              || true

          else

            echo "Buildozer SDK directory not found:"
            echo "$SDK"

          fi


      # ============================================================
      # 12. SEARCH FOR APK
      # ============================================================

      - name: Verify generated APK
        if: success()
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "========================================"
            echo "BIN"
            echo "========================================"

            ls -lah bin || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"
          ls -lh "$APK_FILE"


      # ============================================================
      # 13. APK SHA256
      # ============================================================

      - name: Calculate APK SHA256
        if: success()
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          test -n "$APK_FILE"

          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          sha256sum "$APK_FILE"


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================

      - name: Upload MoneyTracker APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 15. SUCCESS
      # ============================================================

      - name: Build complete
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Artifact:"
          echo "MoneyTracker-APK"