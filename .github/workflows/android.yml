name: Build Money Tracker Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      # ======================================================
      # ANDROID TARGET
      # ======================================================
      ANDROID_API: "33"
      ANDROID_MIN_API: "21"
      ANDROID_BUILD_TOOLS: "33.0.2"

      # NDK r28c = 28.2.13676358
      ANDROID_NDK_VERSION: "28.2.13676358"

      # ======================================================
      # BUILDOZER
      # ======================================================
      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. PYTHON 3.11.13
      # ======================================================
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      # ======================================================
      # 3. JAVA 17
      # ======================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ======================================================
      # 4. SYSTEM DEPENDENCIES
      # ======================================================
      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            libsqlite3-dev

      # ======================================================
      # 5. VERIFY PYTHON / JAVA
      # ======================================================
      - name: Verify Python and Java
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python3 --version
          which python
          which python3

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

          echo "========================================"
          echo "ANDROID TARGET"
          echo "========================================"

          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"

      # ======================================================
      # 6. INSTALL BUILDOZER
      # ======================================================
      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<26" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.34" \
            "sh"

      # ======================================================
      # 7. VERIFY BUILDOZER
      # ======================================================
      - name: Verify Buildozer
        run: |
          set -eux

          buildozer --version

          python -c "import Cython; print('Cython:', Cython.__version__)"

          python -c "import buildozer; print('Buildozer:', buildozer.__version__)"

      # ======================================================
      # 8. INSTALL EXACT ANDROID SDK COMPONENTS
      #
      # ONLY:
      #   API 33
      #   BUILD TOOLS 33.0.2
      #   PLATFORM TOOLS
      #
      # DO NOT INSTALL BUILD TOOLS 37
      # ======================================================
      - name: Install exact Android SDK
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      # ======================================================
      # 9. INSTALL EXACT NDK r28c
      # ======================================================
      - name: Install Android NDK r28c
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "ndk;28.2.13676358"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "========================================"
          echo "NDK"
          echo "========================================"

          cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      # ======================================================
      # 10. CONFIGURE ANDROID ENVIRONMENT
      # ======================================================
      - name: Configure Android environment
        run: |
          set -eux

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # ======================================================
      # 11. VERIFY ANDROID SDK
      # ======================================================
      - name: Verify Android SDK
        run: |
          set -eux

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "========================================"
          echo "BUILD TOOLS 33.0.2"
          echo "========================================"

          ls -lah "$ANDROID_HOME/build-tools/33.0.2"

          echo "========================================"
          echo "AIDL"
          echo "========================================"

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          # DO NOT USE:
          # aidl --version
          #
          # Build-Tools 33 AIDL does not support that test.
          #
          # Instead only verify that the executable exists.
          file "$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "AIDL executable exists."

      # ======================================================
      # 12. VERIFY NDK
      # ======================================================
      - name: Verify NDK
        run: |
          set -eux

          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          test -d "$NDK"

          echo "========================================"
          echo "NDK SOURCE.PROPERTIES"
          echo "========================================"

          cat "$NDK/source.properties"

          echo "========================================"
          echo "NDK TOOLCHAIN"
          echo "========================================"

          test -d "$NDK/toolchains/llvm"

      # ======================================================
      # 13. VERIFY BUILDOZER SPEC
      # ======================================================
      - name: Verify buildozer.spec
        run: |
          set -eux

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOVER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "CHECK REQUIRED SETTINGS"
          echo "========================================"

          grep -E \
            'android.api|android.minapi|android.ndk|android.ndk_api|android.build_tools_version|android.archs|requirements' \
            buildozer.spec

          echo "========================================"
          echo "CHECK FOR FORCED BUILD-TOOLS 37"
          echo "========================================"

          if grep -R \
            -E 'build-tools;37|build-tools/37|build_tools_version *= *37|android.build_tools_version *= *37' \
            buildozer.spec .github/workflows; then

            echo "ERROR: BUILD-TOOLS 37 REFERENCE FOUND."
            exit 1
          fi

          echo "No Build-Tools 37 reference found."

      # ======================================================
      # 14. CLEAN PROJECT BUILDOZER CACHE
      #
      # IMPORTANT:
      # Do this BEFORE Buildozer starts.
      # ======================================================
      - name: Clean project Buildozer state
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer
          mkdir -p bin

      # ======================================================
      # 15. BUILD
      #
      # Buildozer will use:
      #
      # API        33
      # BuildTools 33.0.2
      # NDK        r28c
      #
      # ======================================================
      - name: Build Android APK
        run: |
          set -eux

          export BUILDOZER_WARN_ON_ROOT=0

          buildozer -v android debug

      # ======================================================
      # 16. SEARCH APK
      # ======================================================
      - name: Find APK
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "APK / AAB SEARCH"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print

          echo ""
          echo "AAB files:"
          find . -type f -name "*.aab" -print

          echo ""
          echo "bin directory:"
          ls -lah bin 2>/dev/null || true

          echo ""
          echo "Buildozer directory:"
          ls -lah .buildozer 2>/dev/null || true

      # ======================================================
      # 17. UPLOAD APK
      # ======================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error

      # ======================================================
      # 18. UPLOAD BUILDOZER LOGS ON FAILURE
      # ======================================================
      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/
          if-no-files-found: warn
