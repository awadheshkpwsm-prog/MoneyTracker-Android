name: Money Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"

      ANDROID_API: "33"
      ANDROID_MIN_API: "21"
      ANDROID_BUILD_TOOLS: "33.0.2"

      ANDROID_NDK_VERSION: "28.2.13676358"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON 3.11
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          check-latest: false
          cache: ""


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # ============================================================
      # PYTHON BUILD DEPENDENCIES
      # ============================================================

      - name: Install Python build dependencies
        run: |
          set -eux

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          python -m pip install \
            "Cython==0.29.34" \
            "virtualenv" \
            "buildozer==1.6.0"

          python -m pip install \
            "sh>=2,<3" \
            appdirs \
            colorama \
            jinja2 \
            meson \
            ninja \
            toml \
            packaging \
            "setuptools" \
            wheel


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # ANDROID ENVIRONMENT
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "ANDROID SDK ENVIRONMENT"
          echo "========================================"

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ============================================================
      # INSTALL EXACT SDK COMPONENTS
      # ============================================================

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "========================================"
          echo "VERIFY SDK"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "Android API 33: OK"
          echo "Build Tools 33.0.2: OK"


      # ============================================================
      # FORCE BUILDOZER LEGACY SDKMANAGER PATH
      # ============================================================
      #
      # Buildozer 1.6.0 still checks:
      #
      #   $ANDROID_HOME/tools/bin/sdkmanager
      #
      # GitHub runner provides:
      #
      #   $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
      #
      # This symlink fixes ONLY that path mismatch.
      # ============================================================

      - name: Fix Buildozer sdkmanager path
        shell: bash
        run: |
          set -eux

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_HOME/tools/bin/avdmanager"

          test -x "$ANDROID_HOME/tools/bin/sdkmanager"

          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo "Buildozer sdkmanager compatibility path: OK"


      # ============================================================
      # INSTALL EXACT NDK
      # ============================================================

      - name: Install Android NDK 28.2.13676358
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "ndk;28.2.13676358"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "========================================"
          echo "NDK VERIFIED"
          echo "========================================"

          ls -lah "$ANDROID_HOME/ndk/28.2.13676358"


      # ============================================================
      # CHECK BUILD CONFIGURATION
      # ============================================================

      - name: Check build configuration
        shell: bash
        run: |
          set -eux

          test -f buildozer.spec

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version
          cython --version
          buildozer --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"

          echo "========================================"
          echo "SPEC"
          echo "========================================"

          cat buildozer.spec

                # ============================================================
            # ============================================================
      # DIAGNOSTIC: FIND WHO REQUESTS BUILD-TOOLS 37
      # ============================================================
      #
      # IMPORTANT:
      # This step ONLY investigates the source of Build-Tools 37.
      # APK BUILD WILL NOT RUN.
      #
      # Do NOT change buildozer.spec for this diagnostic.
      # Do NOT install Build-Tools 37.
      # Do NOT force Build-Tools 33.
      # ============================================================

      - name: DIAGNOSTIC - Find Build Tools 37 Source
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "DIAGNOSTIC START"
          echo "========================================"

          echo "========================================"
          echo "BUILDOZER VERSION"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "BUILDOZER LOCATION"
          echo "========================================"

          BUILDOZER_PATH="$(command -v buildozer)"

          echo "BUILDOZER_PATH=$BUILDOZER_PATH"

          python - <<'PY'
          import buildozer
          import os

          print("Buildozer Python module:")
          print(buildozer.__file__)

          print("Buildozer module directory:")
          print(os.path.dirname(buildozer.__file__))
          PY

          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"

          python --version
          python -m pip --version

          echo "========================================"
          echo "PYTHON-FOR-ANDROID PIP PACKAGE"
          echo "========================================"

          python -m pip show python-for-android || true

          echo "========================================"
          echo "PYTHON-FOR-ANDROID COMMAND"
          echo "========================================"

          command -v p4a || true

          if command -v p4a >/dev/null 2>&1; then
            p4a --version || true
          else
            echo "p4a command NOT FOUND in host Python environment."
          fi

          echo "========================================"
          echo "BUILDOZER SOURCE DIRECTORY"
          echo "========================================"

          BUILDOZER_DIR="$(python - <<'PY'
          import buildozer
          import os
          print(os.path.dirname(buildozer.__file__))
          PY
          )"

          echo "BUILDOZER_DIR=$BUILDOZER_DIR"

          test -d "$BUILDOZER_DIR"

          echo "========================================"
          echo "SEARCH BUILDOZER SOURCE FOR BUILD-TOOLS"
          echo "========================================"

          grep -R -n -E \
            'build-tools|build_tools_version|build-tools;37|build-tools/37|37\.0\.0' \
            "$BUILDOZER_DIR" \
            2>/dev/null \
            | head -300 || true

          echo "========================================"
          echo "SEARCH INSTALLED PYTHON PACKAGES"
          echo "FOR BUILD-TOOLS 37"
          echo "========================================"

          SITE_PACKAGES="$(python - <<'PY'
          import site
          for p in site.getsitepackages():
              print(p)
          PY
          )"

          echo "SITE_PACKAGES:"
          echo "$SITE_PACKAGES"

          while IFS= read -r SITE; do
            if [ -d "$SITE" ]; then
              echo "========================================"
              echo "SEARCHING: $SITE"
              echo "========================================"

              grep -R -n -E \
                'build-tools;37|build-tools/37|build_tools_version[[:space:]]*=[[:space:]]*37|37\.0\.0' \
                "$SITE" \
                2>/dev/null \
                | head -300 || true
            fi
          done <<< "$SITE_PACKAGES"

          echo "========================================"
          echo "SEARCH ENTIRE WORKSPACE"
          echo "FOR BUILD-TOOLS 37"
          echo "========================================"

          grep -R -n -E \
            'build-tools;37|build-tools/37|build_tools_version[[:space:]]*=[[:space:]]*37|android\.build_tools_version[[:space:]]*=[[:space:]]*37|37\.0\.0' \
            . \
            2>/dev/null \
            | head -500 || true

          echo "========================================"
          echo "BUILDOZER CONFIGURATION"
          echo "========================================"

          python - <<'PY'
          from buildozer.config import BuildozerConfig
          import inspect

          print("BuildozerConfig source:")
          try:
              print(inspect.getsource(BuildozerConfig))
          except Exception as e:
              print("Could not print BuildozerConfig source:", e)
          PY

          echo "========================================"
          echo "BUILDOZER ANDROID MODULES"
          echo "========================================"

          find "$BUILDOZER_DIR" \
            -type f \
            \( -name "*.py" -o -name "*.ini" -o -name "*.cfg" \) \
            -print \
            2>/dev/null \
            | sort \
            | head -500

          echo "========================================"
          echo "BUILDOZER CACHE STATUS"
          echo "========================================"

          echo "HOME=$HOME"

          if [ -d "$HOME/.buildozer" ]; then
            echo "HOME/.buildozer: FOUND"

            find "$HOME/.buildozer" \
              -maxdepth 6 \
              \( -iname "*build*tool*" -o -iname "*p4a*" -o -iname "*python-for-android*" \) \
              -print \
              2>/dev/null \
              | head -300 || true
          else
            echo "HOME/.buildozer: NOT FOUND"
          fi

          echo "========================================"
          echo "PROJECT .BUILDOZER STATUS"
          echo "========================================"

          if [ -d ".buildozer" ]; then
            echo ".buildozer: FOUND"

            find .buildozer \
              -maxdepth 8 \
              \( -iname "*build*tool*" -o -iname "*p4a*" -o -iname "*python-for-android*" \) \
              -print \
              2>/dev/null \
              | head -300 || true
          else
            echo ".buildozer: NOT FOUND"
          fi

          echo "========================================"
          echo "SPEC SETTINGS"
          echo "========================================"

          grep -n -E \
            'android\.build_tools_version|android\.api|android\.minapi|android\.ndk|p4a\.' \
            buildozer.spec \
            || true

          echo "========================================"
          echo "YAML BUILD-TOOLS REFERENCES"
          echo "========================================"

          grep -R -n -E \
            'build-tools|build_tools_version|ANDROID_BUILD_TOOLS|37\.0\.0|build-tools;37|build-tools/37' \
            .github/workflows \
            2>/dev/null \
            | head -300 || true

          echo "========================================"
          echo "ANDROID SDK AVAILABLE BUILD TOOLS"
          echo "========================================"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --list 2>/dev/null \
            | grep -E '^[[:space:]]*build-tools;' \
            | head -100 \
            || true

          echo "========================================"
          echo "FINAL DIAGNOSTIC STATUS"
          echo "========================================"

          echo "BUILD-TOOLS 37 SOURCE SEARCH COMPLETE."
          echo "APK BUILD WILL NOT RUN."
          echo "WORKFLOW STOPPED INTENTIONALLY."

          echo "========================================"

          exit 1

          echo "========================================"
          echo "CHECK BUILD TOOLS CONFIGURATION"
          echo "========================================"

          echo "Configured Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          test "$ANDROID_BUILD_TOOLS" = "33.0.2"

          echo "Build Tools 33.0.2 configuration: OK"


      # ============================================================
      # CLEAN ONLY STALE p4a BUILD VENV
      # ============================================================
      #
      # Current error:
      #
      # Python 3.14 venv + incompatible pip state
      #
      # Delete only the stale p4a temporary build environment.
      # Do NOT delete the complete Buildozer cache here.
      # ============================================================

      - name: Remove stale p4a temporary venv
        shell: bash
        run: |
          set -eux

          find .buildozer/android/platform \
            -type d \
            -path "*/build/venv" \
            -prune \
            -exec rm -rf {} + || true

          echo "Stale p4a temporary venv removed."


      # ============================================================
      # FORCE HOST PYTHON 3.11 FOR P4A
      # ============================================================

      - name: Configure python-for-android host Python
        shell: bash
        run: |
          set -eux

          export HOSTPYTHON="$(command -v python)"

          echo "HOSTPYTHON=$HOSTPYTHON"

          "$HOSTPYTHON" --version

          echo "HOSTPYTHON=$HOSTPYTHON" >> "$GITHUB_ENV"

          echo "VIRTUAL_ENV=" >> "$GITHUB_ENV"


      # ============================================================
      # BUILD APK
      # ============================================================

          # ============================================================
      # DIAGNOSTIC ONLY - CHECK AND STOP
      # APK BUILD MUST NOT RUN
      # ============================================================

      - name: Diagnose Buildozer Internal Android Tools - STOP
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER VERSION"
          echo "========================================"
          buildozer --version

          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"
          python --version
          python -m pip --version

          echo "========================================"
          echo "PYTHON-FOR-ANDROID VERSION"
          echo "========================================"
          python -m pip show python-for-android || true

          echo "========================================"
          echo "INTERNAL BUILDOZER SDK"
          echo "========================================"

          INTERNAL_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "INTERNAL_SDK=$INTERNAL_SDK"

          if [ -d "$INTERNAL_SDK" ]; then
            echo "Internal SDK: FOUND"
          else
            echo "Internal SDK: NOT FOUND"
          fi

          echo "========================================"
          echo "INSTALLED BUILD TOOLS"
          echo "========================================"

          if [ -d "$INTERNAL_SDK/build-tools" ]; then
            find "$INTERNAL_SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V
          else
            echo "Internal build-tools directory does not exist."
          fi

          echo "========================================"
          echo "SDKMANAGER VERSION"
          echo "========================================"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          echo "========================================"
          echo "AVAILABLE BUILD TOOLS"
          echo "========================================"

          "$SDKMANAGER" --list 2>/dev/null \
            | grep -E '^[[:space:]]*build-tools;' \
            | head -100 || true

          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=${ANDROIDSDK:-NOT_SET}"

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"

          echo "========================================"
          echo "SPEC ANDROID SETTINGS"
          echo "========================================"

          grep -n \
            -E 'android\.build_tools_version|android\.api|android\.minapi|android\.ndk' \
            buildozer.spec || true

          echo "========================================"
          echo "DIAGNOSTIC COMPLETE"
          echo "========================================"
          echo "APK BUILD WILL NOT RUN"
          echo "WORKFLOW STOPPED INTENTIONALLY"
          echo "========================================"

          exit 1


      - name: Build Money Tracker APK
        shell: bash
        run: |
          set -eux

          export BUILDOZER_WARN_ON_ROOT=0

          export PYTHONNOUSERSITE=1
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          export PIP_NO_INPUT=1

          export HOSTPYTHON="$(command -v python)"

          echo "========================================"
          echo "STARTING MONEY TRACKER APK BUILD"
          echo "========================================"

          echo "Python:"
          "$HOSTPYTHON" --version

          echo "Python path:"
          echo "$HOSTPYTHON"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          echo "$ANDROID_NDK"

          echo "Android API:"
          echo "$ANDROID_API"

          echo "Android Min API:"
          echo "$ANDROID_MIN_API"

          echo "Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "APK SEARCH"
          echo "========================================"

          find . -type f -name "*.apk" -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"

          echo "APK BUILD SUCCESSFUL."


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
