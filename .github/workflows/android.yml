name: Money Tracker Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Find Money Tracker ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname "MoneyTracker_Android_APK_Build.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MoneyTracker_Android_APK_Build.zip not found"
            exit 1
          fi

          echo "ZIP=$ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project
        run: |
          PROJECT=$(find extracted -name buildozer.spec -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: buildozer.spec not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Verify project
        run: |
          test -f "$PROJECT_DIR/buildozer.spec"
          test -f "$PROJECT_DIR/main.py"

          echo "buildozer.spec: OK"
          echo "main.py: OK"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Prepare Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Buildozer
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

      - name: Build Debug APK
  working-directory: ${{ env.PROJECT_DIR }}
  env:
    P4A_BUILD_ARGS: "--sdk_dir=$ANDROID_HOME"
  run: |
    buildozer -v android debug

      - name: Find APK
        run: |
          echo "===== APK SEARCH ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Debug-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
