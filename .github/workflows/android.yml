name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  ANDROID_API: "33"
  ANDROID_MINAPI: "21"
  ANDROID_NDK_VERSION: "28c"
  ANDROID_BUILD_TOOLS_VERSION: "33.0.2"

jobs:
  build-android:

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install Linux dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            build-essential \
            libltdl-dev \
            libffi-dev \
            libssl-dev

      # ============================================================
      # PYTHON BUILD ENVIRONMENT
      # ============================================================

      - name: Install Python build dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "cython==0.29.34" \
            "buildozer==1.6.0"

          echo "=========================================="
          echo "VERSIONS"
          echo "=========================================="

          python --version
          cython --version
          buildozer --version

      # ============================================================
      # VERIFY PROJECT FILES
      # ============================================================

      - name: Verify MoneyTracker project
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT CHECK"
          echo "=========================================="

          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "buildozer.spec:"
          test -f buildozer.spec

          echo ""
          echo "main.py:"
          test -f main.py

          echo ""
          echo "mt directory:"
          test -d mt

      # ============================================================
      # CLEAN OLD BUILDOZER CACHE
      # ============================================================

      - name: Clean Buildozer cache
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          mkdir -p "$HOME/.buildozer"

      # ============================================================
      # INSTALL BUILDOZER SDK
      #
      # IMPORTANT:
      # Keep the real SDK layout:
      #
      # android-sdk/
      #   cmdline-tools/
      #     latest/
      #
      # Do NOT copy latest into tools.
      # ============================================================

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip -d cmdline-tools

          mv \
            cmdline-tools/cmdline-tools \
            cmdline-tools/latest

          rm -f commandlinetools.zip

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/avdmanager" || true

          touch "$SDK/repositories.cfg"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "SDKMANAGER VERSION"
          echo "=========================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

      # ============================================================
      # EXPORT ANDROID VARIABLES
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROIDSDK=$SDK"
            echo "ANDROIDAPI=33"
            echo "ANDROIDMINAPI=21"
            echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r28c"
            echo "$SDK/cmdline-tools/latest/bin"
            echo "$SDK/platform-tools"
            echo "$SDK/build-tools/33.0.2"
          } >> "$GITHUB_PATH"

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROIDSDK=$SDK"
            echo "ANDROIDAPI=33"
            echo "ANDROIDMINAPI=21"
          } >> "$GITHUB_ENV"

      # ============================================================
      # ACCEPT LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses > /dev/null || true

      # ============================================================
      # INSTALL EXACT SDK COMPONENTS
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING SDK COMPONENTS"
          echo "=========================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      # ============================================================
      # INSTALL NDK 28c
      # ============================================================

      - name: Install Android NDK 28c
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING NDK 28c"
          echo "=========================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "ndk;28.0.13004108"

      # ============================================================
      # VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDKMANAGER:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

          echo ""
          echo "Installed packages:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed

          echo ""
          echo "Build Tools:"
          ls -lah "$SDK/build-tools/33.0.2"

          echo ""
          echo "AIDL:"
          test -x "$SDK/build-tools/33.0.2/aidl"

          "$SDK/build-tools/33.0.2/aidl" 2>&1 | head -n 5 || true

          echo ""
          echo "Platform:"
          test -d "$SDK/platforms/android-33"

          echo ""
          echo "NDK:"
          test -d "$SDK/ndk/28.0.13004108"

          echo ""
          echo "ANDROID SDK CHECK PASSED"

      # ============================================================
      # CREATE BUILDOZER SDKMANAGER COMPATIBILITY WRAPPER
      #
      # Buildozer/p4a may look for:
      #
      # android-sdk/tools/bin/sdkmanager
      #
      # But modern Android SDK uses:
      #
      # android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # We keep the real SDK intact and create ONLY a wrapper.
      # ============================================================

      - name: Create Buildozer SDK compatibility wrapper
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "CREATING BUILDOZER SDK WRAPPER"
          echo "=========================================="

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<'EOF'
          #!/usr/bin/env bash

          set -e

          SDK="$(cd "$(dirname "$0")/../.." && pwd)"

          exec "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "$@"
          EOF

          chmod +x "$SDK/tools/bin/sdkmanager"

          echo ""
          echo "Compatibility sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Compatibility path created successfully."

      # ============================================================
      # INSTALL / PIN PYTHON-FOR-ANDROID
      # ============================================================

      - name: Prepare python-for-android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PYTHON-FOR-ANDROID"
          echo "=========================================="

          python -m pip install \
            "appdirs" \
            "colorama>=0.3.3" \
            "jinja2" \
            "sh>=2,<3.0" \
            "meson" \
            "ninja" \
            "build" \
            "toml" \
            "packaging" \
            "setuptools" \
            "wheel"

      # ============================================================
      # BUILDOZER PRECHECK
      # ============================================================

      - name: Buildozer precheck
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER PRECHECK"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Spec:"
          sed -n '1,220p' buildozer.spec

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build MoneyTracker APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Android API:"
          echo "$ANDROIDAPI"

          echo ""
          echo "Android minimum API:"
          echo "$ANDROIDMINAPI"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug

      # ============================================================
      # SHOW APK
      # ============================================================

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error
