name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    name: Build MoneyTracker Android APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONUNBUFFERED: "1"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA 17
      # IMPORTANT:
      # Do NOT use cache: pip here.
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # PYTHON 3.11
      # IMPORTANT:
      # Do NOT use cache: pip because this project has no
      # requirements.txt / pyproject.toml.
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: false

      # ==========================================================
      # SYSTEM DEPENDENCIES
      # ==========================================================
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            liblzma-dev \
            gettext \
            autopoint \
            libtool-bin

      # ==========================================================
      # PYTHON BUILD TOOLS
      # ==========================================================
      - name: Install Python build tools
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<81" \
            wheel \
            "Cython==0.29.34" \
            buildozer==1.6.0

      # ==========================================================
      # VERIFY PYTHON / CYTHON / BUILDOZER
      # ==========================================================
      - name: Verify build environment
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          python --version
          python -m pip --version
          cython --version
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Git:"
          git --version

      # ==========================================================
      # CREATE BUILDOZER SDK BASE DIRECTORY
      # ==========================================================
      - name: Prepare Buildozer Android directories
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

      # ==========================================================
      # INSTALL ANDROID SDK COMMAND LINE TOOLS
      #
      # IMPORTANT:
      # We create:
      #
      # android-sdk/cmdline-tools/latest/
      #
      # and ALSO:
      #
      # android-sdk/tools/
      #
      # Buildozer versions that look for tools/bin/sdkmanager
      # are supported by this layout.
      # ==========================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip -d "$SDK/cmdline-tools"

          rm -f commandlinetools.zip

          # The ZIP creates:
          # cmdline-tools/cmdline-tools
          #
          # Move it to:
          # cmdline-tools/latest
          rm -rf "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          # ------------------------------------------------------
          # Buildozer compatibility
          #
          # Buildozer/p4a may search:
          # android-sdk/tools/bin/sdkmanager
          #
          # Create a real compatibility directory.
          # Do NOT symlink the entire cmdline-tools directory.
          # ------------------------------------------------------

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools"

          cp -a \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/"

          cp -a \
            "$SDK/cmdline-tools/latest/lib" \
            "$SDK/tools/"

          chmod +x "$SDK/tools/bin/sdkmanager"

          touch "$SDK/repositories.cfg"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Checking sdkmanager..."

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

      # ==========================================================
      # ACCEPT ANDROID LICENSES
      # ==========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

      # ==========================================================
      # INSTALL EXACT SDK PACKAGES
      #
      # API 33 and Build Tools 33.0.2 are kept because they match
      # the application's buildozer.spec.
      # ==========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

      # ==========================================================
      # VERIFY SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed SDK packages:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "Build Tools:"
          ls -lah "$SDK/build-tools/33.0.2"

          echo ""
          echo "AIDL:"
          test -x "$SDK/build-tools/33.0.2/aidl"

          "$SDK/build-tools/33.0.2/aidl" --help >/dev/null

          echo "AIDL executable: OK"

          echo ""
          echo "AAPT2:"
          test -x "$SDK/build-tools/33.0.2/aapt2"

          echo "AAPT2 executable: OK"

          echo ""
          echo "D8:"
          test -x "$SDK/build-tools/33.0.2/d8"

          echo "D8 executable: OK"

          echo ""
          echo "ZIPALIGN:"
          test -x "$SDK/build-tools/33.0.2/zipalign"

          echo "ZIPALIGN executable: OK"

      # ==========================================================
      # INSTALL PYTHON-FOR-ANDROID
      #
      # IMPORTANT:
      # Buildozer 1.6 requires a recent p4a with AAB support.
      # We install the current stable package instead of forcing
      # the old Git stable branch.
      # ==========================================================
      - name: Install Python for Android
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            "python-for-android"

          python -m pythonforandroid.toolchain \
            aab -h >/dev/null

          echo "python-for-android AAB support: OK"

      # ==========================================================
      # SHOW PROJECT
      # ==========================================================
      - name: Verify project files
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          pwd

          echo ""
          echo "Root:"
          ls -lah

          echo ""
          echo "buildozer.spec:"
          test -f buildozer.spec
          sed -n '1,200p' buildozer.spec

          echo ""
          echo "main.py:"
          test -f main.py

          echo ""
          echo "mt directory:"
          test -d mt
          find mt -maxdepth 2 -type f | sort

      # ==========================================================
      # FORCE BUILDOZER / P4A ENVIRONMENT
      # ==========================================================
      - name: Configure Android build environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=28c" >> "$GITHUB_ENV"

          echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/33.0.2:$PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Build MoneyTracker APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug

      # ==========================================================
      # FIND APK
      # ==========================================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo ""
          echo "APK files:"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

          echo ""
          echo "bin directory:"

          if [ -d bin ]; then
            ls -lah bin
          else
            echo "bin directory not found"
          fi

      # ==========================================================
      # UPLOAD APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error

      # ==========================================================
      # UPLOAD BUILD LOGS IF BUILD FAILS
      # ==========================================================
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/
          if-no-files-found: warn
