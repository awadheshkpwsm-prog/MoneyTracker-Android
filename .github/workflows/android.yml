name: Build Money Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.34"
          pip install "buildozer==1.6.0"
          pip install "kivy==2.3.1"

      - name: Check Build Environment
        run: |
          echo "===== BUILD ENVIRONMENT ====="
          python --version
          buildozer --version
          cython --version
          echo "============================="

      - name: Find Project Directory
        shell: bash
        run: |
          echo "===== PROJECT FILES ====="
          pwd
          find . -maxdepth 3 -type f | sort
          echo "========================="

      - name: Locate buildozer.spec
        shell: bash
        run: |
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found buildozer.spec:"
          echo "$SPEC_FILE"
          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Check Project
        shell: bash
        run: |
          echo "===== PROJECT CHECK ====="
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/buildozer.spec" ]; then
            echo "ERROR: buildozer.spec missing!"
            exit 1
          fi

          echo "===== buildozer.spec found ====="

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "===== STARTING BUILD ====="
          buildozer -v android debug

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK SEARCH ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Debug-APK
          path: "**/bin/*.apk"
          if-no-files-found: error
