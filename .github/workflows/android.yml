name: MoneyTracker Android Full Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-android:

    name: MoneyTracker Android AAB Build

    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive

      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"
      BUILDOZER_VERSION: "1.6.0"
      CYTHON_VERSION: "0.29.34"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      MAVEN_ARGS: "-ntp"

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================

      - name: 01 - Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 02 - RUNNER INFORMATION
      # ============================================================

      - name: 02 - Runner diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "RUNNER"
          echo "========================================"

          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "HOME=$HOME"
          whoami
          uname -a
          cat /etc/os-release
          nproc
          free -h
          df -h


      # ============================================================
      # 03 - FIND BUILDOZER SPEC
      # ============================================================

      - name: 03 - Detect buildozer.spec
        run: |
          set -euxo pipefail

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "SPEC_FILE=$SPEC_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 04 - JAVA 17
      # ============================================================

      - name: 04 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 05 - JAVA CHECK
      # ============================================================

      - name: 05 - Java diagnostic
        run: |
          set -euxo pipefail

          java -version
          javac -version

          echo "JAVA_HOME=$JAVA_HOME"

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"


      # ============================================================
      # 06 - PYTHON 3.11.13
      # ============================================================

      - name: 06 - Set up Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          check-latest: false
          cache: pip


      # ============================================================
      # 07 - PYTHON CHECK
      # ============================================================

      - name: 07 - Python diagnostic
        run: |
          set -euxo pipefail

          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip --version

          python - <<'PY'
          import sys

          print("Python:", sys.version)

          if sys.version_info[:2] != (3, 11):
              raise SystemExit("ERROR: Python 3.11 required.")

          print("PASS: Python 3.11")
          PY


      # ============================================================
      # 08 - HOST DEPENDENCIES
      # ============================================================

      - name: 08 - Install host dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            gcc \
            g++ \
            make \
            cmake \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zip \
            unzip \
            patch \
            file \
            build-essential \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            liblzma-dev

          echo "========================================"
          echo "HOST TOOLS"
          echo "========================================"

          TOOLS=(
            git
            gcc
            g++
            make
            cmake
            autoconf
            automake
            libtool
            pkg-config
            zip
            unzip
            patch
            file
          )

          for TOOL in "${TOOLS[@]}"; do
            command -v "$TOOL"
            echo "PASS: $TOOL"
          done


      # ============================================================
      # 09 - INSTALL BUILDOZER
      # ============================================================

      - name: 09 - Install Buildozer and Cython
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==${CYTHON_VERSION}"

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}"

          echo "========================================"
          echo "VERSIONS"
          echo "========================================"

          python --version
          buildozer --version
          cython --version


      # ============================================================
      # 10 - BUILDOSER SPEC CHECK
      # ============================================================

      - name: 10 - Show buildozer.spec
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

          echo
          echo "========================================"
          echo "ANDROID SETTINGS"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|requirements|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true


      # ============================================================
      # 11 - CLEAN OLD BUILDOZER BUILD STATE
      #
      # IMPORTANT:
      #
      # The previous failure came from:
      #
      # .buildozer/android/platform/build-.../build/venv
      #
      # where Python 3.14 + incompatible pip state was present.
      #
      # We remove only the generated Buildozer directory.
      # Repository source files are NOT touched.
      # ============================================================

      - name: 11 - Clean old Buildozer generated state
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "CLEAN BUILDOZER STATE"
          echo "========================================"

          if [ -d ".buildozer" ]; then
            echo "Removing old .buildozer directory..."
            rm -rf ".buildozer"
          else
            echo "No old .buildozer directory."
          fi

          mkdir -p ".buildozer"

          echo
          echo "Buildozer directory:"
          ls -lah ".buildozer"


      # ============================================================
      # 12 - BUILDOZER CONFIG
      # ============================================================

      - name: 12 - Configure Buildozer environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER CONFIGURATION"
          echo "========================================"

          echo "HOME=$HOME"
          echo "PROJECT_DIR=$PROJECT_DIR"

          export BUILDOZER_WARN_ON_ROOT=0

          echo "BUILDOZER_WARN_ON_ROOT=$BUILDOZER_WARN_ON_ROOT"


      # ============================================================
      # 13 - INITIAL BUILDOZER ANDROID PREPARATION
      #
      # Buildozer is allowed to prepare its Android platform.
      #
      # NO APK/AAB build is requested here.
      # ============================================================

      - name: 13 - Bootstrap Buildozer Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER ANDROID PREPARATION"
          echo "========================================"

          buildozer -v android update


      # ============================================================
      # 14 - DETECT BUILDOZER SDK
      # ============================================================

      - name: 14 - Detect Buildozer Android SDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER SDK DETECTION"
          echo "========================================"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Buildozer SDK not found:"
            echo "$SDK"
            exit 1
          fi

          echo "PASS: SDK exists"
          echo "SDK=$SDK"

          test -d "$SDK/platform-tools"
          test -d "$SDK/build-tools"

          echo "ANDROID_SDK_REAL=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"


      # ============================================================
      # 15 - DETECT BUILD TOOLS
      #
      # We use the Buildozer SDK's detected/latest installed
      # Build Tools directory.
      # ============================================================

      - name: 15 - Detect Build Tools inside Buildozer SDK
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_REAL"

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          BUILD_TOOLS_VERSION="$(
            find "$SDK/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: No Build Tools found."
            exit 1
          fi

          BUILD_TOOLS_DIR="$SDK/build-tools/$BUILD_TOOLS_VERSION"

          echo "VERSION=$BUILD_TOOLS_VERSION"
          echo "DIR=$BUILD_TOOLS_DIR"

          test -d "$BUILD_TOOLS_DIR"

          echo "ANDROID_BUILD_TOOLS_REAL=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 16 - DETECT NDK INSIDE BUILDOZER SDK FIRST
      #
      # IMPORTANT:
      #
      # We prefer:
      #
      # $HOME/.buildozer/android/platform/android-ndk-*
      #
      # over the runner's preinstalled NDK.
      #
      # This prevents the previous situation where:
      #
      # ANDROID_NDK = r29
      # ANDROIDNDK  = Buildozer r28c
      #
      # were different.
      # ============================================================

      - name: 16 - Detect Buildozer NDK
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER NDK DETECTION"
          echo "========================================"

          NDK_DIR=""

          for CANDIDATE in \
            "$HOME/.buildozer/android/platform/android-ndk-r28c" \
            "$HOME/.buildozer/android/platform/android-ndk-r27c" \
            "$HOME/.buildozer/android/platform/android-ndk-r27b" \
            "$HOME/.buildozer/android/platform/android-ndk-r26d" \
            "$HOME/.buildozer/android/platform/android-ndk-r25b"
          do

            if [ -d "$CANDIDATE" ] \
              && [ -f "$CANDIDATE/source.properties" ]; then

              NDK_DIR="$CANDIDATE"
              break

            fi

          done

          if [ -z "$NDK_DIR" ]; then

            NDK_DIR="$(
              find "$HOME/.buildozer/android/platform" \
                -type f \
                -name "source.properties" \
                -path "*android-ndk*" \
                2>/dev/null \
                | sed 's#/source.properties##' \
                | sort -V \
                | tail -n 1 \
                || true
            )

          fi

          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: Buildozer NDK not detected."
            exit 1
          fi

          echo "PASS: Buildozer NDK detected"
          echo "NDK=$NDK_DIR"

          echo
          echo "========================================"
          echo "NDK VERSION INFORMATION"
          echo "========================================"

          cat "$NDK_DIR/source.properties"

          test -f "$NDK_DIR/source.properties"

          echo "ANDROID_NDK_REAL=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 17 - FORCE ANDROID PATHS
      #
      # From this point onward all Android variables point to
      # Buildozer's Android environment.
      # ============================================================

      - name: 17 - Set authoritative Android paths
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "AUTHORITATIVE ANDROID ENVIRONMENT"
          echo "========================================"

          echo "SDK:"
          echo "$ANDROID_SDK_REAL"

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_REAL"

          echo
          echo "BUILD TOOLS:"
          echo "$ANDROID_BUILD_TOOLS_DIR"

          test -d "$ANDROID_SDK_REAL"
          test -d "$ANDROID_NDK_REAL"
          test -d "$ANDROID_BUILD_TOOLS_DIR"

          {
            echo "ANDROID_HOME=$ANDROID_SDK_REAL"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_REAL"
            echo "ANDROIDSDK=$ANDROID_SDK_REAL"

            echo "ANDROID_NDK=$ANDROID_NDK_REAL"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_REAL"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_REAL"
            echo "ANDROIDNDK=$ANDROID_NDK_REAL"

            echo "PATH=$ANDROID_BUILD_TOOLS_DIR:$ANDROID_SDK_REAL/platform-tools:$PATH"
          } >> "$GITHUB_ENV"


      # ============================================================
      # 18 - SDK / NDK FINAL CHECK
      # ============================================================

      - name: 18 - Android environment final check
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDNDK=$ANDROIDNDK"

          echo
          echo "BUILD TOOLS=$ANDROID_BUILD_TOOLS_DIR"

          echo
          echo "========================================"
          echo "SDK DIRECTORIES"
          echo "========================================"

          find "$ANDROID_SDK_REAL" \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -500

          echo
          echo "========================================"
          echo "NDK DIRECTORY"
          echo "========================================"

          ls -lah "$ANDROID_NDK_REAL"

          echo
          echo "========================================"
          echo "NDK SOURCE.PROPERTIES"
          echo "========================================"

          cat "$ANDROID_NDK_REAL/source.properties"


      # ============================================================
      # 19 - CLEAN ONLY P4A BUILD VENV
      #
      # IMPORTANT FIX FOR:
      #
      # BuildDependencyInstallError
      #
      # We remove the generated p4a build directory so a fresh
      # Python build environment is created.
      # ============================================================

      - name: 19 - Clean python-for-android build virtual environments
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "P4A VENV CLEANUP"
          echo "========================================"

          PLATFORM_DIR="$PROJECT_DIR/.buildozer/android/platform"

          if [ -d "$PLATFORM_DIR" ]; then

            find "$PLATFORM_DIR" \
              -type d \
              -path "*/build/venv" \
              -print

            find "$PLATFORM_DIR" \
              -type d \
              -path "*/build/venv" \
              -prune \
              -exec rm -rf {} +

          fi

          echo
          echo "P4A build virtual environments after cleanup:"

          find "$PLATFORM_DIR" \
            -type d \
            -path "*/build/venv" \
            -print \
            2>/dev/null \
            || true


      # ============================================================
      # 20 - P4A SOURCE CHECK
      # ============================================================

      - name: 20 - Python-for-Android diagnostic
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          P4A_DIR="$PROJECT_DIR/.buildozer/android/platform/python-for-android"

          if [ ! -d "$P4A_DIR" ]; then
            echo "ERROR: python-for-android directory missing."
            exit 1
          fi

          echo "P4A_DIR=$P4A_DIR"

          cd "$P4A_DIR"

          python -m pythonforandroid.toolchain \
            --help \
            >/tmp/p4a-help.txt

          head -100 /tmp/p4a-help.txt


      # ============================================================
      # 21 - BUILD ENVIRONMENT DIAGNOSTIC
      # ============================================================

      - name: 21 - Final build environment diagnostic
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -c "import sys; print(sys.executable)"

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

          echo
          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo
          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "SDK=$ANDROID_SDK_REAL"
          echo "NDK=$ANDROID_NDK_REAL"
          echo "BUILD_TOOLS=$ANDROID_BUILD_TOOLS_DIR"

          echo
          echo "========================================"
          echo "ANDROID COMMANDS"
          echo "========================================"

          if [ -x "$ANDROID_SDK_REAL/platform-tools/adb" ]; then
            "$ANDROID_SDK_REAL/platform-tools/adb" version
          fi

          if [ -x "$ANDROID_BUILD_TOOLS_DIR/aapt" ]; then
            "$ANDROID_BUILD_TOOLS_DIR/aapt" version
          fi

          if [ -x "$ANDROID_BUILD_TOOLS_DIR/d8" ]; then
            "$ANDROID_BUILD_TOOLS_DIR/d8" --version
          fi


      # ============================================================
      # 22 - SPEC / ENVIRONMENT REPORT
      # ============================================================

      - name: 22 - Spec and environment report
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(title|package\.name|package\.domain|source\.dir|source\.include_exts|version|requirements|orientation|fullscreen|android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.branch)[[:space:]]*=' \
            buildozer.spec \
            || true

          echo
          echo "========================================"
          echo "ACTUAL ENVIRONMENT"
          echo "========================================"

          env | sort | grep -E \
            '^(ANDROID|BUILDOZER|P4A|JAVA|PYTHON)' \
            || true


      # ============================================================
      # 23 - FINAL PYTHON SOURCE CHECK
      # ============================================================

      - name: 23 - Final source syntax check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' FILE; do

            COUNT=$((COUNT + 1))

            echo "Checking: $FILE"

            if python -m py_compile "$FILE"; then
              echo "PASS"
            else
              echo "FAIL"
              FAILED=1
            fi

          done < <(
            find "$SOURCE_PATH" \
              -type f \
              -name "*.py" \
              -print0
          )

          echo "Python files checked: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No Python files."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi


      # ============================================================
      # 24 - VERIFY P4A TEMP VENV BEFORE BUILD
      #
      # This does NOT create the final APK.
      #
      # It checks whether stale Python 3.14 venvs are present.
      # ============================================================

      - name: 24 - Verify clean p4a build environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          PLATFORM_DIR="$PROJECT_DIR/.buildozer/android/platform"

          echo "========================================"
          echo "P4A VENV SEARCH"
          echo "========================================"

          FOUND=0

          while IFS= read -r -d '' VENV; do

            FOUND=1

            echo
            echo "FOUND VENV:"
            echo "$VENV"

            if [ -x "$VENV/bin/python" ]; then
              "$VENV/bin/python" --version
            fi

          done < <(
            find "$PLATFORM_DIR" \
              -type d \
              -path "*/build/venv" \
              -print0 \
              2>/dev/null
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "PASS: No stale p4a build/venv detected."
          else
            echo "INFO: p4a venv exists and will be recreated/managed by p4a."
          fi


      # ============================================================
      # 25 - FINAL PRE-BUILD GATE
      # ============================================================

      - name: 25 - Final pre-build gate
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FINAL PRE-BUILD GATE"
          echo "========================================"

          test -f "$SPEC_FILE"
          test -d "$PROJECT_DIR"

          test -d "$ANDROID_SDK_REAL"
          test -d "$ANDROID_NDK_REAL"
          test -d "$ANDROID_BUILD_TOOLS_DIR"

          command -v python
          command -v java
          command -v buildozer
          command -v cython

          python -c "import sys; assert sys.version_info[:2] == (3,11)"
          python -c "import Cython"
          python -c "import buildozer"

          echo
          echo "PASS: All pre-build requirements are present."

          echo
          echo "========================================"
          echo "BUILD WILL START NEXT"
          echo "========================================"


      # ============================================================
      # 26 - ACTUAL ANDROID AAB BUILD
      #
      # THIS IS THE FIRST STEP THAT BUILDS THE APPLICATION.
      #
      # Command:
      #
      # buildozer -v android aab
      #
      # ============================================================

      - name: 26 - Build Android AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "MONEYTRACKER ANDROID AAB BUILD"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "SDK=$ANDROID_SDK_REAL"
          echo "NDK=$ANDROID_NDK_REAL"
          echo "BUILD_TOOLS=$ANDROID_BUILD_TOOLS_DIR"

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "========================================"
          echo "STARTING BUILDOZER AAB"
          echo "========================================"

          buildozer -v android aab


      # ============================================================
      # 27 - SHOW GENERATED FILES
      # ============================================================

      - name: 27 - Locate generated Android files
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e

          echo "========================================"
          echo "GENERATED ANDROID FILES"
          echo "========================================"

          find "$PROJECT_DIR/bin" \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print \
            2>/dev/null \
            | sort

          echo
          echo "BIN DIRECTORY:"
          ls -lah "$PROJECT_DIR/bin" 2>/dev/null || true


      # ============================================================
      # 28 - UPLOAD AAB / APK
      # ============================================================

      - name: 28 - Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Android-Build
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
            ${{ env.PROJECT_DIR }}/bin/*.aab
          if-no-files-found: warn


      # ============================================================
      # 29 - SAVE BUILDOZER LOGS
      # ============================================================

      - name: 29 - Collect Buildozer diagnostics
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e

          mkdir -p diagnostic-report

          echo "========================================"
          echo "MONEYTRACKER BUILD DIAGNOSTIC"
          echo "========================================"

          {
            echo "DATE:"
            date

            echo
            echo "PROJECT_DIR:"
            echo "$PROJECT_DIR"

            echo
            echo "SPEC_FILE:"
            echo "$SPEC_FILE"

            echo
            echo "PYTHON:"
            python --version 2>&1

            echo
            echo "JAVA:"
            java -version 2>&1

            echo
            echo "BUILDOZER:"
            buildozer --version 2>&1

            echo
            echo "CYTHON:"
            cython --version 2>&1

            echo
            echo "ANDROID SDK:"
            echo "${ANDROID_SDK_REAL:-NOT SET}"

            echo
            echo "ANDROID NDK:"
            echo "${ANDROID_NDK_REAL:-NOT SET}"

            echo
            echo "BUILD TOOLS:"
            echo "${ANDROID_BUILD_TOOLS_REAL:-NOT SET}"

            echo
            echo "ANDROID VARIABLES:"
            env | sort | grep -E \
              '^(ANDROID|BUILDOZER|P4A|JAVA|PYTHON)' \
              || true

            echo
            echo "DISK:"
            df -h

          } > diagnostic-report/build-summary.txt

          if [ -f "$SPEC_FILE" ]; then
            cp "$SPEC_FILE" \
              diagnostic-report/buildozer.spec
          fi

          find "$PROJECT_DIR/.buildozer" \
            -maxdepth 7 \
            -print \
            2>/dev/null \
            | sort \
            > diagnostic-report/buildozer-tree.txt

          find "$PROJECT_DIR/bin" \
            -type f \
            -print \
            2>/dev/null \
            | sort \
            > diagnostic-report/bin-files.txt


      # ============================================================
      # 30 - UPLOAD DIAGNOSTIC
      # ============================================================

      - name: 30 - Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Android-Diagnostic
          path: diagnostic-report
          if-no-files-found: warn