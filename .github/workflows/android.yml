name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    name: Build MoneyTracker Android APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONUNBUFFERED: "1"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # PYTHON 3.11
      # NO PIP CACHE
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: false


      # ==========================================================
      # SYSTEM DEPENDENCIES
      # ==========================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            liblzma-dev \
            gettext \
            autopoint


      # ==========================================================
      # PYTHON BUILD TOOLS
      # ==========================================================
      - name: Install Python build tools
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<81" \
            wheel \
            "Cython==0.29.34" \
            "buildozer==1.6.0"


      # ==========================================================
      # VERIFY PYTHON / CYTHON / BUILDOZER
      # ==========================================================
      - name: Verify Python build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PYTHON BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version


      # ==========================================================
      # INSTALL ANDROID SDK
      # ==========================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip \
            -d "$SDK/cmdline-tools"

          rm -f commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          # ------------------------------------------------------
          # Buildozer compatibility path
          # ------------------------------------------------------

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools"

          cp -a \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/"

          cp -a \
            "$SDK/cmdline-tools/latest/lib" \
            "$SDK/tools/"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          chmod +x \
            "$SDK/tools/bin/sdkmanager"

          touch "$SDK/repositories.cfg"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Testing primary sdkmanager:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

          echo ""
          echo "Testing Buildozer compatibility sdkmanager:"

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ==========================================================
      # ANDROID LICENSES
      # ==========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true


      # ==========================================================
      # INSTALL SDK PACKAGES
      # ==========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true


      # ==========================================================
      # VERIFY SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed packages:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "Build Tools 33.0.2:"

          test -d "$SDK/build-tools/33.0.2"

          ls -lah "$SDK/build-tools/33.0.2"

          echo ""
          echo "AIDL:"

          test -x "$SDK/build-tools/33.0.2/aidl"

          "$SDK/build-tools/33.0.2/aidl" \
            --help >/dev/null

          echo "AIDL OK"

          echo ""
          echo "AAPT2:"

          test -x "$SDK/build-tools/33.0.2/aapt2"

          echo "AAPT2 OK"

          echo ""
          echo "D8:"

          test -x "$SDK/build-tools/33.0.2/d8"

          echo "D8 OK"

          echo ""
          echo "ZIPALIGN:"

          test -x "$SDK/build-tools/33.0.2/zipalign"

          echo "ZIPALIGN OK"


      # ==========================================================
      # INSTALL PYTHON-FOR-ANDROID
      #
      # Do not use p4a.branch=stable.
      # Buildozer 1.6 needs a p4a version supporting AAB.
      # ==========================================================
      - name: Install Python for Android
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            "python-for-android"

          echo ""
          echo "Checking python-for-android:"

          python -m pythonforandroid.toolchain \
            --help >/dev/null

          echo ""
          echo "Checking AAB support:"

          python -m pythonforandroid.toolchain \
            aab -h >/dev/null

          echo ""
          echo "python-for-android AAB support: OK"


      # ==========================================================
      # PROJECT CHECK
      # ==========================================================
      - name: Verify MoneyTracker project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MONEYTRACKER PROJECT"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -lah

          echo ""
          echo "Checking buildozer.spec:"

          test -f buildozer.spec

          echo "buildozer.spec FOUND"

          echo ""
          echo "Checking main.py:"

          test -f main.py

          echo "main.py FOUND"

          echo ""
          echo "Checking mt directory:"

          test -d mt

          echo "mt directory FOUND"

          echo ""
          echo "buildozer.spec contents:"
          cat buildozer.spec


      # ==========================================================
      # EXPORT BUILD ENVIRONMENT
      # ==========================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=28c" >> "$GITHUB_ENV"

          echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/33.0.2:$PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # SHOW FINAL BUILD ENVIRONMENT
      # ==========================================================
      - name: Final environment check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "ANDROIDAPI:"
          echo "$ANDROIDAPI"

          echo ""
          echo "ANDROIDMINAPI:"
          echo "$ANDROIDMINAPI"

          echo ""
          echo "ANDROIDNDK:"
          echo "$ANDROIDNDK"

          echo ""
          echo "sdkmanager:"
          command -v sdkmanager || true

          echo ""
          echo "Java:"
          java -version


      # ==========================================================
      # BUILD
      # ==========================================================
      - name: Build MoneyTracker APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ==========================================================
      # SEARCH APK
      # ==========================================================
      - name: Search for APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo ""
          echo "Searching for APK/AAB files..."

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print || true

          echo ""
          echo "bin directory:"

          if [ -d bin ]; then
            ls -lah bin
          else
            echo "bin directory does not exist."
          fi


      # ==========================================================
      # UPLOAD APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error
          compression-level: 6
          overwrite: true


      # ==========================================================
      # UPLOAD BUILDOZER LOGS
      #
      # Hidden files MUST be enabled because .buildozer starts
      # with a dot.
      # ==========================================================
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/**
          if-no-files-found: warn
          compression-level: 6
          overwrite: true
          include-hidden-files: true
