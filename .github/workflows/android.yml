name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. JAVA 17
      #
      # No Gradle cache.
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 3. PYTHON 3.11.13
      #
      # No Python dependency cache.
      # This avoids requirements.txt / pyproject.toml errors.
      # ------------------------------------------------------------
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      # ------------------------------------------------------------
      # 4. VERIFY BASIC ENVIRONMENT
      # ------------------------------------------------------------
      - name: Verify Python and Java
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"
          python --version
          python -m pip --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

      # ------------------------------------------------------------
      # 5. SETUP ANDROID SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 6. INSTALL ANDROID COMPONENTS
      # ------------------------------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "ANDROID SDK INFORMATION"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo "========================================"
          echo "ACCEPT ANDROID LICENSES"
          echo "========================================"

          yes | "$SDKMANAGER" --licenses || true

          echo "========================================"
          echo "INSTALL REQUIRED PACKAGES"
          echo "========================================"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "========================================"
          echo "VERIFY BUILD TOOLS"
          echo "========================================"

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          test -d "$BUILD_TOOLS_DIR"

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"

          ls -lah "$BUILD_TOOLS_DIR"

          echo "========================================"
          echo "VERIFY AIDL"
          echo "========================================"

          test -x "$BUILD_TOOLS_DIR/aidl"

          "$BUILD_TOOLS_DIR/aidl" --version || true

          echo "========================================"
          echo "VERIFY AAPT2"
          echo "========================================"

          test -x "$BUILD_TOOLS_DIR/aapt2"

          "$BUILD_TOOLS_DIR/aapt2" version || true

          echo "========================================"
          echo "VERIFY NDK"
          echo "========================================"

          NDK_DIR="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          test -d "$NDK_DIR"

          ls -lah "$NDK_DIR" | head -50

          echo "========================================"
          echo "VERIFY ANDROID PLATFORM"
          echo "========================================"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          echo "ANDROID SDK READY"

      # ------------------------------------------------------------
      # 7. EXPORT ANDROID PATHS
      # ------------------------------------------------------------
      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          NDK_DIR="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          echo "========================================"
          echo "ANDROID PATHS CONFIGURED"
          echo "========================================"

          echo "SDK=$ANDROID_HOME"
          echo "BUILD_TOOLS=$BUILD_TOOLS_DIR"
          echo "NDK=$NDK_DIR"

      # ------------------------------------------------------------
      # 8. INSTALL LINUX BUILD DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache

      # ------------------------------------------------------------
      # 9. INSTALL BUILDOZER + P4A
      # ------------------------------------------------------------
      - name: Install Buildozer and Python-for-Android
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<27" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==0.29.34" \
            "buildozer==1.6.0" \
            "python-for-android==2026.5.9"

          echo "========================================"
          echo "VERIFY BUILD TOOLS"
          echo "========================================"

          buildozer --version
          p4a --version

      # ------------------------------------------------------------
      # 10. LOCATE PROJECT
      #
      # Automatically finds buildozer.spec.
      # ------------------------------------------------------------
      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR BUILDOZER.SPEC"
          echo "========================================"

          SPEC_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "buildozer.spec" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found."

            echo "Repository files:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/buildozer.spec"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT CONTENT"
          echo "========================================"

          ls -lah "$PROJECT_DIR"

      # ------------------------------------------------------------
      # 11. VERIFY PROJECT CONFIGURATION
      # ------------------------------------------------------------
      - name: Verify Buildozer configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER SETTINGS"
          echo "========================================"

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.' \
            buildozer.spec \
            || true

          echo "========================================"
          echo "CURRENT BUILD TOOLS"
          echo "========================================"

          ls -lah \
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"

          echo "========================================"
          echo "CURRENT NDK"
          echo "========================================"

          echo "$ANDROID_NDK"

          test -d "$ANDROID_NDK"

      # ------------------------------------------------------------
      # 12. CLEAN OLD BUILDOZER CACHE
      #
      # Source code is NOT deleted.
      # ------------------------------------------------------------
      - name: Clean old Buildozer cache
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer

          mkdir -p bin

          echo "Old Buildozer cache removed."
          echo "Source files preserved."

      # ------------------------------------------------------------
      # 13. BUILD APK
      # ------------------------------------------------------------
      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "FINAL ENVIRONMENT"
          echo "========================================"

          python --version
          java -version
          buildozer --version
          p4a --version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK=$ANDROID_NDK"

          echo "========================================"
          echo "VERIFY BUILD TOOLS 37"
          echo "========================================"

          test -d \
            "$ANDROID_HOME/build-tools/37.0.0"

          test -x \
            "$ANDROID_HOME/build-tools/37.0.0/aidl"

          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER FINISHED"
          echo "========================================"

      # ------------------------------------------------------------
      # 14. VERIFY APK
      # ------------------------------------------------------------
      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(find . \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "bin directory:"
            ls -lah bin || true

            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK_FILE"

      # ------------------------------------------------------------
      # 15. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 16. FINAL SUCCESS MESSAGE
      # ------------------------------------------------------------
      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"
          echo "Artifact: MoneyTracker-APK"
