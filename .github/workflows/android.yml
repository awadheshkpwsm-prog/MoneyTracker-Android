name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-android:

    name: Build MoneyTracker Android APK

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 4. LINUX DEPENDENCIES
      # ==========================================================

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            build-essential


      # ==========================================================
      # 5. INSTALL BUILDOZER
      # ==========================================================

      - name: Install Buildozer and Cython
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo ""
          echo "CYTHON"

          cython --version


      # ==========================================================
      # 6. VERIFY PROJECT
      # ==========================================================

      - name: Verify MoneyTracker project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root:"
          ls -lah

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo ""
          echo "Checking mt directory..."

          test -d mt

          echo ""
          echo "MT files:"

          find mt -maxdepth 2 -type f -print | sort


      # ==========================================================
      # 7. VERIFY BUILD CONFIGURATION
      # ==========================================================

      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          grep -E \
            '^(android.api|android.minapi|android.ndk|android.build_tools_version|p4a.branch|android.archs|requirements)' \
            buildozer.spec


      # ==========================================================
      # 8. CREATE BUILDOZER DIRECTORIES
      # ==========================================================

      - name: Prepare Buildozer directories
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          echo "Buildozer directory:"
          ls -lah "$HOME/.buildozer/android/platform"


      # ==========================================================
      # 9. INSTALL ANDROID COMMAND LINE TOOLS
      # ==========================================================

      - name: Install Android command line tools
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          echo "SDK=$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-commandline-tools.zip

          rm -rf "$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$RUNNER_TEMP/android-cmdline-tools"

          unzip -q \
            android-commandline-tools.zip \
            -d "$RUNNER_TEMP/android-cmdline-tools"

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          echo ""
          echo "Command line tools installed."

          echo ""
          echo "Contents:"

          find "$SDK/cmdline-tools/latest" \
            -maxdepth 2 \
            -type f \
            | head -50


      # ==========================================================
      # 10. CREATE OLD SDK TOOLS COMPATIBILITY PATH
      #
      # IMPORTANT:
      #
      # Old Buildozer/p4a looks for:
      #
      # android-sdk/tools/bin/sdkmanager
      #
      # Modern Android tools use:
      #
      # android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # This compatibility link fixes that mismatch.
      # ==========================================================

      - name: Create SDK tools compatibility path
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "CREATING SDK TOOLS COMPATIBILITY PATH"
          echo "=========================================="

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools"

          ln -s \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/bin"

          echo ""
          echo "sdkmanager compatibility path:"

          ls -lah "$SDK/tools"

          echo ""
          echo "Checking sdkmanager:"

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version


      # ==========================================================
      # 11. SET SDK PATH
      # ==========================================================

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"


      # ==========================================================
      # 12. ACCEPT LICENSES
      # ==========================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$SDK" \
            --licenses || true


      # ==========================================================
      # 13. INSTALL EXACT SDK COMPONENTS
      #
      # API 35
      # BUILD TOOLS 37.0.0
      # PLATFORM TOOLS
      # ==========================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK COMPONENTS"
          echo "=========================================="

          sdkmanager \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"


      # ==========================================================
      # 14. VERIFY SDK
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "Installed packages:"

          sdkmanager \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "Build Tools:"

          test -d "$SDK/build-tools/37.0.0"

          ls -lah "$SDK/build-tools/37.0.0"

          echo ""
          echo "AIDL:"

          test -x "$SDK/build-tools/37.0.0/aidl"

          ls -lh "$SDK/build-tools/37.0.0/aidl"

          echo ""
          echo "AAPT2:"

          test -x "$SDK/build-tools/37.0.0/aapt2"

          echo ""
          echo "D8:"

          test -x "$SDK/build-tools/37.0.0/d8"

          echo ""
          echo "SDKMANAGER:"

          test -x "$SDK/tools/bin/sdkmanager"

          echo "SDKMANAGER OK"


      # ==========================================================
      # 15. VERIFY JAVA / PYTHON / BUILDOZER
      # ==========================================================

      - name: Final environment check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL ENVIRONMENT CHECK"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"


      # ==========================================================
      # 16. BUILD APK
      # ==========================================================

      - name: Build MoneyTracker APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDKMANAGER:"
          test -x \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

          echo ""
          echo "AIDL:"
          test -x \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ==========================================================
      # 17. FIND APK
      # ==========================================================

      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          if [ -d bin ]; then

            find bin \
              -type f \
              -name "*.apk" \
              -print

            echo ""
            echo "APK DETAILS:"

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "bin directory not found."

          fi


      # ==========================================================
      # 18. UPLOAD APK
      # ==========================================================

      - name: Upload MoneyTracker APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
