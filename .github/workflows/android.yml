name: Money Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"

      ANDROID_API: "33"
      ANDROID_MIN_API: "21"
      ANDROID_BUILD_TOOLS: "33.0.2"

      ANDROID_NDK_VERSION: "28.2.13676358"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON 3.11
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          check-latest: false
          cache: ""


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # ============================================================
      # PYTHON BUILD DEPENDENCIES
      # ============================================================

      - name: Install Python build dependencies
        run: |
          set -eux

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          python -m pip install \
            "Cython==0.29.34" \
            "virtualenv" \
            "buildozer==1.6.0"

          python -m pip install \
            "sh>=2,<3" \
            appdirs \
            colorama \
            jinja2 \
            meson \
            ninja \
            toml \
            packaging \
            "setuptools" \
            wheel


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # ANDROID ENVIRONMENT
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "ANDROID SDK ENVIRONMENT"
          echo "========================================"

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ============================================================
      # INSTALL EXACT SDK COMPONENTS
      # ============================================================

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "========================================"
          echo "VERIFY SDK"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "Android API 33: OK"
          echo "Build Tools 33.0.2: OK"


      # ============================================================
      # FORCE BUILDOZER LEGACY SDKMANAGER PATH
      # ============================================================
      #
      # Buildozer 1.6.0 still checks:
      #
      #   $ANDROID_HOME/tools/bin/sdkmanager
      #
      # GitHub runner provides:
      #
      #   $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
      #
      # This symlink fixes ONLY that path mismatch.
      # ============================================================

      - name: Fix Buildozer sdkmanager path
        shell: bash
        run: |
          set -eux

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_HOME/tools/bin/avdmanager"

          test -x "$ANDROID_HOME/tools/bin/sdkmanager"

          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo "Buildozer sdkmanager compatibility path: OK"


      # ============================================================
      # INSTALL EXACT NDK
      # ============================================================

      - name: Install Android NDK 28.2.13676358
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "ndk;28.2.13676358"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "========================================"
          echo "NDK VERIFIED"
          echo "========================================"

          ls -lah "$ANDROID_HOME/ndk/28.2.13676358"


      # ============================================================
      # CHECK BUILD CONFIGURATION
      # ============================================================

      - name: Check build configuration
        shell: bash
        run: |
          set -eux

          test -f buildozer.spec

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version
          cython --version
          buildozer --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"

          echo "========================================"
          echo "SPEC"
          echo "========================================"

          cat buildozer.spec

                # ============================================================
      # CHECK BUILD TOOLS 37
      # ============================================================

      - name: Check Build Tools configuration
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "CHECK BUILD TOOLS CONFIGURATION"
          echo "========================================"

          echo "Configured Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          test "$ANDROID_BUILD_TOOLS" = "33.0.2"

          echo "Build Tools 33.0.2 configuration: OK"


      # ============================================================
      # CLEAN ONLY STALE p4a BUILD VENV
      # ============================================================
      #
      # Current error:
      #
      # Python 3.14 venv + incompatible pip state
      #
      # Delete only the stale p4a temporary build environment.
      # Do NOT delete the complete Buildozer cache here.
      # ============================================================

      - name: Remove stale p4a temporary venv
        shell: bash
        run: |
          set -eux

          find .buildozer/android/platform \
            -type d \
            -path "*/build/venv" \
            -prune \
            -exec rm -rf {} + || true

          echo "Stale p4a temporary venv removed."


      # ============================================================
      # FORCE HOST PYTHON 3.11 FOR P4A
      # ============================================================

      - name: Configure python-for-android host Python
        shell: bash
        run: |
          set -eux

          export HOSTPYTHON="$(command -v python)"

          echo "HOSTPYTHON=$HOSTPYTHON"

          "$HOSTPYTHON" --version

          echo "HOSTPYTHON=$HOSTPYTHON" >> "$GITHUB_ENV"

          echo "VIRTUAL_ENV=" >> "$GITHUB_ENV"


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build Money Tracker APK
        shell: bash
        run: |
          set -eux

          export BUILDOZER_WARN_ON_ROOT=0

          export PYTHONNOUSERSITE=1
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          export PIP_NO_INPUT=1

          export HOSTPYTHON="$(command -v python)"

          echo "========================================"
          echo "STARTING MONEY TRACKER APK BUILD"
          echo "========================================"

          echo "Python:"
          "$HOSTPYTHON" --version

          echo "Python path:"
          echo "$HOSTPYTHON"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          echo "$ANDROID_NDK"

          echo "Android API:"
          echo "$ANDROID_API"

          echo "Android Min API:"
          echo "$ANDROID_MIN_API"

          echo "Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "APK SEARCH"
          echo "========================================"

          find . -type f -name "*.apk" -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"

          echo "APK BUILD SUCCESSFUL."


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
