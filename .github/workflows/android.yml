name: Build Money Tracker Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Money Tracker APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      # =====================================================
      # BUILD TOOLCHAIN
      # =====================================================
      PYTHON_VERSION: "3.11.13"
      JAVA_VERSION: "17"

      ANDROID_API: "33"
      ANDROID_MIN_API: "21"
      ANDROID_BUILD_TOOLS: "33.0.2"
      ANDROID_NDK_VERSION: "28.2.13676358"

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. PYTHON 3.11.13
      # =====================================================
      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: ""

      # =====================================================
      # 3. JAVA 17
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: ""

      # =====================================================
      # 4. SYSTEM DEPENDENCIES
      # =====================================================
      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            build-essential \
            ccache \
            cmake \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip

      # =====================================================
      # 5. VERIFY PYTHON / JAVA
      # =====================================================
      - name: Verify Python and Java
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python3 --version
          which python
          which python3

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

      # =====================================================
      # 6. INSTALL BUILDOZER
      # =====================================================
      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<26" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.34" \
            "sh"

      # =====================================================
      # 7. VERIFY BUILDOZER
      # =====================================================
      - name: Verify Buildozer
        run: |
          set -eux

          buildozer --version

          python -c "import Cython; print('Cython:', Cython.__version__)"

          python -c "import buildozer; print('Buildozer:', buildozer.__version__)"

      # =====================================================
      # 8. CONFIGURE RUNNER ANDROID SDK
      # =====================================================
      - name: Configure Android SDK
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          test -d "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"

          echo "SDK configured:"
          echo "$SDK"

      # =====================================================
      # 9. INSTALL EXACT ANDROID SDK COMPONENTS
      # =====================================================
      - name: Install exact Android SDK components
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "========================================"
          echo "VERIFY API 33"
          echo "========================================"

          test -d "$SDK/platforms/android-33"

          echo "========================================"
          echo "VERIFY BUILD TOOLS 33.0.2"
          echo "========================================"

          test -d "$SDK/build-tools/33.0.2"

          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "AIDL found:"
          ls -lh "$SDK/build-tools/33.0.2/aidl"

      # =====================================================
      # 10. INSTALL EXACT NDK 28c
      # =====================================================
      - name: Install exact Android NDK r28c
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          test -d "$SDK/ndk/28.2.13676358"

          echo "========================================"
          echo "NDK INSTALLED"
          echo "========================================"

          ls -lah "$SDK/ndk/28.2.13676358"

      # =====================================================
      # 11. CONFIGURE ANDROID NDK
      # =====================================================
      - name: Configure Android NDK
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/28.2.13676358"

          test -d "$NDK"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "NDKAPI=21" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

      # =====================================================
      # 12. TARGETED FIX FOR BUILDOZER 1.6.0
      #
      # Buildozer 1.6.0 looks for:
      #
      #   $ANDROIDSDK/tools/bin/sdkmanager
      #
      # Runner actually has:
      #
      #   $ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager
      #
      # Create compatibility symlink.
      # =====================================================
      - name: Fix Buildozer sdkmanager path
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          echo "========================================"
          echo "BUILDOZER SDKMANAGER COMPATIBILITY FIX"
          echo "========================================"

          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          test -e "$SDK/tools/bin/sdkmanager"

          test -x "$SDK/tools/bin/sdkmanager"

          echo "Expected Buildozer path:"
          ls -lah "$SDK/tools/bin/sdkmanager"

          echo "Real sdkmanager:"
          readlink -f "$SDK/tools/bin/sdkmanager"

          echo "sdkmanager version:"
          "$SDK/tools/bin/sdkmanager" --version

      # =====================================================
      # 13. VERIFY EXACT TOOLCHAIN
      # =====================================================
      - name: Verify Android toolchain
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          test -d "$SDK"

          echo "========================================"
          echo "SDK 33"
          echo "========================================"

          test -d "$SDK/platforms/android-33"

          echo "========================================"
          echo "BUILD TOOLS 33.0.2"
          echo "========================================"

          test -d "$SDK/build-tools/33.0.2"

          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          test -x "$SDK/tools/bin/sdkmanager"

          readlink -f "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "========================================"
          echo "NDK 28c"
          echo "========================================"

          test -d "$NDK"
          test -f "$NDK/source.properties"

          cat "$NDK/source.properties"

      # =====================================================
      # 14. VERIFY BUILDOZER SPEC
      # =====================================================
      - name: Verify buildozer.spec
        run: |
          set -eux

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOVER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "REQUIRED SETTINGS"
          echo "========================================"

          grep -E \
            'android.api|android.minapi|android.ndk|android.ndk_api|android.sdk_path|android.ndk_path|android.build_tools_version|android.archs|android.skip_update|requirements' \
            buildozer.spec

      # =====================================================
      # 15. VALIDATE SPEC
      # =====================================================
      - name: Validate buildozer.spec
        run: |
          set -eux

          grep -q '^android.api = 33$' buildozer.spec

          grep -q '^android.minapi = 21$' buildozer.spec

          grep -q '^android.ndk = 28c$' buildozer.spec

          grep -q '^android.ndk_api = 21$' buildozer.spec

          grep -q '^android.build_tools_version = 33.0.2$' buildozer.spec

          grep -q '^android.sdk_path = /usr/local/lib/android/sdk$' buildozer.spec

          grep -q '^android.ndk_path = /usr/local/lib/android/sdk/ndk/28.2.13676358$' buildozer.spec

          grep -q '^android.skip_update = True$' buildozer.spec

          echo "========================================"
          echo "SPEC VALIDATION PASSED"
          echo "========================================"

      # =====================================================
      # 16. CLEAN PROJECT BUILDOZER STATE
      #
      # IMPORTANT:
      # Do NOT delete runner Android SDK/NDK.
      # =====================================================
      - name: Clean project Buildozer state
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # =====================================================
      # 17. FINAL SDKMANAGER CHECK
      #
      # Make sure the symlink still exists immediately
      # before Buildozer starts.
      # =====================================================
      - name: Final Buildozer SDK check
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          echo "========================================"
          echo "FINAL BUILDOZER SDK CHECK"
          echo "========================================"

          test -x "$SDK/tools/bin/sdkmanager"

          echo "Buildozer expected sdkmanager:"
          ls -lah "$SDK/tools/bin/sdkmanager"

          echo "Resolved sdkmanager:"
          readlink -f "$SDK/tools/bin/sdkmanager"

          echo "Version:"
          "$SDK/tools/bin/sdkmanager" --version

      # =====================================================
      # 18. BUILD APK
      # =====================================================
      - name: Build Android APK
        run: |
          set -eux

          export BUILDOZER_WARN_ON_ROOT=0

          echo "========================================"
          echo "STARTING MONEY TRACKER APK BUILD"
          echo "========================================"

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          buildozer -v android debug

      # =====================================================
      # 19. FIND APK / AAB
      # =====================================================
      - name: Find APK and AAB
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "APK / AAB SEARCH"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print

          echo ""
          echo "AAB files:"
          find . -type f -name "*.aab" -print

          echo ""
          echo "bin directory:"
          ls -lah bin 2>/dev/null || true

          echo ""
          echo "Buildozer directory:"
          ls -lah .buildozer 2>/dev/null || true

      # =====================================================
      # 20. UPLOAD APK
      # =====================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
          if-no-files-found: error

      # =====================================================
      # 21. UPLOAD BUILD LOGS ON FAILURE
      # =====================================================
      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Build-Logs
          path: |
            .buildozer/
          if-no-files-found: warn
