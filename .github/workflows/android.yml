name: Money Tracker Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Find Money Tracker ZIP
        run: |
          echo "Searching for ZIP..."
          find . -type f -iname "*.zip" -print

      - name: Extract Money Tracker project
        run: |
          ZIP_FILE=$(find . -type f -iname "MoneyTracker_Android_APK_Build.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MoneyTracker_Android_APK_Build.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Buildozer project
        run: |
          PROJECT=$(find extracted -name buildozer.spec -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_DIR"

      - name: Check project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/buildozer.spec"
          test -f "$PROJECT_DIR/main.py"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Install Python build tools
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Debug-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
