name: Build MoneyTracker APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # PYTHON 3.11
      # =========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip


      # =========================================================
      # SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev \
            libreadline-dev \
            libsqlite3-dev \
            ccache \
            build-essential


      # =========================================================
      # PYTHON BUILD DEPENDENCIES
      # =========================================================

      - name: Install Python build dependencies
        run: |
          set -e

          python -m pip install --upgrade \
            "pip<26" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "cython==0.29.34"

          python -m pip install \
            "buildozer==1.6.0"


      # =========================================================
      # SHOW VERSIONS
      # =========================================================

      - name: Show build environment
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version


      # =========================================================
      # VERIFY BUILD SPEC
      # =========================================================

      - name: Verify buildozer.spec
        run: |
          set -e

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo "=========================================="
          echo "BUILD SPEC"
          echo "=========================================="

          cat buildozer.spec


      # =========================================================
      # VERIFY SOURCE
      # =========================================================

      - name: Verify MoneyTracker source
        run: |
          set -e

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py not found!"
            exit 1
          fi

          echo "main.py found."

          if [ -d "mt" ]; then
            echo "mt/ backend found."
            find mt -maxdepth 2 -type f | sort
          else
            echo "WARNING: mt/ directory not found."
          fi


      # =========================================================
      # CLEAN OLD BUILD DATA
      #
      # Prevents old broken p4a/pip virtual environments
      # from being reused.
      # =========================================================

      - name: Clean Buildozer state
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING OLD BUILDOZER STATE"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin
          rm -rf "$HOME/.buildozer"

          mkdir -p "$HOME/.buildozer"

          echo "Old build state removed."


      # =========================================================
      # ANDROID SDK
      #
      # IMPORTANT:
      # Do NOT create the old tools/bin sdkmanager symlink.
      # Buildozer compatibility is handled through the actual
      # cmdline-tools/latest installation.
      # =========================================================

      - name: Install Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip -d cmdline-tools

          rm -f commandlinetools.zip

          if [ ! -d "$SDK/cmdline-tools/cmdline-tools" ]; then
            echo "ERROR: Android command line tools were not extracted correctly."
            exit 1
          fi

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          touch "$SDK/repositories.cfg"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Checking sdkmanager..."

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # =========================================================
      # ANDROID SDK PACKAGES
      # =========================================================

      - name: Install Android SDK packages
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "=========================================="
          echo "ACCEPTING ANDROID LICENSES"
          echo "=========================================="

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          echo ""
          echo "=========================================="
          echo "INSTALLING SDK PACKAGES"
          echo "=========================================="

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"


      # =========================================================
      # VERIFY SDK
      # =========================================================

      - name: Verify Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "Installed packages:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed

          echo ""
          echo "Checking AIDL..."

          test -x "$SDK/build-tools/33.0.2/aidl"

          "$SDK/build-tools/33.0.2/aidl" --help >/dev/null

          echo "AIDL OK"

          echo ""
          echo "Checking AAPT..."

          test -x "$SDK/build-tools/33.0.2/aapt"

          "$SDK/build-tools/33.0.2/aapt" version

          echo ""
          echo "Checking ADB..."

          test -x "$SDK/platform-tools/adb"

          "$SDK/platform-tools/adb" version


      # =========================================================
      # INSTALL NDK r28c
      #
      # r28c = Android NDK 28.2.13676358
      # =========================================================

      - name: Install Android NDK r28c
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "=========================================="
          echo "INSTALLING ANDROID NDK r28c"
          echo "=========================================="

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          echo ""
          echo "Installed NDK directories:"

          ls -lah "$SDK/ndk"

          if [ ! -d "$SDK/ndk/28.2.13676358" ]; then
            echo "ERROR: NDK r28c was not installed."
            exit 1
          fi

          echo ""
          echo "NDK r28c verified."


      # =========================================================
      # CONFIGURE BUILD
      #
      # Use the p4a version selected by buildozer.spec.
      # =========================================================

      - name: Configure Buildozer
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "Buildozer version:"
          buildozer --version

          echo ""
          echo "buildozer.spec:"
          cat buildozer.spec


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build MoneyTracker APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # =========================================================
      # SEARCH FOR APK
      # =========================================================

      - name: Search APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo ""
          echo "Searching for APK/AAB files..."

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            -exec ls -lh {} \; \
            || true


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: |
            bin/*.apk
            .buildozer/**/*.apk
          if-no-files-found: error


      # =========================================================
      # SAVE BUILD LOGS IF BUILD FAILS
      # =========================================================

      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-build-logs
          path: |
            .buildozer/
          if-no-files-found: warn
