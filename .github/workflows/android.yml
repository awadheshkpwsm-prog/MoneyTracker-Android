name: MoneyTracker Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

  PYTHON_VERSION: "3.11.13"
  JAVA_VERSION: "17"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

  BUILDOZER_WARN_ON_ROOT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build-apk:
    name: Build MoneyTracker APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      #
      # KEEP SIMPLE.
      # NO CACHE SETTING.
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11.13
      #
      # NO CACHE SETTING.
      # ============================================================

      - name: Setup Python 3.11.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"


      # ============================================================
      # 4. VERIFY PYTHON + JAVA
      # ============================================================

      - name: Verify Python and Java
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version


      # ============================================================
      # 5. INSTALL LINUX BUILD DEPENDENCIES
      # ============================================================

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            rsync \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache


      # ============================================================
      # 6. INSTALL BUILDOZER + P4A
      # ============================================================

      - name: Install Buildozer and Python-for-Android
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade \
            "pip<27" \
            "setuptools<81" \
            wheel

          python -m pip install \
            "Cython==0.29.34" \
            "buildozer==1.6.0" \
            "python-for-android==2026.5.9"

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "P4A"
          echo "========================================"

          p4a --version


      # ============================================================
      # 7. FIND PROJECT
      # ============================================================

      - name: Locate Buildozer project
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR BUILDOZER.SPEC"
          echo "========================================"

          SPEC_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "buildozer.spec" \
              -not -path "*/.git/*" \
              | head -n 1
          )"

          if [ -z "$SPEC_FILE" ]; then

            echo "ERROR: buildozer.spec not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1

          fi

          PROJECT_DIR="$(dirname "$SPEC_FILE")"

          echo "SPEC_FILE=$SPEC_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/buildozer.spec"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT CONTENT"
          echo "========================================"

          ls -lah "$PROJECT_DIR"


      # ============================================================
      # 8. CREATE BUILDOZER DEFAULT SDK DIRECTORY
      #
      # IMPORTANT:
      #
      # Buildozer itself expects:
      #
      # /home/runner/.buildozer/android/platform/android-sdk
      #
      # Therefore THAT becomes the Android SDK used by Buildozer.
      #
      # We do NOT point Buildozer to:
      #
      # /usr/local/lib/android/sdk
      #
      # ============================================================

      - name: Prepare Buildozer default Android SDK
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          HOST_SDK="/usr/local/lib/android/sdk"

          echo "========================================"
          echo "BUILDOZER DEFAULT SDK"
          echo "========================================"

          echo "BUILDOZER_SDK=$BUILDOZER_SDK"

          mkdir -p "$BUILDOZER_SDK"

          echo "========================================"
          echo "COPY COMMAND LINE TOOLS"
          echo "========================================"

          test -d "$HOST_SDK"

          if [ -d "$HOST_SDK/cmdline-tools/latest" ]; then

            mkdir -p "$BUILDOZER_SDK/cmdline-tools"

            rm -rf \
              "$BUILDOZER_SDK/cmdline-tools/latest"

            cp -a \
              "$HOST_SDK/cmdline-tools/latest" \
              "$BUILDOZER_SDK/cmdline-tools/latest"

          else

            echo "ERROR: Android command line tools not found."

            find "$HOST_SDK" \
              -type f \
              -name sdkmanager \
              -print

            exit 1

          fi

          echo "========================================"
          echo "BUILDOZER SDKMANAGER"
          echo "========================================"

          SDKMANAGER="$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version || true


      # ============================================================
      # 9. INSTALL 37 + PLATFORM + NDK INTO BUILDOZER SDK
      # ============================================================

      - name: Install Android components in Buildozer SDK
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "========================================"
          echo "ACCEPT LICENSES"
          echo "========================================"

          yes | "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            --licenses \
            || true

          echo "========================================"
          echo "INSTALL BUILD TOOLS 37.0.0"
          echo "========================================"

          "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            "build-tools;37.0.0"

          echo "========================================"
          echo "INSTALL PLATFORM TOOLS"
          echo "========================================"

          "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            "platform-tools"

          echo "========================================"
          echo "INSTALL ANDROID API 33"
          echo "========================================"

          "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            "platforms;android-33"

          echo "========================================"
          echo "INSTALL NDK 28.2.13676358"
          echo "========================================"

          "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            "ndk;28.2.13676358"


      # ============================================================
      # 10. ACCEPT LICENSES AFTER INSTALL
      # ============================================================

      - name: Verify Android licenses
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "ANDROID LICENSES"
          echo "========================================"

          yes | "$SDKMANAGER" \
            --sdk_root="$BUILDOZER_SDK" \
            --licenses \
            || true

          echo "========================================"
          echo "LICENSE FILES"
          echo "========================================"

          ls -lah \
            "$BUILDOZER_SDK/licenses" \
            || true


      # ============================================================
      # 11. SET ENVIRONMENT TO BUILDOZER SDK
      #
      # EVERYTHING USES:
      #
      # /home/runner/.buildozer/android/platform/android-sdk
      #
      # ============================================================

      - name: Configure Buildozer Android environment
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          BUILD_TOOLS_DIR="$BUILDOZER_SDK/build-tools/37.0.0"

          NDK_DIR="$BUILDOZER_SDK/ndk/28.2.13676358"

          echo "========================================"
          echo "CONFIGURING BUILDOZER SDK"
          echo "========================================"

          echo "ANDROID_HOME=$BUILDOZER_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$BUILDOZER_SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo "ANDROID_BUILD_TOOLS=37.0.0" >> "$GITHUB_ENV"

          echo "$BUILDOZER_SDK/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo "$BUILDOZER_SDK/platform-tools" \
            >> "$GITHUB_PATH"

          echo "$BUILD_TOOLS_DIR" \
            >> "$GITHUB_PATH"

          echo "========================================"
          echo "BUILDOZER SDK CONFIGURED"
          echo "========================================"

          echo "SDK=$BUILDOZER_SDK"
          echo "BUILD_TOOLS=$BUILD_TOOLS_DIR"
          echo "NDK=$NDK_DIR"


      # ============================================================
      # 12. VERIFY BUILD TOOLS 37 / AIDL / AAPT2 / NDK
      # ============================================================

      - name: Verify Buildozer Android SDK
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "ANDROID HOME"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          test "$ANDROID_HOME" = "$BUILDOZER_SDK"
          test "$ANDROID_SDK_ROOT" = "$BUILDOZER_SDK"
          test "$ANDROIDSDK" = "$BUILDOZER_SDK"

          echo "========================================"
          echo "BUILD TOOLS 37"
          echo "========================================"

          test -d \
            "$BUILDOZER_SDK/build-tools/37.0.0"

          echo "Build Tools 37.0.0: INSTALLED"

          echo "========================================"
          echo "AIDL"
          echo "========================================"

          test -x \
            "$BUILDOZER_SDK/build-tools/37.0.0/aidl"

          "$BUILDOZER_SDK/build-tools/37.0.0/aidl" \
            --version \
            || true

          echo "AIDL: READY"

          echo "========================================"
          echo "AAPT2"
          echo "========================================"

          test -x \
            "$BUILDOZER_SDK/build-tools/37.0.0/aapt2"

          "$BUILDOZER_SDK/build-tools/37.0.0/aapt2" \
            version \
            || true

          echo "AAPT2: READY"

          echo "========================================"
          echo "ANDROID API 33"
          echo "========================================"

          test -d \
            "$BUILDOZER_SDK/platforms/android-33"

          echo "Android API 33: READY"

          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -d \
            "$BUILDOZER_SDK/ndk/28.2.13676358"

          echo "NDK 28.2.13676358: READY"


      # ============================================================
      # 13. VERIFY BUILDOZER SPEC
      # ============================================================

      - name: Verify Buildozer configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          test -f buildozer.spec

          grep -n -E \
            'android\.api|android\.minapi|android\.ndk|android\.build_tools_version|android\.archs|p4a\.' \
            buildozer.spec \
            || true


      # ============================================================
      # 14. CLEAN PROJECT BUILDOZER CACHE
      #
      # Source files are NOT deleted.
      # ============================================================

      - name: Clean project Buildozer cache
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          rm -rf .buildozer

          mkdir -p bin

          echo "========================================"
          echo "BUILDOZER PROJECT CACHE CLEANED"
          echo "========================================"

          echo "Source files preserved."


      # ============================================================
      # 15. FINAL ENVIRONMENT CHECK
      # ============================================================

      - name: Final Buildozer environment check
        shell: bash
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "FINAL ENVIRONMENT"
          echo "========================================"

          python --version

          java -version

          buildozer --version

          p4a --version

          echo "========================================"
          echo "ANDROID PATH"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "========================================"
          echo "VERIFY BUILDOZER DEFAULT SDK"
          echo "========================================"

          test "$ANDROID_HOME" = "$BUILDOZER_SDK"

          echo "Buildozer SDK path: CORRECT"

          echo "========================================"
          echo "VERIFY BUILD TOOLS 37"
          echo "========================================"

          test -d \
            "$BUILDOZER_SDK/build-tools/37.0.0"

          test -x \
            "$BUILDOZER_SDK/build-tools/37.0.0/aidl"

          test -x \
            "$BUILDOZER_SDK/build-tools/37.0.0/aapt2"

          echo "Build Tools 37.0.0: READY"

          echo "========================================"
          echo "VERIFY NDK"
          echo "========================================"

          test -d \
            "$BUILDOZER_SDK/ndk/28.2.13676358"

          echo "NDK 28.2.13676358: READY"


      # ============================================================
      # 16. BUILD APK
      #
      # MANUAL ONLY:
      # workflow_dispatch
      # ============================================================

      - name: Build MoneyTracker APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "STARTING APK BUILD"
          echo "========================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "P4A:"
          p4a --version

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

          test "$ANDROID_HOME" = "$BUILDOZER_SDK"

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          test -d \
            "$BUILDOZER_SDK/build-tools/37.0.0"

          test -x \
            "$BUILDOZER_SDK/build-tools/37.0.0/aidl"

          echo "Build Tools 37.0.0 confirmed."

          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -d \
            "$BUILDOZER_SDK/ndk/28.2.13676358"

          echo "NDK confirmed."

          echo "========================================"
          echo "RUNNING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

          echo "========================================"
          echo "BUILDOZER BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 17. FIND APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find . \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo "========================================"
            echo "BIN"
            echo "========================================"

            ls -lah bin || true

            exit 1

          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          echo "$APK_FILE"

          ls -lh "$APK_FILE"


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================

      - name: Upload MoneyTracker APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. BUILD SUCCESS
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "MONEYTRACKER APK BUILD COMPLETED"
          echo "========================================"

          echo "Build Tools: 37.0.0"
          echo "Android API: 33"
          echo "NDK: 28.2.13676358"
          echo "Python: 3.11.13"
          echo "Java: 17"
          echo "Buildozer: 1.6.0"
          echo "P4A: 2026.05.09"

          echo "========================================"
          echo "APK ARTIFACT"
          echo "========================================"

          echo "MoneyTracker-APK"
