name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Accept All Android Licenses
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "build-tools;37.0.0"

      - name: Accept Licenses Again
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Verify SDK
        run: |
          echo "======================================"
          echo "INSTALLED SDK PACKAGES"
          echo "======================================"

          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --list_installed || true

          echo ""
          echo "======================================"
          echo "BUILD TOOLS"
          echo "======================================"

          ls -lah "$ANDROID_HOME/build-tools"

          echo ""
          echo "======================================"
          echo "AIDL 33"
          echo "======================================"

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          "$ANDROID_HOME/build-tools/33.0.2/aidl" \
            --help >/dev/null

          echo "AIDL 33.0.2 OK"

          echo ""
          echo "======================================"
          echo "AIDL 37"
          echo "======================================"

          if [ -f "$ANDROID_HOME/build-tools/37.0.0/aidl" ]; then
            echo "AIDL 37.0.0 found"
            "$ANDROID_HOME/build-tools/37.0.0/aidl" \
              --help >/dev/null || true
          else
            echo "Build Tools 37.0.0 AIDL not found"
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install "Cython<3"
          pip install buildozer==1.5.0

      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Final License Check
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Show Build Environment
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Check APK
        if: always()
        run: |
          echo "======================================"
          echo "APK OUTPUT"
          echo "======================================"

          ls -lah bin || true

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
