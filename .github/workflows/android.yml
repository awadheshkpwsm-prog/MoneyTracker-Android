name: MoneyTracker Android Build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.34
          pip install buildozer==1.5.0

      - name: Show Versions
        run: |
          python --version
          java -version
          buildozer --version

      - name: Clean Previous Build
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin

      - name: Show buildozer.spec
        run: |
          cat buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk"
          find . -name "*.aab"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk

      - name: Upload Failure Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-Failure-Logs
          path: |
            .buildozer
            buildozer.spec
