name: Build MoneyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-android:

    name: Build MoneyTracker Android APK

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 4. LINUX DEPENDENCIES
      # ==========================================================

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            build-essential


      # ==========================================================
      # 5. INSTALL BUILDOZER + CYTHON
      # ==========================================================

      - name: Install Buildozer and Cython
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          echo "=========================================="
          echo "BUILDOZER VERSION"
          echo "=========================================="

          buildozer --version

          echo ""
          echo "=========================================="
          echo "CYTHON VERSION"
          echo "=========================================="

          cython --version


      # ==========================================================
      # 6. VERIFY MONEYTRACKER PROJECT
      # ==========================================================

      - name: Verify MoneyTracker project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -lah

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo "buildozer.spec OK"

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo "main.py OK"

          echo ""
          echo "Checking mt folder..."

          test -d mt

          echo "mt folder OK"

          echo ""
          echo "MT files:"

          find mt -maxdepth 2 -type f -print | sort


      # ==========================================================
      # 7. SHOW BUILD CONFIGURATION
      # ==========================================================

      - name: Show buildozer configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.ndk|android.build_tools_version|p4a.branch|android.archs)' \
            buildozer.spec || true


      # ==========================================================
      # 8. CREATE BUILDOZER PLATFORM DIRECTORY
      # ==========================================================

      - name: Prepare Buildozer directories
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          echo "=========================================="
          echo "BUILDOZER PLATFORM DIRECTORY"
          echo "=========================================="

          ls -lah "$HOME/.buildozer/android/platform"


      # ==========================================================
      # 9. INSTALL MODERN ANDROID COMMAND LINE TOOLS
      # ==========================================================

      - name: Install Android command line tools
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID COMMAND LINE TOOLS"
          echo "=========================================="

          echo "SDK:"
          echo "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          rm -f android-commandline-tools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-commandline-tools.zip

          rm -rf "$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$RUNNER_TEMP/android-cmdline-tools"

          unzip -q \
            android-commandline-tools.zip \
            -d "$RUNNER_TEMP/android-cmdline-tools"

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          echo ""
          echo "Command line tools installed."

          echo ""
          echo "Command line tools structure:"

          find "$SDK/cmdline-tools/latest" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ==========================================================
      # 10. CREATE FULL LEGACY TOOLS COMPATIBILITY LINK
      #
      # IMPORTANT:
      #
      # DO NOT link only:
      #
      # tools/bin -> cmdline-tools/latest/bin
      #
      # because sdkmanager needs its ../lib directory.
      #
      # Instead:
      #
      # tools -> cmdline-tools/latest
      #
      # This gives:
      #
      # tools/bin/sdkmanager
      # tools/lib/*
      #
      # while preserving the complete sdkmanager installation.
      # ==========================================================

      - name: Create SDK tools compatibility path
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "SDK TOOLS COMPATIBILITY"
          echo "=========================================="

          rm -rf "$SDK/tools"

          ln -s \
            "$SDK/cmdline-tools/latest" \
            "$SDK/tools"

          echo ""
          echo "SDK tools link:"

          ls -lah "$SDK"

          echo ""
          echo "tools directory:"

          ls -lah "$SDK/tools"

          echo ""
          echo "tools/bin:"

          ls -lah "$SDK/tools/bin"

          echo ""
          echo "tools/lib:"

          ls -lah "$SDK/tools/lib" | head -30

          echo ""
          echo "Checking sdkmanager executable..."

          test -x "$SDK/tools/bin/sdkmanager"

          echo "sdkmanager executable OK"

          echo ""
          echo "Testing sdkmanager..."

          "$SDK/tools/bin/sdkmanager" --version


      # ==========================================================
      # 11. SET ANDROID ENVIRONMENT
      # ==========================================================

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"


      # ==========================================================
      # 12. ACCEPT ANDROID LICENSES
      # ==========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "=========================================="
          echo "ACCEPTING ANDROID LICENSES"
          echo "=========================================="

          yes | sdkmanager \
            --sdk_root="$SDK" \
            --licenses || true


      # ==========================================================
      # 13. INSTALL SDK 35 + BUILD TOOLS 37
      # ==========================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK"
          echo "=========================================="

          sdkmanager \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"


      # ==========================================================
      # 14. VERIFY SDK + AIDL
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          command -v sdkmanager

          echo ""
          echo "sdkmanager version:"
          sdkmanager --version

          echo ""
          echo "Installed SDK packages:"

          sdkmanager \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "=========================================="
          echo "BUILD TOOLS 37.0.0"
          echo "=========================================="

          test -d "$SDK/build-tools/37.0.0"

          ls -lah "$SDK/build-tools/37.0.0"

          echo ""
          echo "Checking AIDL..."

          test -x "$SDK/build-tools/37.0.0/aidl"

          echo "AIDL executable found."

          echo ""
          echo "AIDL path:"

          command -v "$SDK/build-tools/37.0.0/aidl"

          echo ""
          echo "AIDL help test:"

          "$SDK/build-tools/37.0.0/aidl" --help >/dev/null

          echo "AIDL OK"

          echo ""
          echo "Checking AAPT2..."

          test -x "$SDK/build-tools/37.0.0/aapt2"

          echo "AAPT2 OK"

          echo ""
          echo "Checking D8..."

          test -x "$SDK/build-tools/37.0.0/d8"

          echo "D8 OK"

          echo ""
          echo "Checking ZIPALIGN..."

          test -x "$SDK/build-tools/37.0.0/zipalign"

          echo "ZIPALIGN OK"


      # ==========================================================
      # 15. JAVA / PYTHON / BUILDOZER CHECK
      # ==========================================================

      - name: Final environment check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL ENVIRONMENT CHECK"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"


      # ==========================================================
      # 16. BUILD APK
      # ==========================================================

      - name: Build MoneyTracker APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING MONEYTRACKER APK"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          test -x \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

          echo "SDKMANAGER OK"

          echo ""
          echo "AIDL:"
          test -x \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl"

          echo "AIDL OK"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ==========================================================
      # 17. SEARCH FOR APK
      # ==========================================================

      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          if [ -d bin ]; then

            echo ""
            echo "APK files:"

            find bin \
              -type f \
              -name "*.apk" \
              -print

            echo ""
            echo "APK details:"

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "bin directory not found."

          fi


      # ==========================================================
      # 18. UPLOAD APK ARTIFACT
      # ==========================================================

      - name: Upload MoneyTracker APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: bin/*.apk
          if-no-files-found: error
